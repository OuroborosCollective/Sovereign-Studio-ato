name: Sovereign repository job read-only diagnostic

on:
  push:
    branches: [diagnostic/sovereign-job-queue-2026-10-02]
    paths:
      - .github/workflows/sovereign-job-queue-diagnostic.yml
      - scripts/diagnose_sovereign_repository_queue.py

permissions:
  contents: read

jobs:
  job-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.SSH_USER }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.SSH_PORT || '22' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PW || secrets.SSH_PW || secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install distribution SSH client
        run: sudo apt-get update -qq && sudo apt-get install -qq --no-install-recommends sshpass
      - name: Read the exact reported job without executing or cancelling it
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$VPS_HOST" = '46.202.154.25'
          test "$VPS_USER" = 'root'
          test "$VPS_PORT" = '22'
          test -n "$SSHPASS"
          umask 077
          printf '%s\n' '46.202.154.25 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVZLyqUD5nlHXfk1sRA0v829TiZyxa5Bs4AS/G8eWLv' > "$RUNNER_TEMP/sovereign-diagnostic-known-hosts"
          test "$(ssh-keygen -lf "$RUNNER_TEMP/sovereign-diagnostic-known-hosts" | awk '{print $2}')" = 'SHA256:pskBohJoTx/V3iCPaD9m1sW1vchvhvGc89lKnX0RocQ'
          sshpass -e ssh -T -p "$VPS_PORT" -o ConnectTimeout=25 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$RUNNER_TEMP/sovereign-diagnostic-known-hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ClearAllForwardings=yes "$VPS_USER@$VPS_HOST" '/usr/bin/python3 - agent-daa7a634f282407d9cbe2b151e5c40a2 6378f00f3a42ffed37910d11465341ccfadbfb5a' < scripts/diagnose_sovereign_repository_queue.py > job-queue-readback.json
          python3 -m json.tool job-queue-readback.json
      - name: Preserve bounded read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-job-queue-readback
          path: job-queue-readback.json
          if-no-files-found: warn
          retention-days: 3
