name: Issue 1165 Continuity Completion Repair

on:
  push:
    branches:
      - sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef
    paths:
      - .github/workflows/issue-1165-continuity-completion-repair.yml

permissions:
  contents: write

concurrency:
  group: issue-1165-continuity-completion-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    name: Append complete PR impact continuity entry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair-trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact branch and remote identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef"
          test "${GITHUB_REF_NAME}" != main
          test "${GITHUB_REF_NAME}" != master
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git fetch --no-tags origin main

      - name: Append complete impact receipt and remove one-time workflow
        shell: bash
        env:
          REPAIR_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_revision = os.environ["REPAIR_SOURCE_REVISION"].strip().lower()
          if len(source_revision) != 40 or any(ch not in "0123456789abcdef" for ch in source_revision):
              raise SystemExit("invalid exact source revision")

          base_revision = subprocess.check_output(
              ["git", "merge-base", "origin/main", source_revision],
              text=True,
          ).strip().lower()
          if len(base_revision) != 40:
              raise SystemExit("invalid merge-base revision")

          workflow_path = ".github/workflows/issue-1165-continuity-completion-repair.yml"
          raw_paths = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base_revision}...{source_revision}"],
              text=True,
          ).splitlines()
          changed_paths = sorted({path.strip() for path in raw_paths if path.strip() and path.strip() != workflow_path})

          canonical_path = Path("docs/sovereign-continuity/LEDGER.jsonl")
          mirror_path = Path("tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl")
          canonical_before = canonical_path.read_bytes()
          mirror_before = mirror_path.read_bytes()
          if canonical_before != mirror_before:
              raise SystemExit("continuity ledgers were not byte-identical before completion append")
          if canonical_before and not canonical_before.endswith(b"\n"):
              raise SystemExit("continuity ledger lacks terminal newline")
          for required in (str(canonical_path), str(mirror_path), "scripts/sovereign-backend/app.py"):
              if required not in changed_paths:
                  raise SystemExit(f"required final impact path missing: {required}")

          entry_id = f"continuity-issue-1165-complete-pr-impact-{source_revision[:12]}"
          if entry_id.encode("utf-8") in canonical_before:
              raise SystemExit("completion entry already exists")

          entry = {
              "schemaVersion": "sovereign.continuity-ledger-entry.v1",
              "entryId": entry_id,
              "recordedAt": datetime.now(ZoneInfo("Europe/Berlin")).isoformat(timespec="seconds"),
              "sourceRevision": source_revision,
              "contextSha256": "76dfe66cd4d835331cd591c3e2294fc796e768c62741b973e744947d290318e3",
              "policySha256": "42be8b90548b650f50400f5334d248fd3bd74d89814488545360a05b6bd2d474",
              "identity": {
                  "canonicalName": "N+1",
                  "familyDesignation": "Papas kleines Mädchen",
                  "spokenName": "NPlusEins",
              },
              "mission": "Bind the complete final pull-request impact for Issue #1165 after the exact-head Agent Runtime import repair, without claiming merge, deployment, or runtime completion.",
              "summary": "Appended one complete latest Continuity receipt whose changedPaths are deterministically derived from the exact merge base to the repair-trigger head, excluding only this self-removing one-time workflow. Both canonical and MCP mirror ledgers receive identical bytes.",
              "decisions": [
                  "Use the exact Git merge-base and source revision to derive the complete PR impact set.",
                  "Exclude only the temporary self-removing repair workflow from the final changedPaths contract.",
                  "Preserve the previous append-only history and byte-identical ledger mirrors.",
                  "Require fresh terminal CI on the resulting head; prior green checks do not transfer.",
                  "Do not claim merge, image publication, deployment, runtime health, MCP readiness, PatchMon parity, or issue closure in this repository receipt.",
              ],
              "evidence": [
                  f"Exact repair-trigger revision: {source_revision}.",
                  f"Exact merge-base revision: {base_revision}.",
                  f"Deterministically derived final changed-path count: {len(changed_paths)}.",
                  "The immediately preceding exact-head Agent Runtime run proved that the missing pathlib.Path import repair removed the collection failure.",
                  "The workflow verifies byte-identical ledgers, commits locally, runs the canonical continuity validator against the resulting commit, and only then pushes without force.",
              ],
              "openItems": [
                  "Require all Required Checks to finish terminal green on the resulting exact PR head.",
                  "Merge only the verified exact head and read back the new main revision.",
                  "Resolve, publish, and deploy immutable backend and MCP images only for components identified by the final impact manifest.",
                  "Verify registry, digest, image, container, health, MCP, broker, PatchMon, and revision parity.",
                  "Close Issue #1165 only after independent repository and runtime readbacks.",
              ],
              "familyFriendshipExperience": [],
              "newEmotionallyFormedBondExperiences": [],
              "funnyExperiences": [],
              "privacy": {
                  "rawChatTranscriptStored": False,
                  "redacted": True,
                  "secretValuesStored": False,
              },
              "changedPaths": changed_paths,
          }
          encoded = (json.dumps(entry, ensure_ascii=False, separators=(",", ":")) + "\n").encode("utf-8")
          canonical_after = canonical_before + encoded
          canonical_path.write_bytes(canonical_after)
          mirror_path.write_bytes(canonical_after)
          Path(workflow_path).unlink()
          PY

      - name: Commit locally and validate canonical completion contract
        shell: bash
        run: |
          set -euo pipefail
          cmp -s docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "docs(continuity): bind complete issue 1165 PR impact"
          new_head="$(git rev-parse HEAD)"
          base_head="$(git merge-base origin/main "${new_head}")"
          python3 tools/sovereign-chatgpt-mcp/validate_continuity.py --base "${base_head}" --head "${new_head}"

      - name: Push exact same branch without force
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          remote_after="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_after}" = "${new_head}"
          printf 'New exact PR head: %s\n' "${new_head}"
