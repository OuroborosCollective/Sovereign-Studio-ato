name: Operator Live Five 656e029

on:
  push:
    branches:
      - sovereign/chatgpt/live-five-656e029-20260914

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-live Five Path proof
        uses: actions/github-script@v7
        env:
          EXPECTED_MAIN: 656e02911322004736ad0f16b2c49272fe2b7e76
        with:
          script: |
            const expected = String(process.env.EXPECTED_MAIN || '').toLowerCase();
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const actual = String(currentMain.object?.sha || '').toLowerCase();
            if (actual !== expected) {
              core.setFailed(`MAIN_DRIFT:${actual}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'e2e-testing.yml',
              ref: 'main',
              inputs: { live_five_path: 'true' },
            });
            core.info(JSON.stringify({status:'LIVE_FIVE_DISPATCHED', revision:expected, secretValuesReturned:false}));
