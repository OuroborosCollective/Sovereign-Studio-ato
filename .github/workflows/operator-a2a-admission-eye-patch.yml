name: Operator A2A admission and eye patch

on:
  push:
    branches:
      - sovereign/chatgpt/a2a-admission-eye-20260914

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact base and branch
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = "sovereign/chatgpt/a2a-admission-eye-20260914"
          git merge-base --is-ancestor 29988438334f984c6afcd133b655175040effe6b HEAD

      - name: Patch A2A admission and frontend truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/operator-a2a-admission-eye-patch.py
          git diff --check

      - name: Validate Python and backend regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q backend/agent_runtime scripts/sovereign-backend/agent_runtime
          python3 -m pip install -q -r scripts/sovereign-backend/requirements.txt
          PYTHONPATH=backend python3 -m pytest -q backend/tests/test_repository_execution.py backend/tests/test_repository_single_a2a_contract.py backend/tests/test_agent_zero_a2a.py

      - name: Validate frontend contracts and mobile eye
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@9.12.2 --activate
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/features/control-surface-vnext/controlSurfaceTruthContract.test.ts
          pnpm exec playwright install chromium --with-deps
          pnpm exec playwright test tests/e2e/builder-container-smoke.spec.ts --project=chromium --workers=1 --reporter=line
          pnpm exec playwright test tests/e2e/five-draft-pr-paths.spec.ts --project=chromium --list
          node --check scripts/verify-five-draft-pr-runtime-evidence.mjs

      - name: Commit validated product patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/agent_runtime/job_store.py scripts/sovereign-backend/agent_runtime/job_store.py backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py backend/tests/test_repository_execution.py backend/tests/test_repository_single_a2a_contract.py tests/e2e/five-draft-pr-paths.spec.ts scripts/verify-five-draft-pr-runtime-evidence.mjs src/features/control-surface-vnext/components/CyborgOcularMatrix/CyborgOcularMatrix.tsx src/features/control-surface-vnext/App.tsx src/features/control-surface-vnext/components/Architecture/ArchitectureModal.tsx src/features/control-surface-vnext/controlSurfaceTruthContract.test.ts tests/e2e/builder-container-smoke.spec.ts
          git diff --cached --check
          git commit -m 'fix(agent-runtime): serialize Agent Zero admission and restore mobile eye'
          git push origin HEAD:"$GITHUB_REF_NAME"
