name: MCP Secret-Shaped Fixture Remediation

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: mcp-secret-shaped-remediation-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  remediate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/mcp-secret-scan-fixture-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact identities
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_SHA" = 'da094250f9817254417a6fe92ff53e7f8b5d5a23'
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply reviewed remediation and mirrored continuity entry
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cp .github/bootstrap/remediate_secret_shaped.py /tmp/remediate_secret_shaped.py
          python /tmp/remediate_secret_shaped.py apply

      - name: Repair stale test contracts and bind evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          test_path = Path('backend/tests/test_cognitive_repository_tools.py')
          text = test_path.read_text('utf-8')
          replacements = [
              ('    WRITE_REPOSITORY_TOOL_NAME,\n', '    WRITE_REPOSITORY_TOOL_NAMES,\n'),
              (
                  '    assert tuple(ROLE_WORK_PACKAGES) == tuple(WORKER_ROLES)\n',
                  '    assert set(ROLE_WORK_PACKAGES) == set(WORKER_ROLES) | {"free_single_agent"}\n',
              ),
              (
                  '    assert tuple(ROLE_PATH_PREFIXES) == tuple(WORKER_ROLES)\n',
                  '    assert set(ROLE_PATH_PREFIXES) == set(WORKER_ROLES) | {"free_single_agent"}\n',
              ),
              (
                  '    assert WRITE_REPOSITORY_TOOL_NAME not in read_only.allowed_tool_names("predictive_qa")\n',
                  '    assert set(WRITE_REPOSITORY_TOOL_NAMES).isdisjoint(read_only.allowed_tool_names("predictive_qa"))\n',
              ),
              (
                  '    assert WRITE_REPOSITORY_TOOL_NAME in mutating.allowed_tool_names("predictive_qa")\n',
                  '    assert set(WRITE_REPOSITORY_TOOL_NAMES).issubset(mutating.allowed_tool_names("predictive_qa"))\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'stale repository-tool contract replacement count mismatch: {count}')
              text = text.replace(old, new, 1)
          test_path.write_text(text, 'utf-8')

          frontend_replacements = [
              (
                  Path('src/features/github/hooks/useSetupState.test.ts'),
                  "'ghp_…cdef'",
                  "'ghp_…rpbc'",
              ),
              (
                  Path('src/features/product/runtime/githubAccessRuntime.test.ts'),
                  "'ghp_****9ABC'",
                  "'ghp_****cv3n'",
              ),
              (
                  Path('src/features/product/runtime/githubAccessRuntime.test.ts'),
                  'last 4 = 9ABC',
                  'last 4 = cv3n',
              ),
          ]
          for path, old, new in frontend_replacements:
              frontend_text = path.read_text('utf-8')
              count = frontend_text.count(old)
              if count != 1:
                  raise SystemExit(f'stale frontend redaction contract replacement count mismatch for {path}: {count}')
              path.write_text(frontend_text.replace(old, new, 1), 'utf-8')

          canonical = Path('docs/sovereign-continuity/LEDGER.jsonl')
          runtime = Path('tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl')
          canonical_lines = canonical.read_text('utf-8').splitlines()
          runtime_lines = runtime.read_text('utf-8').splitlines()
          if canonical_lines != runtime_lines or not canonical_lines:
              raise SystemExit('continuity mirrors differ before evidence extension')
          entry = json.loads(canonical_lines[-1])
          if entry.get('entryId') != 'continuity-secret-shaped-literal-remediation-20260803':
              raise SystemExit('unexpected latest continuity entry')
          entry['decisions'].extend([
              'Der veraltete Singular-Testvertrag WRITE_REPOSITORY_TOOL_NAME wird auf die kanonische Menge WRITE_REPOSITORY_TOOL_NAMES korrigiert; die Produktions-Capability bleibt unverändert.',
              'Der Rollen-Testvertrag erkennt den expliziten free_single_agent zusätzlich zu den sechs festen WORKER_ROLES an; die Swarm-Topologie bleibt unverändert.',
              'Der verschachtelte E2E-Test erbt den kanonischen Backend-Venv-Pfad, damit sein python3-Kindprozess dieselbe isolierte Testlaufzeit verwendet.',
              'Die beiden Frontend-Maskierungstests werden an die deterministisch erzeugten synthetischen Laufzeit-Suffixe gebunden; die Maskierungsimplementierung bleibt unverändert.',
              'Der temporäre Bootstrap entfernt vor dem finalen Commit sowohl sein Programm als auch seinen eigenen Pull-Request-Workflow, damit keine zusätzliche direkte PR-Runner-Lane verbleibt.',
          ])
          entry['evidence'].extend([
              'Der fokussierte Backend-Test importierte einen nicht mehr exportierten Singularnamen; die Implementierung exportiert nachweislich zwei Schreibwerkzeuge als WRITE_REPOSITORY_TOOL_NAMES.',
              'ROLE_WORK_PACKAGES und ROLE_PATH_PREFIXES enthalten nachweislich die sechs WORKER_ROLES plus den gesonderten free_single_agent mit workspaceweiter Capability.',
              'Der E2E-Kindprozess startete python3 außerhalb der Venv, weil ein direkt aufgerufener Venv-Interpreter PATH nicht automatisch umschreibt; der Testschritt bindet daher /tmp/backend-test-venv/bin explizit vor PATH.',
              'Der Frontend-Lauf am exakten Head f5661a88febf132457692dc533af274a58c4ba52 belegte ausschließlich zwei veraltete erwartete Suffixe: ghp_…cdef gegenüber ghp_…rpbc und ghp_****9ABC gegenüber ghp_****cv3n.',
              'Der Release-Gate-Lauf am selben Head belegte den temporären mcp-secret-scan-fixture-bootstrap.yml als einzige zusätzliche direkte pull_request-Workflow-Lane; die Selbstentfernung beseitigt diese Abweichung vor dem finalen Head.',
          ])
          rendered = json.dumps(entry, ensure_ascii=False, sort_keys=True, separators=(',', ':'))
          canonical_lines[-1] = rendered
          runtime_lines[-1] = rendered
          canonical.write_text('\n'.join(canonical_lines) + '\n', 'utf-8')
          runtime.write_text('\n'.join(runtime_lines) + '\n', 'utf-8')
          if canonical.read_bytes() != runtime.read_bytes():
              raise SystemExit('continuity mirrors differ after evidence extension')
          PY

      - name: Verify affected backend and sovereign-backend tests in isolated environment
        run: |
          set -euo pipefail
          python -m venv /tmp/backend-test-venv
          /tmp/backend-test-venv/bin/python -m pip install --upgrade pip
          /tmp/backend-test-venv/bin/python -m pip install --requirement backend/requirements-test.txt
          PATH="/tmp/backend-test-venv/bin:$PATH" PYTHONPATH="$PWD/backend:$PWD" /tmp/backend-test-venv/bin/python -m pytest -q \
            backend/tests/test_agent_draft_pr_create_routes.py \
            backend/tests/test_agent_draft_pr_gate.py \
            backend/tests/test_agent_job_contract.py \
            backend/tests/test_agent_job_lifecycle.py \
            backend/tests/test_agent_pattern_gateway.py \
            backend/tests/test_agent_runtime_e2e.py \
            backend/tests/test_are_inference_error_families.py \
            backend/tests/test_bug_evidence_lane.py \
            backend/tests/test_cognitive_repository_tools.py \
            backend/tests/test_security_masking.py \
            backend/tests/test_universal_toolchain_runtime.py \
            scripts/sovereign-backend/tests/test_owner_input_runtime.py

      - name: Verify affected MCP test in canonical isolated environment
        run: |
          set -euo pipefail
          python -m venv /tmp/mcp-test-venv
          /tmp/mcp-test-venv/bin/python -m pip install --upgrade pip
          /tmp/mcp-test-venv/bin/python -m pip install --requirement tools/sovereign-chatgpt-mcp/requirements.txt
          PATH="/tmp/mcp-test-venv/bin:$PATH" PYTHONPATH="$PWD/tools/sovereign-chatgpt-mcp" /tmp/mcp-test-venv/bin/python -m pytest -q \
            tools/sovereign-chatgpt-mcp/tests/test_repository_intelligence_tools.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify affected frontend tests
        env:
          CI: true
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/components/ErrorBoundary.test.tsx \
            src/components/atoms/SafeLogText.test.tsx \
            src/features/github/gitPatchApplier.test.ts \
            src/features/github/hooks/useSetupState.test.ts \
            src/features/product/components/SovereignTabErrorBoundary.test.tsx \
            src/features/product/containers/BuilderContainer.test.tsx \
            src/features/product/runtime/agentWorkspaceRuntime.test.ts \
            src/features/product/runtime/chatExportRuntime.test.ts \
            src/features/product/runtime/chatRuntime.test.ts \
            src/features/product/runtime/chatSidebarRuntime.test.ts \
            src/features/product/runtime/containerDecisionLearning.test.ts \
            src/features/product/runtime/githubAccessRuntime.test.ts \
            src/features/product/runtime/presetActionOutcomeMemory.test.ts \
            src/features/product/runtime/secureInputGuard.test.ts \
            src/features/product/runtime/sovereignBlockerRegistry.test.ts \
            src/features/product/runtime/sovereignExecutionSessionRuntime.test.ts \
            src/features/product/runtime/sovereignPredictiveRuntimePolicy.test.ts \
            src/features/product/runtime/sovereignToolObservationRuntime.test.ts \
            src/features/product/runtime/sovereignWorkspaceRuntime.test.ts \
            src/features/rescue/RescuePanel.test.tsx \
            src/runtime/RuntimeIntelligence.test.ts \
            src/shared/utils/crypto.test.ts \
            src/shared/utils/runtimeValidation.test.ts

      - name: Verify TypeScript contract
        run: pnpm run type-check

      - name: Verify unchanged scanner and bootstrap-bound exact diff
        run: |
          set -euo pipefail
          python /tmp/remediate_secret_shaped.py validate-bootstrap
          if git grep -IlE \
            '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-proj-[A-Za-z0-9_-]{20,})' \
            -- . ':!.env.example' ':!.tunnel.env.example'; then
            echo 'Forbidden secret-shaped material remains after complete remediation.' >&2
            exit 1
          fi

      - name: Remove temporary program and workflow; verify final durable diff
        run: |
          set -euo pipefail
          rm .github/bootstrap/remediate_secret_shaped.py
          rmdir .github/bootstrap
          rm .github/workflows/mcp-secret-scan-fixture-bootstrap.yml
          python /tmp/remediate_secret_shaped.py validate-final

      - name: Commit validated durable remediation
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git config user.name 'Sovereign Secret Fixture Remediator'
          git config user.email 'nocodehelper@arelogic.space'
          git add --all
          git commit -m 'fix(security): remove tracked secret-shaped fixture literals'
          FINAL_SHA="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_REF}"
          test "$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')" = "$FINAL_SHA"
