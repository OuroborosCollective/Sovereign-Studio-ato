name: MCP Secret Scan Inventory

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mcp-secret-scan-inventory-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  inventory:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/mcp-secret-scan-fixture-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact identities
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$EXPECTED_BASE_SHA" = 'da094250f9817254417a6fe92ff53e7f8b5d5a23'
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD

      - name: Emit redacted exact-pattern inventory
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          import hashlib
          import json
          from pathlib import Path
          import re
          import subprocess

          patterns = [
              ('PRIVATE_KEY_HEADER', re.compile(rb'BEGIN (?:RSA|OPENSSH|EC) PRIVATE KEY')),
              ('GITHUB_CLASSIC_TOKEN', re.compile(rb'ghp_[A-Za-z0-9]{20,}')),
              ('GITHUB_FINE_GRAINED_TOKEN', re.compile(rb'github_pat_[A-Za-z0-9_]{20,}')),
              ('OPENAI_PROJECT_TOKEN', re.compile(rb'sk-proj-[A-Za-z0-9_-]{20,}')),
          ]
          excluded = {'.env.example', '.tunnel.env.example'}
          raw = subprocess.run(
              ['git', 'ls-files', '-z'],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          files = [item.decode('utf-8') for item in raw.split(b'\0') if item]
          findings = []
          for path in files:
              if path in excluded:
                  continue
              candidate = Path(path)
              try:
                  data = candidate.read_bytes()
              except OSError:
                  continue
              if b'\0' in data:
                  continue
              for line_number, line in enumerate(data.splitlines(), start=1):
                  for family, pattern in patterns:
                      for match in pattern.finditer(line):
                          token = match.group(0)
                          surface = (
                              'TEST' if '/tests/' in f'/{path}/' or candidate.name.endswith(('.test.ts', '.test.tsx', '_test.py')) or candidate.name.startswith('test_')
                              else 'DOCUMENTATION' if path.startswith('docs/') or candidate.suffix.casefold() in {'.md', '.rst'}
                              else 'WORKFLOW' if path.startswith('.github/workflows/')
                              else 'SOURCE'
                          )
                          findings.append({
                              'path': path,
                              'line': line_number,
                              'family': family,
                              'surface': surface,
                              'matchBytes': len(token),
                              'matchSha256Prefix': hashlib.sha256(token).hexdigest()[:16],
                          })
          findings.sort(key=lambda item: (item['path'], item['line'], item['family'], item['matchSha256Prefix']))
          summary = {
              'schemaVersion': 'sovereign.secret-shaped-inventory.v1',
              'status': 'SECRET_SHAPED_INVENTORY_READY',
              'baseRevision': 'da094250f9817254417a6fe92ff53e7f8b5d5a23',
              'findingCount': len(findings),
              'pathCount': len({item['path'] for item in findings}),
              'familyCounts': dict(sorted(Counter(item['family'] for item in findings).items())),
              'surfaceCounts': dict(sorted(Counter(item['surface'] for item in findings).items())),
              'findings': findings,
              'rawValuesReturned': False,
              'mutationPerformed': False,
              'secretValuesReturned': False,
          }
          print('SECRET_SHAPED_INVENTORY_JSON=' + json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY

      - name: Assert audit-only workspace
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
