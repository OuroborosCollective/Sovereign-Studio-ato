name: Sovereign Live Five Dispatch Bridge

on:
  push:
    branches:
      - sovereign/chatgpt/live-five-dispatch-20260914

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact-main five-path proof
        uses: actions/github-script@v7
        with:
          script: |
            const expected = '9e9782f858c53c4bcd2fdd109789a39be1379f72';
            const current = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            });
            const actual = String(current.data.commit.sha || '').toLowerCase();
            if (actual !== expected) {
              core.setFailed(`MAIN_REVISION_MOVED:${actual}`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'e2e-testing.yml',
              ref: 'main',
              inputs: { live_five_path: 'true' },
            });
            core.info(`Dispatched e2e-testing.yml on exact main ${expected} with live_five_path=true`);
