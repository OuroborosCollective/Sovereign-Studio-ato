name: Operator Memory Closeout 1971
on:
  push:
    branches: [sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915]
permissions:
  contents: write
jobs:
  append-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append exact Memory closeout once
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD 75b13f04ee84b6b44fa122eca35c04432e56cfa8)" = "75b13f04ee84b6b44fa122eca35c04432e56cfa8"
          if grep -Fq 'A2A task-loss workspace-first recovery (#1971)' Memory.md; then
            echo 'Memory closeout entry already exists; no duplicate written.'
            exit 0
          fi
          python -c "import base64; from pathlib import Path; p=Path('Memory.md'); p.write_bytes(p.read_bytes()+base64.b64decode(''))"
          git diff --check
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add Memory.md
          test "$(git diff --cached --name-only)" = "Memory.md"
          git commit -m "docs(memory): record PR 1971 workspace-first evidence"
          git push origin HEAD:sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915
