name: Operator Memory Closeout 1971
on:
  push:
    branches: [sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915]
permissions:
  contents: write
jobs:
  correct-memory-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915
          fetch-depth: 50
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Correct exactly one pending Memory digest nibble
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD 75b13f04ee84b6b44fa122eca35c04432e56cfa8)" = "75b13f04ee84b6b44fa122eca35c04432e56cfa8"
          bad='c9dd856c6dbebcdd25b29d3b2d1707e933cb8a2850c64d2edee4f4584296b733'
          good='c9dd856c6dbebcdd25b29d3b2d1707e933cb8a2850c64d2edee4f4584296b737'
          test "$(grep -o "$bad" Memory.md | wc -l)" -eq 1
          test "$(grep -o "$good" Memory.md | wc -l)" -eq 0
          sed -i "s/$bad/$good/" Memory.md
          git diff --check
          git config user.name 'Ouroboros Collective'
          git config user.email 'projectouroboroscollective@gmail.com'
          git add Memory.md
          test "$(git diff --cached --name-only)" = 'Memory.md'
          git commit -m 'docs(memory): correct PR 1971 artifact digest'
          git push origin HEAD:sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915
