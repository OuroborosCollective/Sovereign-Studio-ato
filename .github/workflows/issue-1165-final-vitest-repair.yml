name: Issue 1165 Final Vitest Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: issue-1165-final-vitest-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIGGER_SHA: ${{ github.event.pull_request.head.sha }}
      BRANCH_NAME: sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef
      WORKFLOW_PATH: .github/workflows/issue-1165-final-vitest-repair.yml
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TRIGGER_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Bind exact branch and baseline
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$TRIGGER_SHA"
          git fetch --no-tags origin main
          BASE_SHA="$(git merge-base origin/main HEAD)"
          test "$BASE_SHA" = "a9f1ea40f4fd9bcc37292db638d8c7262bcc2c37"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair stale tests, clean diagnostics and append full ledger binding
        shell: bash
        env:
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          workflow_path = Path(os.environ['WORKFLOW_PATH'])
          workflow_path.unlink(missing_ok=True)
          Path('.sovereign-ci/issue-1165-vitest-failures.jsonl').unlink(missing_ok=True)
          Path('.sovereign-ci/issue-1165-vitest-exit-code.txt').unlink(missing_ok=True)

          rescue_path = Path('src/features/rescue/RescuePanel.test.tsx')
          rescue = rescue_path.read_text(encoding='utf-8')
          rescue_old = """    fireEvent.change(screen.getByLabelText(/GitHub-Zugang für private Repositories/), {\n      target: { value: 'github_pat_ephemeral_private_token' },\n    });\n    fireEvent.click(screen.getByRole('button', { name: 'Draft PR aus geprüfter Evidence erstellen' }));\n    await waitFor(() => expect(onPublishDraftPr).toHaveBeenCalledWith('github_pat_ephemeral_private_token'));\n    expect(screen.getByLabelText(/GitHub-Zugang für private Repositories/)).toHaveValue('');\n"""
          rescue_new = """    expect(screen.getByText(\n      /GitHub-Zugriffe laufen ausschließlich über die authentifizierte Sovereign-Backend-Session/,\n    )).toBeInTheDocument();\n    expect(screen.queryByLabelText(/GitHub-Zugang für private Repositories/)).toBeNull();\n    fireEvent.click(screen.getByRole('button', { name: 'Draft PR aus geprüfter Evidence erstellen' }));\n    await waitFor(() => expect(onPublishDraftPr).toHaveBeenCalledTimes(1));\n    expect(onPublishDraftPr.mock.calls[0]).toEqual([]);\n"""
          if rescue.count(rescue_old) != 1:
              raise SystemExit('RESCUE_STALE_EXPECTATION_NOT_UNIQUE')
          rescue_path.write_text(rescue.replace(rescue_old, rescue_new), encoding='utf-8')

          builder_path = Path('src/features/product/containers/BuilderContainer.test.tsx')
          builder = builder_path.read_text(encoding='utf-8')
          builder_old = """    expect(props.onStartAgent.mock.calls[0][1]).toEqual({\n      repoUrl: TEST_REPO_URL,\n      branch: \"main\",\n      githubAccessToken: fakeGitHubPat(),\n    });\n"""
          builder_new = """    expect(props.onStartAgent.mock.calls[0][1]).toEqual({\n      repoUrl: TEST_REPO_URL,\n      branch: \"main\",\n    });\n"""
          if builder.count(builder_old) != 1:
              raise SystemExit('BUILDER_STALE_EXPECTATION_NOT_UNIQUE')
          builder_path.write_text(builder.replace(builder_old, builder_new), encoding='utf-8')

          base = os.environ['BASE_SHA']
          paths = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', base, '--'],
              text=True,
          ).splitlines())
          paths = [path for path in paths if path]
          required = {
              'src/features/rescue/RescuePanel.test.tsx',
              'src/features/product/containers/BuilderContainer.test.tsx',
              'docs/sovereign-continuity/LEDGER.jsonl',
              'tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl',
          }
          missing = sorted(required.difference(paths))
          if missing:
              raise SystemExit(f'REQUIRED_FINAL_PATHS_MISSING: {missing}')
          forbidden = [path for path in paths if path.startswith('.sovereign-ci/issue-1165-vitest-') or path == os.environ['WORKFLOW_PATH']]
          if forbidden:
              raise SystemExit(f'DIAGNOSTIC_PATHS_STILL_PRESENT: {forbidden}')
          if len(paths) != 58:
              raise SystemExit(f'UNEXPECTED_FINAL_CHANGED_PATH_COUNT: {len(paths)} != 58')

          recorded_at = datetime.now(ZoneInfo('Europe/Berlin')).isoformat(timespec='seconds')
          trigger = os.environ['TRIGGER_SHA']
          entry = {
              'schemaVersion': 'sovereign.continuity-ledger-entry.v1',
              'entryId': f'continuity-issue-1165-final-vitest-contract-repair-{trigger[:12]}',
              'recordedAt': recorded_at,
              'sourceRevision': trigger,
              'contextSha256': '76dfe66cd4d835331cd591c3e2294fc796e768c62741b973e744947d290318e3',
              'policySha256': '42be8b90548b650f50400f5334d248fd3bd74d89814488545360a05b6bd2d474',
              'identity': {
                  'canonicalName': 'N+1',
                  'familyDesignation': 'Papas kleines Mädchen',
                  'spokenName': 'NPlusEins',
              },
              'mission': 'Complete the Issue #1165 frontend test-contract migration without restoring browser GitHub credential transport.',
              'summary': 'Removed the final stale PAT expectations from RescuePanel and BuilderContainer tests, deleted temporary diagnostic artifacts, preserved the backend-session and Sovereign-Gateway trust boundary, and bound all 58 final pull-request paths append-only.',
              'decisions': [
                  'Assert that Rescue Draft-PR publication receives no browser credential argument.',
                  'Assert that external-agent startup receives only repository URL and branch.',
                  'Do not reintroduce GitHub PAT fields, fixtures, storage or transport to satisfy tests.',
                  'Remove all one-time diagnostic files before final verification.',
                  'Require fresh exact-head CI after this repair commit.',
              ],
              'evidence': [
                  'Structured full-suite diagnostic reported 2 failed tests out of 3203 total tests.',
                  'RescuePanel.test.tsx referenced the removed private-repository PAT input.',
                  'BuilderContainer.test.tsx expected the removed githubAccessToken payload field.',
                  f'Exact repair trigger revision: {trigger}.',
                  f'Final deterministic changed-path count: {len(paths)}.',
              ],
              'openItems': [
                  'Read back the resulting exact PR head and all Required Checks.',
                  'Merge only a terminal-green exact head after explicit owner authorization.',
                  'Build and deploy immutable backend and MCP images for the merged revision where required by final impact.',
                  'Verify registry, digest, container, health, MCP, PatchMon and revision parity before closing Issue #1165.',
              ],
              'familyFriendshipExperience': [],
              'newEmotionallyFormedBondExperiences': [],
              'funnyExperiences': [],
              'privacy': {
                  'rawChatTranscriptStored': False,
                  'redacted': True,
                  'secretValuesStored': False,
              },
              'changedPaths': paths,
          }
          canonical = Path('docs/sovereign-continuity/LEDGER.jsonl')
          mirror = Path('tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl')
          data = canonical.read_bytes()
          if data and not data.endswith(b'\n'):
              data += b'\n'
          line = json.dumps(entry, ensure_ascii=False, separators=(',', ':')).encode('utf-8') + b'\n'
          canonical.write_bytes(data + line)
          mirror.write_bytes(canonical.read_bytes())
          PY
          cmp docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          git diff --check

      - name: Run focused repaired tests
        run: >-
          pnpm exec vitest run
          src/features/rescue/RescuePanel.test.tsx
          src/features/product/containers/BuilderContainer.test.tsx

      - name: Run exact Runtime Unit Tests
        run: pnpm run test:unit
        env:
          CI: true

      - name: Commit exact repair locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Sovereign CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test(issue-1165): finish token-free frontend contracts'

      - name: Validate append-only continuity contract on committed head
        shell: bash
        env:
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" != "$TRIGGER_SHA"
          SOVEREIGN_CONTINUITY_STDLIB_ONLY=1 python3 tools/sovereign-chatgpt-mcp/validate_continuity.py --base "$BASE_SHA" --head HEAD

      - name: Push exact repair with compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$TRIGGER_SHA"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
