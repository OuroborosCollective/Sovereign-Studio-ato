name: Sovereign Owner Boundary Evidence Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sovereign-owner-boundary-evidence-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-boundary-evidence:
    name: Reconcile boundary evidence without blocking owner flow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make preview drift advisory and revision-only blocking explicit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/reconcile_llm_boundary_ledger.py')
          text = path.read_text(encoding='utf-8')
          marker = '    serialized = json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True) + "\\n"\n'
          insertion = '''    if not args.write:\n        preview_drift = bool(\n            result.get("newCandidates")\n            or result.get("removedCandidates")\n            or result.get("bindingDrift")\n            or result.get("ownerDecisionCandidateIds")\n        )\n        result = {\n            **result,\n            "advisory": preview_drift,\n            "blocking": False,\n            "blockingAuthority": "EXACT_REVISION_ONLY",\n        }\n\n'''
          if '"blockingAuthority": "EXACT_REVISION_ONLY"' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('SERIALIZATION_MARKER_MISMATCH')
              text = text.replace(marker, insertion + marker, 1)

          old_tail = '''    if result.get("ownerDecisionCandidateIds"):\n        return 3\n    if args.write:\n        return 0 if result.get("status") == "BOUNDARY_LEDGER_RECONCILED" else 1\n    drift = bool(result.get("newCandidates") or result.get("removedCandidates") or result.get("bindingDrift"))\n    return 2 if drift else 0\n'''
          new_tail = '''    if args.write:\n        if result.get("ownerDecisionCandidateIds"):\n            return 3\n        return 0 if result.get("status") == "BOUNDARY_LEDGER_RECONCILED" else 1\n    # Preview mode is evidence-only. Exact revision mismatch is enforced above;\n    # semantic/binding drift is reported but never becomes mutation authority.\n    return 0\n'''
          if old_tail in text:
              text = text.replace(old_tail, new_tail, 1)
          elif new_tail not in text:
              raise SystemExit('RECONCILE_RETURN_CONTRACT_MISMATCH')
          path.write_text(text, encoding='utf-8')

          test_path = Path('tools/sovereign-chatgpt-mcp/tests/test_boundary_ledger_workflow.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_test_name = 'def test_boundary_workflow_emits_evidence_before_failing_closed() -> None:\n'
          new_test_name = 'def test_boundary_workflow_emits_evidence_without_owner_flow_authority() -> None:\n'
          if old_test_name in test_text:
              test_text = test_text.replace(old_test_name, new_test_name, 1)
          appendix = '''\n\ndef test_boundary_preview_drift_is_advisory_and_revision_only() -> None:\n    script = (ROOT / "scripts" / "reconcile_llm_boundary_ledger.py").read_text("utf-8")\n    assert '"blocking": False' in script\n    assert '"blockingAuthority": "EXACT_REVISION_ONLY"' in script\n    assert "return 2 if drift else 0" not in script\n    assert "EXPECTED_HEAD_MISMATCH" in script\n'''
          if 'def test_boundary_preview_drift_is_advisory_and_revision_only()' not in test_text:
              test_text += appendix
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Reconcile current static bindings without Continuity authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sovereign-evidence
          python scripts/reconcile_llm_boundary_ledger.py \
            --expected-head "${GITHUB_SHA}" \
            --write \
            --report .sovereign-evidence/boundary-ledger-reconciled.json
          python scripts/verify_llm_boundary_ledger.py
          python scripts/reconcile_llm_boundary_ledger.py \
            --expected-head "${GITHUB_SHA}" \
            --report .sovereign-evidence/boundary-ledger-preview.json

      - name: Run boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tools/sovereign-chatgpt-mcp/tests/test_llm_boundary_ledger.py \
            tools/sovereign-chatgpt-mcp/tests/test_boundary_ledger_workflow.py \
            tools/sovereign-chatgpt-mcp/tests/test_ci_repair_tools.py
          git diff --check

      - name: Publish evidence contract and refreshed ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add \
            scripts/reconcile_llm_boundary_ledger.py \
            config/architecture/llm-tool-boundary-review-ledger.json \
            tools/sovereign-chatgpt-mcp/tests/test_boundary_ledger_workflow.py
          if git diff --cached --quiet; then
            echo 'Boundary evidence contract already reconciled.'
            exit 0
          fi
          git commit -m 'fix(governance): keep boundary drift evidence-only'
          git push origin HEAD:main
