name: Sovereign Backend Immutable Image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_validation:
        description: Build and inspect without publishing for a coordinated PR validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/ouroboroscollective/sovereign-backend
  SOVEREIGN_REVISION: ${{ github.sha }}
  PR_VALIDATION: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_validation == true }}

jobs:
  build:
    name: Build immutable backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact authoritative revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOVEREIGN_REVISION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate

      - name: Install frozen web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build revision-bound React admin and user app
        env:
          VITE_ADMIN_API_BASE: ''
          VITE_SOVEREIGN_SOURCE_REVISION: ${{ env.SOVEREIGN_REVISION }}
        run: pnpm run build:web

      - name: Stage revision-bound shared web artifact for backend image
        run: |
          set -euo pipefail
          test -f dist/index.html
          rm -rf scripts/sovereign-backend/admin-dist
          cp -a dist scripts/sovereign-backend/admin-dist
          grep -Rqs 'CANONICAL_REACT_ADMIN' scripts/sovereign-backend/admin-dist
          grep -Rqs 'DevChat' scripts/sovereign-backend/admin-dist
          grep -Rqs 'Draft PR wirklich an die Runtime übergeben?' scripts/sovereign-backend/admin-dist
          grep -Rqs '${{ env.SOVEREIGN_REVISION }}' scripts/sovereign-backend/admin-dist
          grep -Rqs 'Free Revolver' scripts/sovereign-backend/admin-dist

      - name: Compile backend before image build
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/sovereign-backend/app.py \
            scripts/sovereign-backend/litellm_runtime.py \
            scripts/sovereign-backend/runner.py \
            scripts/sovereign-backend/security_oauth.py \
            scripts/sovereign-backend/security_runtime.py \
            scripts/sovereign-backend/vector_embedding.py \
            scripts/sovereign-backend/knowledge_library.py \
            scripts/sovereign-backend/are_inference.py \
            scripts/sovereign-backend/enterprise_platform/*.py \
            scripts/sovereign-backend/agent_runtime/*.py \
            scripts/sovereign-backend/agent_runtime/tools/*.py
          bash -n scripts/sovereign-backend/auto-migrate.sh

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: env.PR_VALIDATION != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish exact revision image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: scripts/sovereign-backend
          file: scripts/sovereign-backend/Dockerfile
          push: ${{ env.PR_VALIDATION != 'true' }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.SOVEREIGN_REVISION }}
          build-args: |
            SOVEREIGN_SOURCE_REVISION=${{ env.SOVEREIGN_REVISION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOVEREIGN_REVISION }}
            org.opencontainers.image.title=sovereign-backend
          load: ${{ env.PR_VALIDATION == 'true' }}
          provenance: ${{ env.PR_VALIDATION == 'true' && 'false' || 'mode=max' }}
          sbom: ${{ env.PR_VALIDATION != 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify canonical admin and user app inside PR image
        if: env.PR_VALIDATION == 'true'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python "${IMAGE_NAME}:${SOVEREIGN_REVISION}" -c '
          from pathlib import Path
          root = Path("/app/admin-dist")
          assert (root / "index.html").is_file()
          rendered = "\n".join(path.read_text("utf-8", errors="ignore") for path in root.rglob("*") if path.is_file())
          assert "CANONICAL_REACT_ADMIN" in rendered
          assert "DevChat" in rendered
          assert "Draft PR wirklich an die Runtime übergeben?" in rendered
          assert "Free Revolver" in rendered
          '

      - name: Report immutable image evidence
        run: |
          {
            echo '### Sovereign backend image'
            echo '- Revision: `${{ env.SOVEREIGN_REVISION }}`'
            if [ '${{ env.PR_VALIDATION }}' = 'true' ]; then
              echo '- Published: `false` (PR validation only)'
            else
              echo '- Published: `true`'
              echo '- Tag: `${{ env.IMAGE_NAME }}:${{ env.SOVEREIGN_REVISION }}`'
              echo '- Digest: `${{ steps.image.outputs.digest }}`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published backend identity and write immutable evidence
        if: env.PR_VALIDATION != 'true'
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull "$image_ref" >/dev/null
          actual_revision="$(docker image inspect "$image_ref" --format '{{index .Config.Labels \"org.opencontainers.image.revision\"}}')"
          test "$actual_revision" = "$SOVEREIGN_REVISION"
          node - <<'NODE'
          const fs = require('node:fs');
          const revision = process.env.SOVEREIGN_REVISION;
          const repository = process.env.IMAGE_NAME;
          const digest = process.env.IMAGE_DIGEST;
          if (!/^[0-9a-f]{40}$/.test(revision) || !/^ghcr\.io\/ouroboroscollective\/[a-z0-9._-]+$/.test(repository) || !/^sha256:[0-9a-f]{64}$/.test(digest)) {
            throw new Error('Backend immutable evidence inputs are invalid');
          }
          fs.writeFileSync('sovereign-backend-immutable-image-evidence.json', `${JSON.stringify({
            schemaVersion: 'sovereign.immutable-image-evidence.v1',
            component: 'backend',
            sourceRevision: revision,
            imageRepository: repository,
            imageDigest: digest,
            immutablePublished: true,
            ociRevisionLabelVerified: true,
            sourceRunId: process.env.GITHUB_RUN_ID,
            secretValuesReturned: false,
          }, null, 2)}\n`);
          NODE

      - name: Upload immutable backend evidence
        if: env.PR_VALIDATION != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-backend-immutable-image-evidence-${{ env.SOVEREIGN_REVISION }}
          path: sovereign-backend-immutable-image-evidence.json
          if-no-files-found: error
          retention-days: 30
