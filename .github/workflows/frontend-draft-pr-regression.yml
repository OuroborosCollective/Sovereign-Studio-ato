name: Frontend Draft PR Regression

on:
  push:
    branches:
      - 'sovereign/chatgpt/**'
    paths:
      - 'src/features/release/PlayReleaseChat.tsx'
      - 'src/features/release/PlayReleaseChat.resumeDraftPr.test.tsx'
      - 'src/features/product/runtime/sovereignAgentClient.ts'
      - 'src/features/product/runtime/githubAccessRuntime*'
      - 'src/features/product/components/GitHubAccessCard*'
      - 'src/App.draftPrFlow.test.tsx'
      - 'backend/agent_runtime/draft_pr_create_gate.py'
      - 'backend/agent_runtime/routes.py'
      - 'backend/agent_runtime/git_workspace.py'
      - 'backend/agent_runtime/contracts.py'
      - 'scripts/sovereign-backend/agent_runtime/git_workspace.py'
      - 'scripts/sovereign-backend/agent_runtime/contracts.py'
      - 'backend/tests/test_github_installation_token_compatibility.py'
      - 'backend/tests/test_agent_draft_pr_create_gate.py'
      - 'backend/tests/test_agent_draft_pr_create_routes.py'
      - '.github/workflows/frontend-draft-pr-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-draft-pr-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '9.12.2'
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck current frontend
        run: pnpm run type-check
      - name: Run Draft PR frontend regressions
        run: >-
          pnpm exec vitest run
          src/App.draftPrFlow.test.tsx
          src/features/release/PlayReleaseChat.resumeDraftPr.test.tsx
          src/features/product/runtime/sovereignAgentClient.draftPrEvidence.test.ts
          src/features/product/runtime/devChatDraftPrExecutionContract.test.ts
          src/features/product/runtime/githubAccessRuntime.test.ts
          src/features/product/runtime/githubAccessRuntime.statelessToken.test.ts
          src/features/product/components/GitHubAccessCard.test.tsx

      - name: Archive exact tracked source for offline verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/draft-pr-source"
          git archive --format=tar --output="$RUNNER_TEMP/draft-pr-source/source.tar" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/draft-pr-source/git-tree.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/draft-pr-source/revision.txt"
          (cd "$RUNNER_TEMP/draft-pr-source" && sha256sum source.tar > source.tar.sha256)
      - name: Upload exact tracked source archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-pr-source-${{ github.sha }}
          path: ${{ runner.temp }}/draft-pr-source/
          if-no-files-found: error
          retention-days: 3

  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend-python
      - name: Run Draft PR and installation credential regressions
        run: >-
          python -m pytest
          backend/tests/test_agent_draft_pr_create_gate.py
          backend/tests/test_agent_draft_pr_create_routes.py
          backend/tests/test_github_installation_token_compatibility.py
          -q
      - name: Verify issued GitHub credential compatibility without exposing its value
        env:
          ISSUED_GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: backend
        run: |
          python - <<'PY'
          import os
          from agent_runtime.git_workspace import normalize_ephemeral_github_token
          from agent_runtime.contracts import sanitize_agent_text
          token = os.environ['ISSUED_GITHUB_TOKEN']
          assert token, 'No GitHub-issued credential supplied'
          assert normalize_ephemeral_github_token(token) == token, 'Issued credential rejected by production normalizer'
          masked = sanitize_agent_text(token)
          assert token not in masked and '[redacted]' in masked, 'Credential was not fully redacted'
          if token.startswith('ghs_'):
              assert masked == 'ghs_[redacted]', 'Installation credential suffix survived redaction'
          print('ISSUED_CREDENTIAL_PREFLIGHT=PASS (format and redaction only; not authorization or Draft-PR evidence)')
          PY
