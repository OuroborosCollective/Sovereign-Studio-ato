name: Sovereign PR Review Evidence

on:
  push:
    branches:
      - sovereign/owner-ready-pr-1748-1c3791f
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact pull request number to inspect
        required: true
        type: string
      expected_head_sha:
        description: Exact current pull request head SHA
        required: true
        type: string
      confirm_resolve:
        description: Resolve one exact already-reviewed thread after hash confirmation
        required: false
        default: false
        type: boolean
      expected_thread_id_sha256:
        description: SHA-256 of the exact review thread node ID
        required: false
        default: ''
        type: string
      expected_comment_body_sha256:
        description: SHA-256 of the exact review comment body
        required: false
        default: ''
        type: string
      expected_path:
        description: Exact reviewed repository path
        required: false
        default: ''
        type: string
      expected_author:
        description: Exact GitHub login of the review author
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sovereign-pr-review-evidence-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  owner-ready-bootstrap:
    name: Mark exact owner-approved PR ready
    if: github.event_name == 'push' && github.ref == 'refs/heads/sovereign/owner-ready-pr-1748-1c3791f'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-runtime-readback
    steps:
      - name: Verify exact control commit and mark PR ready
        uses: actions/github-script@v7
        env:
          EXPECTED_ACTOR: OuroborosCollective
          EXPECTED_CONTROL_PARENT: 52e1acbc28393d02094426b7c159a21e608a2b80
          EXPECTED_MAIN: de16bb619e6b1af5e18cad17dfcb28f545ac4d4c
          TARGET_PR_NUMBER: '1748'
          EXPECTED_PR_HEAD: 1c3791f7006add0d76c79f4c9cb84376da810f95
          EXPECTED_PR_BRANCH: fix/traefik-public-route-recovery
        with:
          script: |
            const expectedActor = String(process.env.EXPECTED_ACTOR || '');
            const expectedControlParent = String(process.env.EXPECTED_CONTROL_PARENT || '').toLowerCase();
            const expectedMain = String(process.env.EXPECTED_MAIN || '').toLowerCase();
            const expectedHead = String(process.env.EXPECTED_PR_HEAD || '').toLowerCase();
            const expectedBranch = String(process.env.EXPECTED_PR_BRANCH || '');
            const pullNumber = Number(process.env.TARGET_PR_NUMBER || 0);
            const repositoryFullName = `${context.repo.owner}/${context.repo.repo}`;
            const workflowPath = '.github/workflows/sovereign-pr-review-evidence.yml';

            if (context.actor !== expectedActor) {
              core.setFailed('OWNER_ACTOR_MISMATCH');
              return;
            }
            if (
              !/^[0-9a-f]{40}$/.test(expectedControlParent)
              || !/^[0-9a-f]{40}$/.test(expectedMain)
              || !/^[0-9a-f]{40}$/.test(expectedHead)
            ) {
              core.setFailed('EXPECTED_REVISION_INVALID');
              return;
            }
            if (!Number.isInteger(pullNumber) || pullNumber < 1) {
              core.setFailed('PR_NUMBER_INVALID');
              return;
            }

            const controlCommit = (await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
            })).data;
            const parents = controlCommit.parents || [];
            const files = controlCommit.files || [];
            if (parents.length !== 1 || String(parents[0]?.sha || '').toLowerCase() !== expectedControlParent) {
              core.setFailed('CONTROL_COMMIT_PARENT_MISMATCH');
              return;
            }
            if (files.length !== 1 || files[0]?.filename !== workflowPath || files[0]?.status !== 'modified') {
              core.setFailed('CONTROL_COMMIT_SCOPE_MISMATCH');
              return;
            }

            const mainRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data;
            if (String(mainRef.object?.sha || '').toLowerCase() !== expectedMain) {
              core.setFailed('MAIN_REVISION_CHANGED');
              return;
            }

            const identity = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            };
            const pull = (await github.rest.pulls.get(identity)).data;
            if (
              pull.state !== 'open'
              || pull.draft !== true
              || pull.base?.ref !== 'main'
              || pull.head?.ref !== expectedBranch
              || pull.head?.repo?.full_name !== repositoryFullName
              || String(pull.head?.sha || '').toLowerCase() !== expectedHead
            ) {
              core.setFailed('PULL_REQUEST_IDENTITY_MISMATCH');
              return;
            }

            const requiredWorkflows = new Set([
              'Integration Plan Lane Gate',
              'Boundary Ledger Drift',
              'Sovereign Continuity Evidence',
              'Sovereign Agent Backend',
              'Release Verification',
            ]);
            const workflowRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: expectedHead,
                per_page: 100,
              },
            );
            const latestRequired = new Map();
            for (const run of workflowRuns) {
              if (!requiredWorkflows.has(run.name) || String(run.head_sha || '').toLowerCase() !== expectedHead) continue;
              const current = latestRequired.get(run.name);
              if (!current || Number(run.id || 0) > Number(current.id || 0)) latestRequired.set(run.name, run);
            }
            const invalidRequired = [...requiredWorkflows].filter((name) => {
              const run = latestRequired.get(name);
              return !run || run.status !== 'completed' || run.conclusion !== 'success';
            });
            if (invalidRequired.length > 0) {
              core.setFailed(`REQUIRED_GATES_NOT_GREEN:${invalidRequired.join(',')}`);
              return;
            }

            const reviewQuery = `query($owner:String!,$repo:String!,$number:Int!){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$number){
                  id
                  headRefOid
                  isDraft
                  reviewThreads(first:100){totalCount nodes{isResolved}}
                }
              }
            }`;
            const reviewData = await github.graphql(reviewQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pullNumber,
            });
            const reviewPull = reviewData.repository?.pullRequest;
            const reviewThreads = reviewPull?.reviewThreads;
            if (
              !reviewPull
              || reviewPull.isDraft !== true
              || String(reviewPull.headRefOid || '').toLowerCase() !== expectedHead
              || Number(reviewThreads?.totalCount || 0) > 100
              || (reviewThreads?.nodes || []).some((thread) => thread?.isResolved !== true)
            ) {
              core.setFailed('REVIEW_EVIDENCE_NOT_READY');
              return;
            }

            core.info(JSON.stringify({
              status: 'EXACT_OWNER_APPROVED_PR_VALIDATED_FOR_VPS_CONTROL',
              prNumber: pullNumber,
              headSha: expectedHead,
              controlRevision: context.sha,
              secretValuesReturned: false,
            }));

      - name: Submit exact merge through Sovereign VPS control plane
        id: merge
        env:
          RUNTIME_READBACK_SSH_PRIVATE_KEY: ${{ secrets.SOVEREIGN_RUNTIME_READBACK_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$RUNTIME_READBACK_SSH_PRIVATE_KEY"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          install -m 0600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$RUNTIME_READBACK_SSH_PRIVATE_KEY" > "$ssh_dir/id_ed25519"
          printf '%s\n' '46.202.154.25 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVZLyqUD5nlHXfk1sRA0v829TiZyxa5Bs4AS/G8eWLv' > "$ssh_dir/known_hosts"
          chmod 0600 "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"
          test "$(ssh-keygen -lf "$ssh_dir/known_hosts" | awk '{print $2}')" = 'SHA256:pskBohJoTx/V3iCPaD9m1sW1vchvhvGc89lKnX0RocQ'

          cat <<'PY' \
            | ssh \
              -i "$ssh_dir/id_ed25519" \
              -o BatchMode=yes \
              -o ClearAllForwardings=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              -o GlobalKnownHostsFile=/dev/null \
              -o HostKeyAlgorithms=ssh-ed25519 \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=20 \
              -o TCPKeepAlive=yes \
              root@46.202.154.25 \
              'docker exec -i sovereign-chatgpt-mcp python -' \
            > "$ssh_dir/merge-result.json"
          import json
          import server

          result = server.broker.call(
              "github_merge_pr",
              {
                  "pr_number": 1748,
                  "expected_head_sha": "1c3791f7006add0d76c79f4c9cb84376da810f95",
                  "merge_method": "squash",
                  "self_update_after_merge": False,
                  "owner_approved": True,
                  "mark_ready_if_draft": True,
                  "allow_unrelated_android_pending": False,
              },
              timeout=180,
          )
          print(json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY

          python3 - "$ssh_dir/merge-result.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import re
          import sys

          lines = [line for line in Path(sys.argv[1]).read_text('utf-8').splitlines() if line.strip()]
          result = json.loads(lines[-1])
          expected = '1c3791f7006add0d76c79f4c9cb84376da810f95'
          merge_sha = str(result.get('merge_commit_sha') or '').lower()
          assert result.get('ok') is True, result
          assert result.get('status') == 'MERGED', result
          assert result.get('pr_number') == 1748, result
          assert result.get('head_sha') == expected, result
          assert result.get('merge_method') == 'squash', result
          assert result.get('owner_approved') is True, result
          assert re.fullmatch(r'[0-9a-f]{40}', merge_sha), result
          with Path(sys.argv[2]).open('a', encoding='utf-8') as output:
              output.write(f'merge_sha={merge_sha}\n')
          PY

      - name: Verify exact GitHub merge readback
        uses: actions/github-script@v7
        env:
          EXPECTED_HEAD: 1c3791f7006add0d76c79f4c9cb84376da810f95
          EXPECTED_MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
        with:
          script: |
            const pull = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: 1748,
            })).data;
            const expectedHead = String(process.env.EXPECTED_HEAD || '').toLowerCase();
            const expectedMerge = String(process.env.EXPECTED_MERGE_SHA || '').toLowerCase();
            if (
              pull.state !== 'closed'
              || !pull.merged_at
              || pull.draft !== false
              || String(pull.head?.sha || '').toLowerCase() !== expectedHead
              || String(pull.merge_commit_sha || '').toLowerCase() !== expectedMerge
            ) {
              core.setFailed('EXACT_MERGE_READBACK_MISMATCH');
              return;
            }
            core.info(JSON.stringify({
              status: 'EXACT_OWNER_APPROVED_PR_MERGED',
              prNumber: 1748,
              headSha: expectedHead,
              mergeCommitSha: expectedMerge,
              secretValuesReturned: false,
            }));

  review-evidence:
    name: Read exact PR review conversations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read bounded review evidence and optionally resolve one exact thread
        id: evidence
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.expected_head_sha }}
          CONFIRM_RESOLVE: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_resolve || false }}
          EXPECTED_THREAD_ID_SHA256: ${{ inputs.expected_thread_id_sha256 }}
          EXPECTED_COMMENT_BODY_SHA256: ${{ inputs.expected_comment_body_sha256 }}
          EXPECTED_PATH: ${{ inputs.expected_path }}
          EXPECTED_AUTHOR: ${{ inputs.expected_author }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const number = Number.parseInt(process.env.PR_NUMBER || '', 10);
            const expectedHead = String(process.env.EXPECTED_HEAD_SHA || '').trim().toLowerCase();
            const confirmResolve = String(process.env.CONFIRM_RESOLVE || '').toLowerCase() === 'true';
            const expectedThreadHash = String(process.env.EXPECTED_THREAD_ID_SHA256 || '').trim().toLowerCase();
            const expectedBodyHash = String(process.env.EXPECTED_COMMENT_BODY_SHA256 || '').trim().toLowerCase();
            const expectedPath = String(process.env.EXPECTED_PATH || '').trim();
            const expectedAuthor = String(process.env.EXPECTED_AUTHOR || '').trim();
            if (!Number.isInteger(number) || number < 1) {
              core.setFailed('PR_NUMBER_INVALID');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHead)) {
              core.setFailed('EXPECTED_HEAD_SHA_INVALID');
              return;
            }
            if (confirmResolve && (
              !/^[0-9a-f]{64}$/.test(expectedThreadHash)
              || !/^[0-9a-f]{64}$/.test(expectedBodyHash)
              || !expectedPath
              || !expectedAuthor
            )) {
              core.setFailed('RESOLUTION_CONFIRMATION_INCOMPLETE');
              return;
            }
            const query = `query($owner:String!,$repo:String!,$number:Int!,$cursor:String){
              repository(owner:$owner,name:$repo){
                pullRequest(number:$number){
                  headRefOid
                  state
                  isDraft
                  reviewThreads(first:100,after:$cursor){
                    pageInfo{hasNextPage endCursor}
                    nodes{
                      id
                      isResolved
                      isOutdated
                      path
                      line
                      startLine
                      comments(first:20){
                        nodes{id author{login} body createdAt url}
                      }
                    }
                  }
                }
              }
            }`;
            const variables = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number,
              cursor: null,
            };
            const threads = [];
            let pullMeta = null;
            do {
              const data = await github.graphql(query, variables);
              const pull = data.repository?.pullRequest;
              if (!pull) {
                core.setFailed('PULL_REQUEST_NOT_FOUND');
                return;
              }
              if (!pullMeta) {
                pullMeta = {headRefOid: pull.headRefOid, state: pull.state, isDraft: pull.isDraft};
              }
              threads.push(...(pull.reviewThreads?.nodes || []));
              const pageInfo = pull.reviewThreads?.pageInfo || {};
              variables.cursor = pageInfo.hasNextPage ? pageInfo.endCursor : null;
            } while (variables.cursor);
            if (String(pullMeta.headRefOid || '').toLowerCase() !== expectedHead) {
              core.setFailed('PR_HEAD_IDENTITY_MISMATCH');
              return;
            }
            const sha = (value) => crypto.createHash('sha256').update(String(value || '')).digest('hex');
            const bounded = threads.map((thread) => {
              const comments = (thread.comments?.nodes || []).map((comment) => ({
                idSha256: sha(comment.id),
                author: String(comment.author?.login || ''),
                body: String(comment.body || '').slice(0, 3000),
                bodySha256: sha(comment.body),
                createdAt: String(comment.createdAt || ''),
                url: String(comment.url || ''),
              }));
              return {
                threadIdSha256: sha(thread.id),
                isResolved: Boolean(thread.isResolved),
                isOutdated: Boolean(thread.isOutdated),
                path: String(thread.path || ''),
                line: thread.line ?? null,
                startLine: thread.startLine ?? null,
                comments,
              };
            });
            let resolved = false;
            if (confirmResolve) {
              const match = threads.find((thread) => {
                const comments = thread.comments?.nodes || [];
                return sha(thread.id) === expectedThreadHash
                  && String(thread.path || '') === expectedPath
                  && comments.some((comment) => (
                    sha(comment.body) === expectedBodyHash
                    && String(comment.author?.login || '') === expectedAuthor
                  ));
              });
              if (!match || match.isResolved) {
                core.setFailed(match ? 'THREAD_ALREADY_RESOLVED' : 'REVIEW_THREAD_EVIDENCE_MISMATCH');
                return;
              }
              const mutation = `mutation($threadId:ID!){
                resolveReviewThread(input:{threadId:$threadId}){thread{id isResolved}}
              }`;
              const mutationResult = await github.graphql(mutation, {threadId: match.id});
              const updated = mutationResult.resolveReviewThread?.thread;
              if (!updated || updated.id !== match.id || updated.isResolved !== true) {
                core.setFailed('REVIEW_THREAD_RESOLUTION_NOT_CONFIRMED');
                return;
              }
              resolved = true;
            }
            const artifact = {
              schemaVersion: 'sovereign.pr-review-evidence.v1',
              repository: `${context.repo.owner}/${context.repo.repo}`,
              prNumber: number,
              headSha: expectedHead,
              state: pullMeta.state,
              isDraft: Boolean(pullMeta.isDraft),
              threadCount: bounded.length,
              unresolvedCount: bounded.filter((thread) => !thread.isResolved).length - (resolved ? 1 : 0),
              resolutionPerformed: resolved,
              threads: bounded,
              secretValuesReturned: false,
            };
            fs.mkdirSync('.sovereign-evidence', {recursive: true});
            fs.writeFileSync(
              '.sovereign-evidence/pr-review-evidence.json',
              `${JSON.stringify(artifact)}\n`,
              {encoding: 'utf8', mode: 0o600},
            );
            core.info(JSON.stringify({
              status: resolved ? 'EXACT_REVIEW_THREAD_RESOLVED' : 'PR_REVIEW_EVIDENCE_READY',
              prNumber: number,
              headSha: expectedHead,
              threadCount: artifact.threadCount,
              unresolvedCount: artifact.unresolvedCount,
              secretValuesReturned: false,
            }));

      - name: Upload bounded review evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-evidence-${{ github.event.pull_request.number || inputs.pr_number }}-${{ github.run_id }}
          path: .sovereign-evidence/pr-review-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
