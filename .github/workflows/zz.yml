name: Sovereign AI Architecture Corpus

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact source revision to embed
        required: true
        default: d8393f4323923b65cf3edb4df0e4d3b3e789cb2a

permissions:
  contents: write

jobs:
  generate-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate one-file architecture corpus
        run: |
          python3 scripts/generate_sovereign_ai_architecture_corpus.py \
            --revision "${{ inputs.source_revision }}" \
            --expected-count 1643 \
            --output docs/architecture/SOVEREIGN_AI_ARCHITECTURE_CORPUS.md \
            | tee /tmp/sovereign-corpus-result.json

      - name: Record corpus evidence
        run: |
          test -s docs/architecture/SOVEREIGN_AI_ARCHITECTURE_CORPUS.md
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/architecture/SOVEREIGN_AI_ARCHITECTURE_CORPUS.md')
          content = path.read_text(encoding='utf-8')
          print({
              'begin_count': content.count('<!-- SOVEREIGN_FILE_BEGIN '),
              'end_count': content.count('<!-- SOVEREIGN_FILE_END -->'),
              'complete_marker': '"complete": true' in content,
              'contains_null': '\x00' in content,
              'bytes': path.stat().st_size,
          })
          PY
          sha256sum docs/architecture/SOVEREIGN_AI_ARCHITECTURE_CORPUS.md
          wc -c docs/architecture/SOVEREIGN_AI_ARCHITECTURE_CORPUS.md

      - name: Remove temporary generator surfaces
        run: |
          git checkout origin/main -- .github/workflows/zz.yml
          rm -f scripts/generate_sovereign_ai_architecture_corpus.py
          rm -f scripts/test_generate_sovereign_ai_architecture_corpus.py

      - name: Commit monolithic corpus to current branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs(architecture): add complete AI repository corpus"
          git push origin "HEAD:${BRANCH_NAME}"
