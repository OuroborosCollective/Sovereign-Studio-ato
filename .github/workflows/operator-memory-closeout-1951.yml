name: Operator Memory Closeout 1951

on:
  push:
    branches:
      - sovereign/chatgpt/a2a-server-reconcile-20260914

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard exact head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "7a4eacf744c7982f1771d8e733f799eee930c1bc"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/operator-memory-closeout-1951.yml"
          ! grep -Fq '### 2026-09-14 — Server-owned Agent Zero repository reconciliation (#1951)' Memory.md
      - name: Append Memory entry
        shell: bash
        env:
          MEMORY_ENTRY_B64: ""
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('Memory.md')
          marker = '### 2026-09-14 — Server-owned Agent Zero repository reconciliation (#1951)'
          text = p.read_text('utf-8')
          if marker in text:
              raise SystemExit('memory marker already exists')
          p.write_bytes(text.encode('utf-8') + base64.b64decode(os.environ['MEMORY_ENTRY_B64']))
          PY
          test "$(grep -Fc '### 2026-09-14 — Server-owned Agent Zero repository reconciliation (#1951)' Memory.md)" = "1"
          git diff --check
      - name: Commit closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/operator-memory-closeout-1951.yml
          git add Memory.md
          git commit -m "docs(memory): close A2A server reconciliation block"
          git push origin HEAD:sovereign/chatgpt/a2a-server-reconcile-20260914
