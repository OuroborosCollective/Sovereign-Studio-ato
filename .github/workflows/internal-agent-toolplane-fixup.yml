name: Internal Agent Toolplane Fixup One-Shot

on:
  push:
    branches:
      - sovereign/chatgpt/internal-agent-toolplane-20260911

permissions:
  contents: write

jobs:
  fixup:
    if: contains(github.event.head_commit.message, '[apply-toolplane-fixup]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/internal-agent-toolplane-20260911
          fetch-depth: 0
      - name: Apply exact fixup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), 'utf-8')

          old_values = '''                ) VALUES (\n                    %s, %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s, %s, %s,\n                    %s, %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s,\n                    %s, %s::jsonb\n                )'''
          new_values = '''                ) VALUES (\n                    %s, %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s, %s, %s,\n                    %s, %s, %s,\n                    %s, %s,\n                    %s, %s::jsonb\n                )'''
          for path in (
              'backend/agent_runtime/cognitive_run_store.py',
              'scripts/sovereign-backend/agent_runtime/cognitive_run_store.py',
          ):
              replace_once(path, old_values, new_values)

          old_failure = '''                        execution_runtime_kind="backend",\n                execution_revision=execution_identity.revision,\n                        execution_image_digest=execution_identity.image_digest,\n                        execution_revision_verified=execution_identity.revision_verified,\n                execution_image_digest_verified=execution_identity.image_digest_verified,'''
          new_failure = '''                        execution_runtime_kind="backend",\n                        execution_revision=execution_identity.revision,\n                        execution_image_digest=execution_identity.image_digest,\n                        execution_revision_verified=execution_identity.revision_verified,\n                        execution_image_digest_verified=execution_identity.image_digest_verified,'''
          for path in (
              'backend/agent_runtime/cognitive_repository_tools.py',
              'scripts/sovereign-backend/agent_runtime/cognitive_repository_tools.py',
          ):
              replace_once(path, old_failure, new_failure)

          # Count the INSERT contract structurally: 24 columns, 24 DB parameters.
          source = Path('backend/agent_runtime/cognitive_run_store.py').read_text('utf-8')
          start = source.index('INSERT INTO agent_run_receipts (')
          end = source.index('                )\n                """,', start)
          block = source[start:end]
          values = block.split(') VALUES (', 1)[1]
          if values.count('%s') != 24:
              raise SystemExit(f'agent_run_receipts INSERT expected 24 placeholders, got {values.count("%s")}')
          PY

          python3 -m py_compile \
            backend/agent_runtime/agent_run_receipts.py \
            backend/agent_runtime/cognitive_repository_tools.py \
            backend/agent_runtime/cognitive_run_store.py \
            backend/agent_runtime/live_workspace.py \
            backend/tests/test_internal_agent_execution_identity.py
          cmp backend/agent_runtime/agent_run_receipts.py scripts/sovereign-backend/agent_runtime/agent_run_receipts.py
          cmp backend/agent_runtime/cognitive_repository_tools.py scripts/sovereign-backend/agent_runtime/cognitive_repository_tools.py
          cmp backend/agent_runtime/cognitive_run_store.py scripts/sovereign-backend/agent_runtime/cognitive_run_store.py
          cmp backend/agent_runtime/live_workspace.py scripts/sovereign-backend/agent_runtime/live_workspace.py
          cmp backend/migrations/062_agent_execution_runtime_identity.sql scripts/sovereign-backend/migrations/062_agent_execution_runtime_identity.sql
          git diff --check

          git rm .github/workflows/internal-agent-toolplane-fixup.yml
          git config user.name "Ouroboros Toolplane Repair"
          git config user.email "actions@users.noreply.github.com"
          git add backend scripts/sovereign-backend
          git commit -m "fix(agent): align execution receipt persistence contract"
          git push origin HEAD:sovereign/chatgpt/internal-agent-toolplane-20260911
