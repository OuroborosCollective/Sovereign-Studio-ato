name: Sovereign Public Site - Review

on:
  pull_request:
    paths:
      - "public-site/**"
      - "scripts/verify-public-site.py"
      - "tests/test_public_site_contract.py"
      - ".github/workflows/sovereign-public-site-check.yml"
      - ".github/workflows/sovereign-pages-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@v6
      - name: Test real validator and site contracts
        run: python3 -m unittest discover -s tests -p 'test_public_site_contract.py' -v
      - name: Validate static content and local links
        run: python3 scripts/verify-public-site.py --root public-site --mode preview
