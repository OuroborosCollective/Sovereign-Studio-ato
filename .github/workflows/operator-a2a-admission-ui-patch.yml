name: Operator A2A Admission UI Patch
on:
  push:
    branches: [sovereign/chatgpt/a2a-admission-ui-repair-20260914]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/a2a-admission-ui-repair-20260914
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); text=p.read_text()
              actual=text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, got {actual}')
              p.write_text(text.replace(old,new,count))

          # A2A admission: the FastA2A in-memory broker can wait for its serial worker
          # to receive while another task is executing. 30s was shorter than the real
          # bounded Agent Zero execution corridor and created false unknown-outcome blocks.
          for path in ['backend/agent_runtime/agent_zero_a2a.py','scripts/sovereign-backend/agent_runtime/agent_zero_a2a.py']:
              replace(path,
                  '_A2A_CALL_TIMEOUT_SECONDS: Final[int] = 30\n',
                  '_A2A_READ_TIMEOUT_SECONDS: Final[int] = 30\n_A2A_SUBMIT_TIMEOUT_SECONDS: Final[int] = 900\n')
              replace(path,
                  'timeout=min(self.config.timeout_seconds, _A2A_CALL_TIMEOUT_SECONDS),',
                  'timeout=(\n                    _A2A_SUBMIT_TIMEOUT_SECONDS\n                    if submit\n                    else min(self.config.timeout_seconds, _A2A_READ_TIMEOUT_SECONDS)\n                ),')

          # Ocular matrix must remain visible on the mobile product surface seen by users.
          replace('src/features/control-surface-vnext/components/CyborgOcularMatrix/CyborgOcularMatrix.tsx',
              'className="relative hidden sm:flex items-center gap-2 select-none"',
              'className="relative flex items-center gap-1 sm:gap-2 select-none shrink-0"')
          replace('src/features/control-surface-vnext/components/CyborgOcularMatrix/CyborgOcularMatrix.tsx',
              'className="relative w-[88px] h-[48px] md:w-[112px] md:h-[58px] flex items-center justify-center overflow-visible"',
              'className="relative w-[52px] h-[34px] sm:w-[88px] sm:h-[48px] md:w-[112px] md:h-[58px] flex items-center justify-center overflow-visible"')

          # Do not stack stale "accepted" cards. The latest persisted run owns the
          # projection; terminal failure is appended exactly once for that run.
          replace('src/features/control-surface-vnext/App.tsx',
              "      setMessages((current) => [...current, {\n        id: `accepted-${accepted.jobId}`,\n        role: 'assistant',\n        sender: 'SOVEREIGN_SWARM',\n        content: `PERSISTED RUN ACCEPTED :: [${accepted.jobId}].\\nAwaiting exact run/job/evidence readback. No completion or publication is implied.`,\n        timestamp: new Date().toISOString(),\n      }]);",
              "      setMessages((current) => [...current.filter((message) => !message.id.startsWith('accepted-')), {\n        id: `accepted-${accepted.jobId}`,\n        role: 'assistant',\n        sender: 'SOVEREIGN_SWARM',\n        content: `PERSISTED RUN ACCEPTED :: [${accepted.jobId}].\\nAwaiting exact run/job/evidence readback. No completion or publication is implied.`,\n        timestamp: new Date().toISOString(),\n      }]);")

          anchor="  useEffect(() => {\n    const pr = job?.draftPR;\n"
          insert="  useEffect(() => {\n    if (!job?.error?.message || !activeRunId || !['BLOCKED', 'FAILED'].includes(currentPhase)) return;\n    setMessages((current) => {\n      const id = `terminal-${activeRunId}`;\n      if (current.some((message) => message.id === id)) return current;\n      return [...current, {\n        id,\n        role: 'system',\n        sender: 'SYSTEM',\n        content: `RUN ${currentPhase} :: [${activeRunId}]\\n${job.error.message}${job.nextAction ? `\\nNEXT: ${job.nextAction}` : ''}`,\n        timestamp: new Date().toISOString(),\n      }];\n    });\n  }, [activeRunId, currentPhase, job?.error?.message, job?.nextAction]);\n\n  useEffect(() => {\n    const pr = job?.draftPR;\n"
          replace('src/features/control-surface-vnext/App.tsx', anchor, insert)

          # Keep a truthful workspace identity visible even before changed-file closeout.
          replace('src/features/control-surface-vnext/components/WorkspaceProjection/WorkspaceProjection.tsx',
              'interface Props { workspace: WorkspaceState | undefined; }\n\nexport function WorkspaceProjection({ workspace }: Props) {',
              'interface Props { workspace: WorkspaceState | undefined; workspaceId?: string; sourceStatus?: string; }\n\nexport function WorkspaceProjection({ workspace, workspaceId, sourceStatus }: Props) {')
          replace('src/features/control-surface-vnext/components/WorkspaceProjection/WorkspaceProjection.tsx',
              '      {diffStats && <div className="flex items-center gap-2 font-mono text-[9.5px] mb-2 p-1.5 rounded bg-[var(--carbon-surface)] border border-white/5"><Diff size={12} className="text-[var(--text-dim)]" /><span className="text-[var(--text-dim)]">FILES</span>',
              '      {workspaceId && <div className="font-mono text-[9px] mb-2 px-1.5 py-1 rounded bg-[var(--carbon-surface)] border border-white/5 text-[var(--text-muted)]"><span className="text-[var(--text-dim)]">WORKSPACE </span><span className="text-white">{workspaceId}</span>{sourceStatus ? <span className="ml-2 text-[var(--text-dim)]">{sourceStatus.toUpperCase()}</span> : null}</div>}\n      {diffStats && <div className="flex items-center gap-2 font-mono text-[9.5px] mb-2 p-1.5 rounded bg-[var(--carbon-surface)] border border-white/5"><Diff size={12} className="text-[var(--text-dim)]" /><span className="text-[var(--text-dim)]">FILES</span>')
          replace('src/features/control-surface-vnext/App.tsx',
              '  const workspacePanel = <WorkspaceProjection workspace={workspace} />;',
              '  const workspacePanel = <WorkspaceProjection workspace={workspace} workspaceId={job?.workspaceId} sourceStatus={job?.sourceStatus} />;')

          # Contract regressions for the mobile eye and truth-bound workspace/run projection.
          marker="    expect(surface).not.toContain('md:hidden flex flex-col w-full h-full');\n"
          replacement=marker + "    const ocular = source('src/features/control-surface-vnext/components/CyborgOcularMatrix/CyborgOcularMatrix.tsx');\n    expect(ocular).toContain('data-testid=\\\"vnext-cyborg-ocular-matrix\\\"');\n    expect(ocular).toContain('relative flex items-center');\n    expect(ocular).not.toContain('relative hidden sm:flex');\n    const workspace = source('src/features/control-surface-vnext/components/WorkspaceProjection/WorkspaceProjection.tsx');\n    expect(workspace).toContain('workspaceId?: string');\n    expect(surface).toContain('workspaceId={job?.workspaceId}');\n    expect(surface).toContain('terminal-${activeRunId}');\n"
          replace('src/features/control-surface-vnext/controlSurfaceTruthContract.test.ts', marker, replacement)

          # Backend regressions: submit/read timeouts stay intentionally separate.
          marker2='    assert calls[0]["json"]["params"]["configuration"]["acceptedOutputModes"] == ["text", "text/plain"]\n'
          replacement2=marker2 + '    assert calls[0]["timeout"] == 900\n'
          replace('backend/tests/test_agent_zero_a2a.py', marker2, replacement2)
          replace('backend/tests/test_agent_zero_a2a.py',
              '        assert kwargs["json"]["params"] == {"id": "task-expected"}\n',
              '        assert kwargs["json"]["params"] == {"id": "task-expected"}\n        assert kwargs["timeout"] == 30\n')

          # Mirror parity is mandatory.
          for name in ['agent_zero_a2a.py']:
              a=Path('backend/agent_runtime')/name; b=Path('scripts/sovereign-backend/agent_runtime')/name
              if a.read_bytes()!=b.read_bytes(): raise SystemExit(f'mirror mismatch: {name}')
          PY
      - name: Targeted verification
        run: |
          set -euo pipefail
          python -m pytest backend/tests/test_agent_zero_a2a.py backend/tests/test_repository_execution.py -q
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec vitest run src/features/control-surface-vnext/controlSurfaceTruthContract.test.ts
          pnpm run type-check
          git diff --check
      - name: Commit product patch and remove operator workflow
        run: |
          set -euo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add backend/agent_runtime/agent_zero_a2a.py scripts/sovereign-backend/agent_runtime/agent_zero_a2a.py backend/tests/test_agent_zero_a2a.py src/features/control-surface-vnext/App.tsx src/features/control-surface-vnext/components/CyborgOcularMatrix/CyborgOcularMatrix.tsx src/features/control-surface-vnext/components/WorkspaceProjection/WorkspaceProjection.tsx src/features/control-surface-vnext/controlSurfaceTruthContract.test.ts
          git commit -m "fix(agent-ui): bound A2A admission and restore live projections"
          git rm .github/workflows/operator-a2a-admission-ui-patch.yml
          git commit -m "chore(operator): remove one-shot patch workflow"
          git push origin HEAD:sovereign/chatgpt/a2a-admission-ui-repair-20260914
