          grep -q '"semantic_compatibility_verified":%s' deploy/install-on-vps.sh
          grep -q '"first_install_attested":%s' deploy/install-on-vps.sh
          grep -q 'INSTALL_STAGE="verify_isolated_neuro_runtime_canary"' deploy/install-on-vps.sh
