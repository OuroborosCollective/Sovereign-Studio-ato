name: Sovereign ChatGPT MCP

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_pr_branch:
        description: Merge the exact current main revision into one confirmed same-repository PR branch
        required: false
        default: false
        type: boolean
      target_pr_number:
        description: Exact open pull request number whose same-repository branch will be updated
        required: false
        default: ''
        type: string
      expected_head_sha:
        description: Exact current PR head SHA before the branch update
        required: false
        default: ''
        type: string
      expected_base_sha:
        description: Exact current main SHA to merge into the PR branch
        required: false
        default: ''
        type: string
      deploy_vps_via_public_ssh:
        description: Manually run the legacy public-runner VPS bootstrap (never used by automatic main pushes)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/ouroboroscollective/sovereign-chatgpt-mcp
  KAPPA_POS: '1000000'
  CROSS_RUNTIME_PARITY: 'true'
  SOVEREIGN_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.update_pr_branch == true && format('pr-update-{0}', inputs.target_pr_number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  update-pr-branch:
    name: Owner update PR branch
    if: github.event_name == 'workflow_dispatch' && inputs.update_pr_branch == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Resolve exact same-repository PR branch
        id: resolve
        uses: actions/github-script@v7
        env:
          TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        with:
          script: |
            const numberText = String(process.env.TARGET_PR_NUMBER || '').trim();
            const expectedHead = String(process.env.EXPECTED_HEAD_SHA || '').trim().toLowerCase();
            const expectedBase = String(process.env.EXPECTED_BASE_SHA || '').trim().toLowerCase();
            if (!/^[1-9][0-9]*$/.test(numberText)) {
              core.setFailed('TARGET_PR_NUMBER_INVALID');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHead) || !/^[0-9a-f]{40}$/.test(expectedBase)) {
              core.setFailed('EXPECTED_REVISION_INVALID');
              return;
            }
            const number = Number(numberText);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            const { data: mainRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            const headRepository = String(pull.head?.repo?.full_name || '');
            const headRef = String(pull.head?.ref || '');
            const headSha = String(pull.head?.sha || '').toLowerCase();
            const baseRef = String(pull.base?.ref || '');
            const baseSha = String(mainRef.object?.sha || '').toLowerCase();
            if (pull.state !== 'open') {
              core.setFailed('PR_NOT_OPEN');
              return;
            }
            if (baseRef !== 'main') {
              core.setFailed('PR_BASE_IS_NOT_MAIN');
              return;
            }
            if (headRepository !== repository) {
              core.setFailed('FORK_PR_UPDATE_FORBIDDEN');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/.test(headRef) || headRef.includes('..')) {
              core.setFailed('PR_HEAD_REF_INVALID');
              return;
            }
            if (['main', 'master'].includes(headRef.toLowerCase())) {
              core.setFailed('PROTECTED_PR_HEAD_REF');
              return;
            }
            if (headSha !== expectedHead) {
              core.setFailed('PR_HEAD_IDENTITY_MISMATCH');
              return;
            }
            if (baseSha !== expectedBase) {
              core.setFailed('MAIN_REVISION_CHANGED');
              return;
            }
            core.setOutput('target_ref', headRef);
            core.info(JSON.stringify({
              status: 'PR_BRANCH_IDENTITY_VERIFIED',
              prNumber: number,
              headRef,
              headSha,
              baseSha,
              sameRepository: true,
              secretValuesReturned: false,
            }));

      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge exact main revision without force-push
        env:
          TARGET_REF: ${{ steps.resolve.outputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${EXPECTED_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TARGET_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]
          [[ "${TARGET_REF}" != *".."* ]]
          test "${TARGET_REF}" != main
          test "${TARGET_REF}" != master
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          test "${ACTUAL_HEAD_SHA}" = "${EXPECTED_HEAD_SHA}"
          git fetch --no-tags origin main
          ACTUAL_BASE_SHA="$(git rev-parse origin/main)"
          test "${ACTUAL_BASE_SHA}" = "${EXPECTED_BASE_SHA}"
          if git merge-base --is-ancestor "${ACTUAL_BASE_SHA}" "${ACTUAL_HEAD_SHA}"; then
            echo "Branch already contains the confirmed main revision."
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git merge --no-ff --no-edit "${ACTUAL_BASE_SHA}" \
            -m "Merge confirmed main ${ACTUAL_BASE_SHA} into ${TARGET_REF}"
          git diff --check "${ACTUAL_HEAD_SHA}..HEAD"
          UPDATED_HEAD_SHA="$(git rev-parse HEAD)"
          test "${UPDATED_HEAD_SHA}" != "${ACTUAL_HEAD_SHA}"
          git push origin "HEAD:${TARGET_REF}"
          REMOTE_HEAD_SHA="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          test "${REMOTE_HEAD_SHA}" = "${UPDATED_HEAD_SHA}"
          printf 'Updated PR branch: %s -> %s at %s\n' "${ACTUAL_HEAD_SHA}" "${UPDATED_HEAD_SHA}" "${TARGET_REF}"

  boundary-ledger-drift:
    name: Boundary ledger drift preflight
    if: github.event_name != 'workflow_dispatch' || inputs.update_pr_branch != true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOVEREIGN_SOURCE_REVISION }}

      - name: Discover candidates and compare the review ledger
        run: |
          mkdir -p .sovereign-evidence
          python scripts/reconcile_llm_boundary_ledger.py \
            --expected-head "${SOVEREIGN_SOURCE_REVISION}" \
            --report .sovereign-evidence/boundary-ledger-drift.json

      - name: Upload bounded drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-boundary-ledger-drift-${{ github.run_id }}
          path: .sovereign-evidence/boundary-ledger-drift.json
          if-no-files-found: error
          retention-days: 7

  validate:
    name: Validate MCP operator
    needs: boundary-ledger-drift
    if: github.event_name != 'workflow_dispatch' || inputs.update_pr_branch != true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/sovereign-chatgpt-mcp
    env:
      SOVEREIGN_MCP_WORKSPACE_ROOT: /tmp/sovereign-mcp-workspaces
      SOVEREIGN_MCP_HOST: 127.0.0.1
      SOVEREIGN_MCP_PORT: '8090'
      SOVEREIGN_MCP_REPOSITORY: OuroborosCollective/Sovereign-Studio-ato
      SOVEREIGN_ANDROID_NATIVE_BUILD_MODE: github_actions
      SOVEREIGN_KAPPA_POS: '1000000'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOVEREIGN_SOURCE_REVISION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/sovereign-chatgpt-mcp/requirements.txt

      - name: Setup Node.js parity runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate deterministic constants
        run: |
          set -euo pipefail
          test "${KAPPA_POS}" = '1000000'
          [[ "${KAPPA_POS}" =~ ^[1-9][0-9]*$ ]]
          python - <<'PY'
          import os

          kappa_pos = int(os.environ['KAPPA_POS'])
          assert kappa_pos == 1_000_000
          assert str(kappa_pos) == os.environ['SOVEREIGN_KAPPA_POS']
          print({'kappa_pos': kappa_pos, 'deterministic_constant': True})
          PY

      - name: Compile Python runtime
        run: |
          python -m py_compile policy.py runtime.py database.py command_contract.py command_queue.py command_worker.py operations.py admin_mode.py github_admin.py github_knowledge_canary.py github_knowledge_mcp_client.py evidence_observatory_cag_runtime.py github_issue_contracts.py self_update.py broker.py broker_client.py owner_input_client.py a2a_runtime_client.py document_pipeline.py owner_input_widget.py self_heal.py managed_compose.py patchmon_operator.py android_hardening.py android_validation_router.py mcp_protocol_health.py sovereign_cognitive_widget.py llm_boundary_contract.py llm_boundary_ledger.py ci_repair_tools.py repository_skill_tools.py proven_learning_tools.py skill_supply_chain_tools.py deterministic_contract.py deterministic_architecture_tools.py enterprise_backend_tools.py freemium_product_architect_tools.py openai_project_access_tools.py continuity.py validate_continuity.py operating_profile.py operational_governance_tools.py operational_assurance_tools.py output_contracts.py toolchain_composition.py server.py tool_extensions.py launcher.py
          python -m py_compile neuro_architecture_contract.py neuromorphic_runtime.py foundation_runtime.py neuro_teaching_tools.py

      - name: Validate fixed shell and systemd assets
        run: |
          set -euo pipefail
          bash -n deploy/deploy-sovereign-backend
          bash -n deploy/rollback-sovereign-backend
          bash -n deploy/bootstrap-database.sh
          bash -n deploy/install-secure-tunnel.sh
          bash -n deploy/self-update-chatgpt-mcp.sh
          bash -n deploy/install-on-vps.sh
          python -m py_compile deploy/reconcile-main-release.py
          test -f deploy/sovereign-release-reconciler.service
          test -f deploy/sovereign-release-reconciler.timer
          if grep -n 'curl ' deploy/deploy-sovereign-backend deploy/rollback-sovereign-backend deploy/install-secure-tunnel.sh deploy/sovereign-openai-tunnel.service; then
            echo 'Operator deployment path must not depend on curl.' >&2
            exit 1
          fi
          grep -q 'admin_mode.py' deploy/install-on-vps.sh
          grep -q 'github_admin.py' deploy/install-on-vps.sh
          grep -q 'github_issue_contracts.py' deploy/install-on-vps.sh
          grep -q 'android_hardening.py' deploy/install-on-vps.sh
          grep -q 'android_validation_router.py' deploy/install-on-vps.sh
          grep -q 'mcp_protocol_health.py' deploy/install-on-vps.sh
          grep -q 'sovereign_cognitive_widget.py' deploy/install-on-vps.sh
          grep -q 'command_contract.py' deploy/install-on-vps.sh
          grep -q 'command_queue.py' deploy/install-on-vps.sh
          grep -q 'command_worker.py' deploy/install-on-vps.sh
          grep -q 'owner_input_client.py' deploy/install-on-vps.sh
          grep -q 'a2a_runtime_client.py' deploy/install-on-vps.sh
          grep -q 'document_pipeline.py' deploy/install-on-vps.sh
          grep -q 'evidence_observatory_cag_runtime.py' deploy/install-on-vps.sh
          grep -q 'owner_input_widget.py' deploy/install-on-vps.sh
          grep -q 'SOVEREIGN_OWNER_REQUEST_KEY' deploy/install-on-vps.sh
          grep -q 'SOVEREIGN_BACKEND_INTERNAL_URL' deploy/install-on-vps.sh
          grep -q 'sovereign-chatgpt-command-worker.service' deploy/install-on-vps.sh
          grep -q 'tool_extensions.py' deploy/install-on-vps.sh
          grep -q 'repository_skill_tools.py' deploy/install-on-vps.sh
          grep -q 'proven_learning_tools.py' deploy/install-on-vps.sh
          grep -q 'skill_supply_chain_tools.py' deploy/install-on-vps.sh
          grep -q 'enterprise_backend_tools.py' deploy/install-on-vps.sh
          grep -q 'freemium_product_architect_tools.py' deploy/install-on-vps.sh
          grep -q 'openai_project_access_tools.py' deploy/install-on-vps.sh
          grep -q 'continuity.py' deploy/install-on-vps.sh
          grep -q 'validate_continuity.py' deploy/install-on-vps.sh
          grep -q 'operating_profile.py' deploy/install-on-vps.sh
          grep -q 'operational_governance_tools.py' deploy/install-on-vps.sh
          grep -q 'operational_assurance_tools.py' deploy/install-on-vps.sh
          grep -q 'output_contracts.py' deploy/install-on-vps.sh
          grep -q 'toolchain_composition.py' deploy/install-on-vps.sh
          grep -q 'neuro_architecture_contract.py' deploy/install-on-vps.sh
          grep -q 'neuromorphic_runtime.py' deploy/install-on-vps.sh
          grep -q 'foundation_runtime.py' deploy/install-on-vps.sh
          grep -q 'neuro_teaching_tools.py' deploy/install-on-vps.sh
          grep -q 'set_value "$MANAGED_ENV" SOVEREIGN_SOURCE_REVISION "$EXPECTED_REVISION"' deploy/install-on-vps.sh
          grep -q 'set_value "$MANAGED_ENV" SOVEREIGN_NEURO_POLICY_SHA256 "$NEURO_POLICY_SHA256"' deploy/install-on-vps.sh
          grep -q 'INSTALL_STAGE="capture_previous_mcp_tool_surface"' deploy/install-on-vps.sh
          grep -q 'INSTALL_STAGE="verify_mcp_tool_surface_preservation"' deploy/install-on-vps.sh
          grep -q 'mcp_tool_contract_registry(include_schemas=True)' deploy/install-on-vps.sh
          grep -q 'sovereign.mcp-deployment-contract-surface.v1' deploy/install-on-vps.sh
          grep -q '"changedCompatibleContracts": changed_compatible_contracts' deploy/install-on-vps.sh
          grep -q '"incompatibleContractCount": len(incompatible_contracts)' deploy/install-on-vps.sh
          grep -q '"semanticCompatibilityVerified": predecessor_captured' deploy/install-on-vps.sh
