          grep -q '"canary_persisted_outcome_tools":\["neuro_event_commit"\]' deploy/install-on-vps.sh
          grep -q 'EXPECTED_MCP_TOOL_COUNT="250"' deploy/install-on-vps.sh
          grep -q 'SOVEREIGN_NEURO_RUNTIME_STATE_ROOT: /var/lib/sovereign-tool-routing/neuro-runtime' docker-compose.yml
          grep -q 'SOVEREIGN_NEURO_GLOBAL_MAX_EVENTS: "100000"' docker-compose.yml
