name: Sovereign MCP public recovery diagnostic

on:
  push:
    branches: [fix/persistent-mcp-auth-proxy-network-2026-10-01]
    paths: [.github/workflows/sovereign-mcp-public-recovery-diagnostic.yml]

permissions:
  contents: read

jobs:
  public-readback:
    name: Read public MCP and OAuth discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe fixed public endpoints without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, re, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          def safe_url(value):
              if not isinstance(value, str): return None
              try:
                  parts = urllib.parse.urlsplit(value)
                  if parts.scheme != 'https' or parts.username or parts.password: return None
                  return urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, '', ''))
              except ValueError: return None
          def probe(path, payload=None):
              url = 'https://arelogic.space' + path
              request = urllib.request.Request(url, method='POST' if payload else 'GET',
                  data=json.dumps(payload).encode() if payload else None,
                  headers={'Accept': 'application/json, text/event-stream',
                           'Content-Type': 'application/json', 'MCP-Protocol-Version': '2025-06-18'})
              row = {'path': path, 'method': request.method}
              try:
                  try: response = opener.open(request, timeout=15)
                  except urllib.error.HTTPError as error: response = error
                  with response:
                      row['httpStatus'] = response.code
                      row['contentType'] = response.headers.get('Content-Type', '')
                      row['bearerChallengePresent'] = 'bearer' in response.headers.get('WWW-Authenticate', '').lower()
                      match = re.search(r'resource_metadata="([^"]+)"', response.headers.get('WWW-Authenticate', ''))
                      if match: row['resourceMetadataUrl'] = safe_url(match.group(1))
                      row['redirect'] = safe_url(response.headers.get('Location'))
                      data = response.read(1000001)
                      if len(data) > 1000000: return {**row, 'bodyTooLarge': True}
                      text = data.decode('utf-8', errors='replace')
                      if 'text/event-stream' in row['contentType']:
                          events = [line[5:].strip() for line in text.splitlines() if line.startswith('data:')]
                          text = events[-1] if events else ''
                      try: body = json.loads(text)
                      except ValueError: body = {}
                      if isinstance(body, dict):
                          for field in ('resource', 'issuer', 'authorization_endpoint', 'token_endpoint', 'registration_endpoint', 'jwks_uri'):
                              if field in body: row[field] = safe_url(body[field])
                          if isinstance(body.get('authorization_servers'), list):
                              row['authorizationServers'] = [safe_url(value) for value in body['authorization_servers'][:5]]
                          row['jsonRpcResponse'] = body.get('jsonrpc') == '2.0'
                          result = body.get('result')
                          if isinstance(result, dict):
                              server = result.get('serverInfo') or {}
                              row['operatorServerIdentified'] = server.get('name') == 'Sovereign ChatGPT Operator'
                              row['toolsCapabilityPresent'] = isinstance(result.get('capabilities'), dict) and 'tools' in result['capabilities']
                      row['aurionPageMarker'] = 'aurion' in text.lower()[:20000]
              except Exception as error:
                  row['transportErrorClass'] = type(error).__name__
              return row
          paths = ['/mcp','/.well-known/oauth-protected-resource','/.well-known/oauth-protected-resource/mcp',
                   '/.well-known/oauth-authorization-server','/.well-known/openid-configuration']
          results = [probe(path) for path in paths]
          results.append(probe('/mcp', {'jsonrpc':'2.0','id':1,'method':'initialize','params':{
              'protocolVersion':'2025-06-18','capabilities':{},
              'clientInfo':{'name':'sovereign-recovery-readback','version':'1.0'}}}))
          evidence = {'schemaVersion':'sovereign.public-mcp-recovery-diagnostic.v1',
                      'authenticated':False,'mutationPerformed':False,'secretValuesReturned':False,'responses':results}
          Path('public-mcp-readback.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n')
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Save observed public response evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-public-mcp-recovery-readback
          path: public-mcp-readback.json
          retention-days: 3

  vps-proxy-readback:
    name: Read bounded VPS proxy routing
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.SSH_USER }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.SSH_PORT || '22' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PW || secrets.SSH_PW || secrets.SSH_PASSWORD }}
    steps:
      - name: Validate authorized target and existing SSH secret
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$VPS_HOST" = "46.202.154.25"
          test "$VPS_USER" = "root"
          test -n "$SSHPASS" || { echo "EXISTING_VPS_PASSWORD_SECRET_UNAVAILABLE"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
      - name: Install distribution SSH password client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends sshpass
      - name: Reproduce isolated Neuro canary without production configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' '46.202.154.25 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVZLyqUD5nlHXfk1sRA0v829TiZyxa5Bs4AS/G8eWLv' > "$RUNNER_TEMP/sovereign-recovery-known-hosts"
          sshpass -e ssh -T -p "$VPS_PORT" -o ConnectTimeout=25 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$RUNNER_TEMP/sovereign-recovery-known-hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ClearAllForwardings=yes "$VPS_USER@$VPS_HOST" '/usr/bin/python3 -' > vps-proxy-readback.json <<'PY'
          import json, subprocess
          image = "ghcr.io/ouroboroscollective/sovereign-chatgpt-mcp@sha256:3ad4712189cdb0b4994b9bac959d512d8041f644a5f40e90fd5554ef9b7807de"
          argv = ["docker","run","--rm","-i","--network","none","--read-only","--cap-drop","ALL","--security-opt","no-new-privileges:true","--pids-limit","128","--memory","768m","--cpus","0.5","--no-healthcheck","--tmpfs","/tmp:rw,noexec,nosuid,nodev,size=192m,mode=1777","--entrypoint","python"]
          flags = json.loads("{\"SOVEREIGN_MCP_PRIVATE_OWNER_MODE\":\"1\",\"SOVEREIGN_MCP_ENABLE_AURION_OPERATOR\":\"1\",\"SOVEREIGN_MCP_ENABLE_AURION_WRITE\":\"1\",\"SOVEREIGN_MCP_ENABLE_AURION_ADMIN_MCP\":\"1\",\"AURION_ADMIN_MCP_SCOPES\":\"aurion.admin.read\",\"AURION_ADMIN_MCP_WOLFRAM_ENABLED\":\"0\",\"SOVEREIGN_MCP_GITHUB_APP_ID\":\"\",\"SOVEREIGN_MCP_GITHUB_APP_INSTALLATION_ID\":\"\",\"SOVEREIGN_MCP_GITHUB_APP_PRIVATE_KEY_FILE\":\"\",\"SOVEREIGN_EXPECTED_CANARY_REVISION\":\"e38064a11d43629c75d4540e9c11e155cda9f50f\",\"SOVEREIGN_EXPECTED_MCP_TOOL_COUNT\":\"288\",\"SOVEREIGN_NEURO_POLICY_SHA256\":\"e472de651ab74922581c0d4d0df411102e398b9c6788d3d4bd6878a3f5a9c9ea\",\"SOVEREIGN_NEURO_RUNTIME_TRACKING_ENABLED\":\"0\",\"SOVEREIGN_MCP_WORKSPACE_ROOT\":\"/tmp/workspaces\",\"SOVEREIGN_TOOL_RANKING_STATE_ROOT\":\"/tmp/tool-ranking\",\"SOVEREIGN_NEURO_RUNTIME_STATE_ROOT\":\"/tmp/neuro\",\"SOVEREIGN_MCP_HOST\":\"127.0.0.1\",\"SOVEREIGN_MCP_PORT\":\"8090\",\"SOVEREIGN_MCP_ALLOW_PUBLIC\":\"0\",\"SOVEREIGN_MCP_REPOSITORY\":\"OuroborosCollective/Sovereign-Studio-ato\",\"SOVEREIGN_ANDROID_NATIVE_BUILD_MODE\":\"github_actions\",\"SOVEREIGN_KAPPA_POS\":\"1000000\"}")
          for key,value in flags.items(): argv += ["-e",key+"="+value]
          argv += [image,"-"]
          result = subprocess.run(argv,input="from pathlib import Path\nPath('/tmp/canary-parent').mkdir()\nPath('/tmp/workspaces').mkdir()\nimport asyncio\nfrom datetime import datetime, timezone\nimport hashlib\nimport json\nimport os\nimport re\nfrom pathlib import Path\nimport sqlite3\nimport sys\nimport tempfile\n\n\ncanary_phase = \"bootstrap\"\n\n\ndef _safe_canary_exception_details(error_name, error) -> dict[str, object]:\n    if error_name == \"AssertionError\" and hasattr(error, \"model_dump\"):\n        dumped = error.model_dump()\n        data = dumped.get(\"data\") if isinstance(dumped, dict) else None\n        evidence = dumped.get(\"evidence\") if isinstance(dumped, dict) else None\n        return {\n            \"ok\": dumped.get(\"ok\"),\n            \"status\": dumped.get(\"status\"),\n            \"failureFamily\": dumped.get(\"failureFamily\"),\n            \"blocker\": dumped.get(\"blocker\"),\n            \"evidenceToolCount\": evidence.get(\"toolCount\") if isinstance(evidence, dict) else None,\n            \"dataModules\": data.get(\"modules\") if isinstance(data, dict) else None,\n            \"dataDeploymentBinding\": data.get(\"deploymentBinding\") if isinstance(data, dict) else None,\n            \"dataLedger\": data.get(\"ledger\") if isinstance(data, dict) else None,\n            \"dataFoundationLedger\": data.get(\"foundationLedger\") if isinstance(data, dict) else None,\n            \"dataAdmissions\": data.get(\"admissions\") if isinstance(data, dict) else None,\n            \"dataGlobalLedgerQuota\": data.get(\"globalLedgerQuota\") if isinstance(data, dict) else None,\n            \"dataToolOutcomeQuota\": data.get(\"toolOutcomeQuota\") if isinstance(data, dict) else None,\n            \"stateInitializedByThisCall\": data.get(\"stateInitializedByThisCall\") if isinstance(data, dict) else None,\n        }\n    detail = str(error).strip()\n    if detail:\n        text_value = re.sub(r\"[^A-Za-z0-9_.:=-]+\", \"_\", detail)[:1000]\n        if text_value:\n            return {\"message\": text_value}\n    return {\"message\": error_name}\n\ndef _safe_canary_exception_hook(error_type, error, _traceback) -> None:\n    error_name = str(getattr(error_type, \"__name__\", \"UnknownError\"))\n    if not error_name.isidentifier() or len(error_name) > 80:\n        error_name = \"UnknownError\"\n    print(\n        json.dumps(\n            {\n                \"status\": \"NEURO_DEPLOYMENT_CANARY_FAILED\",\n                \"phase\": canary_phase,\n                \"errorType\": error_name,\n                \"errorDetails\": _safe_canary_exception_details(error_name, error),\n            },\n            sort_keys=True,\n            separators=(\",\", \":\"),\n        ),\n        flush=True,\n    )\n\n\nsys.excepthook = _safe_canary_exception_hook\n\ntemporary_root = None\nworkspace_temporary_root = None\nwith tempfile.TemporaryDirectory(\n    prefix=\"sovereign-neuro-deployment-canary-\",\n    dir=\"/tmp/canary-parent\",\n) as temporary_directory:\n    temporary_root = Path(temporary_directory)\n    isolated_state = temporary_root / \"state\"\n    isolated_ranking_state = temporary_root / \"tool-ranking\"\n    os.environ[\"SOVEREIGN_NEURO_RUNTIME_STATE_ROOT\"] = str(isolated_state)\n    os.environ[\"SOVEREIGN_TOOL_RANKING_STATE_ROOT\"] = str(isolated_ranking_state)\n    # The canary explicitly commits one source event below.  Disable only the\n    # advisory outcome-to-neuro projection in this one-off process so wrapper\n    # telemetry cannot manufacture additional canonical source events.\n    os.environ[\"SOVEREIGN_NEURO_RUNTIME_TRACKING_ENABLED\"] = \"0\"\n\n    import launcher\n    import neuro_teaching_tools\n    from neuromorphic_runtime import ChangeEvent, ZERO_SHA256\n    from policy import validate_workspace_id\n\n    tracking_contract = launcher.TOOL_SUCCESS_TRACKING\n    assert tracking_contract[\"telemetryScope\"] == \"mutable-tool-outcomes-only\", tracking_contract\n    assert tracking_contract[\"readOnlyCallsPersisted\"] is False, tracking_contract\n\n    canary_phase = \"environment_binding\"\n    expected_revision = os.environ[\"SOVEREIGN_EXPECTED_CANARY_REVISION\"]\n    assert os.environ.get(\"SOVEREIGN_SOURCE_REVISION\") == expected_revision\n    policy_path = Path(neuro_teaching_tools.__file__).resolve().parent / \"config\" / \"sovereign-continuity-policy.json\"\n    embedded_policy_sha256 = hashlib.sha256(policy_path.read_bytes()).hexdigest()\n    assert os.environ.get(\"SOVEREIGN_NEURO_POLICY_SHA256\") == embedded_policy_sha256\n\n    # Invoke all five new tools through the registered FastMCP ToolManager so\n    # Pydantic arguments/results, the operating-profile gate and success\n    # tracking stay in the exercised path.  Only the expected routed target is\n    # replaced with a fail-closed guard; previews must never execute it.\n    canary_phase = \"registry_surface\"\n    tool_manager = launcher.mcp._tool_manager\n    canary_tool_names = {\n        \"neuro_event_commit\",\n        \"neuro_event_route_preview\",\n        \"neuro_runtime_contract_status\",\n        \"teaching_lesson_simulate\",\n        \"teaching_package_assess\",\n    }\n    read_only_canary_tool_names = canary_tool_names - {\"neuro_event_commit\"}\n    for canary_tool_name in canary_tool_names:\n        registered_canary_tool = tool_manager.get_tool(canary_tool_name)\n        assert registered_canary_tool is not None, canary_tool_name\n        assert registered_canary_tool.output_schema, canary_tool_name\n        assert registered_canary_tool.fn_metadata.output_model is not None, canary_tool_name\n    for read_only_canary_tool_name in read_only_canary_tool_names:\n        read_only_canary_tool = tool_manager.get_tool(read_only_canary_tool_name)\n        assert not getattr(read_only_canary_tool.fn, \"__sovereign_success_tracking__\", False)\n        assert not getattr(read_only_canary_tool.fn, \"__sovereign_operating_profile_wrapped__\", False)\n    commit_tool = tool_manager.get_tool(\"neuro_event_commit\")\n    assert getattr(commit_tool.fn, \"__sovereign_success_tracking__\", False)\n    assert getattr(commit_tool.fn, \"__sovereign_operating_profile_wrapped__\", False)\n\n    registered_tools = list(launcher.mcp._tool_manager.list_tools())\n    expected_tool_count = int(os.environ[\"SOVEREIGN_EXPECTED_MCP_TOOL_COUNT\"])\n    assert len({tool.name for tool in registered_tools}) == expected_tool_count\n\n    def call_registered(tool_name: str, arguments: dict[str, object]):\n        return asyncio.run(tool_manager.call_tool(tool_name, arguments, convert_result=False))\n\n    canary_phase = \"contract_status\"\n    empty_status = call_registered(\"neuro_runtime_contract_status\", {})\n\n    def contract_status_summary(status):\n        def safe_value(obj, key):\n            if isinstance(obj, dict):\n                return obj.get(key)\n            return getattr(obj, key, None)\n\n        evidence = safe_value(status, \"evidence\") or {}\n        data = safe_value(status, \"data\") or {}\n        return (\n            f\"ok={safe_value(status, 'ok')},\"\n            f\"status={safe_value(status, 'status')},\"\n            f\"failureFamily={safe_value(status, 'failureFamily')},\"\n            f\"toolCount={safe_value(evidence, 'toolCount')},\"\n            f\"stateInitializedByThisCall={safe_value(data, 'stateInitializedByThisCall')}\"\n        )\n\n    def require_contract_status(condition, label, status):\n        if not condition:\n            raise AssertionError(f\"contract_status.{label}:{contract_status_summary(status)}\")\n\n    require_contract_status(empty_status.ok is True, \"ok\", empty_status)\n    require_contract_status(empty_status.status == \"NEURO_RUNTIME_CONTRACT_READY\", \"status\", empty_status)\n    require_contract_status(\n        empty_status.evidence[\"toolCount\"] == expected_tool_count,\n        \"toolCount\",\n        empty_status,\n    )\n    require_contract_status(\n        empty_status.data[\"stateInitializedByThisCall\"] is False,\n        \"stateInitializedByThisCall\",\n        empty_status,\n    )\n    assert not isolated_state.exists(), \"read-only status initialized isolated state\"\n    # Continuity is advisory provenance and intentionally not required for this\n    # deployment canary. Guard every one of the 253 non-neuro tools\n    # for the remainder of the canary while leaving only the five additive\n    # Neuro/Teacher wrapper chains callable.\n    guarded_tool_calls: list[str] = []\n    guarded_tool_names: list[str] = []\n    for registered_tool in registered_tools:\n        tool_name = registered_tool.name\n        if tool_name in canary_tool_names:\n            continue\n\n        def forbidden_selected_tool_call(*_args, _tool_name=tool_name, **_kwargs):\n            guarded_tool_calls.append(_tool_name)\n            raise AssertionError(f\"canary executed guarded predecessor tool: {_tool_name}\")\n\n        registered_tool.fn = forbidden_selected_tool_call\n        guarded_tool_names.append(tool_name)\n    assert len(set(guarded_tool_names)) == expected_tool_count - 5, len(set(guarded_tool_names))\n\n    now = datetime.now(timezone.utc)\n    now = now.replace(microsecond=(now.microsecond // 1000) * 1000)\n    event = ChangeEvent.create(\n        event_id=\"event.neuro-deployment-canary\",\n        system_id=\"sovereign-studio-ato\",\n        revision_sha=expected_revision,\n        policy_sha256=embedded_policy_sha256,\n        lane=\"deterministic-verification\",\n        tick=0,\n        sequence=0,\n        event_time=now,\n        delta_ms=0,\n        kind=\"runtime.change\",\n        source=\"runtime.deployment-canary\",\n        entity=\"mcp.registry\",\n        field=\"tool-surface\",\n        old_hash=ZERO_SHA256,\n        new_hash=\"1\" * 64,\n        magnitude=1,\n        previous_evidence_sha256=ZERO_SHA256,\n        causal_parent_sha256=ZERO_SHA256,\n        producer_identity=\"sovereign.deployment-canary\",\n        canonical=True,\n        payload={\"units\": 1, \"max_units\": 2, \"scope\": \"mcp-runtime\"},\n    )\n    preview_arguments = {\n        \"change_event\": event.to_dict(),\n        \"request_id\": \"request.neuro-deployment-canary\",\n        \"session_id\": \"session.neuro-deployment-canary\",\n        \"mission_summary\": \"Read MCP runtime status.\",\n        \"required_capabilities\": [\"runtime\"],\n        \"allowed_effects\": [\"read\"],\n        \"relevance_threshold\": 1,\n        \"max_tools\": 3,\n    }\n\n    canary_phase = \"quarantine_preview\"\n    quarantined = call_registered(\n        \"neuro_event_route_preview\",\n        {\"foundation_event_kind\": \"unknown_canary_kind\", **preview_arguments},\n    )\n    assert quarantined.ok is False, quarantined\n    assert quarantined.status == \"NEURO_EVENT_QUARANTINED\", quarantined\n    assert quarantined.mutationPerformed is False, quarantined\n    assert quarantined.data[\"previewArtifact\"][\"proposal\"][\"selectedToolContracts\"] == [], quarantined\n    assert quarantined.data[\"previewArtifact\"][\"proposal\"][\"mayExecute\"] is False, quarantined\n    assert not isolated_state.exists(), \"quarantine initialized isolated state\"\n\n    canary_phase = \"route_preview\"\n    preview = call_registered(\n        \"neuro_event_route_preview\",\n        {\"foundation_event_kind\": \"work_request\", **preview_arguments},\n    )\n    assert preview.ok is True, preview\n    assert preview.status == \"NEURO_EVENT_CANDIDATE\", preview\n    artifact = preview.data[\"previewArtifact\"]\n    selected_contracts = artifact[\"proposal\"][\"selectedToolContracts\"]\n    assert artifact[\"route\"][\"routeComplete\"] is True, artifact\n    assert selected_contracts, artifact\n    assert [contract[\"name\"] for contract in selected_contracts] == [\"mcp_self_update_status\"], selected_contracts\n    assert all(contract[\"effect\"] == \"read\" for contract in selected_contracts), selected_contracts\n    assert artifact[\"proposal\"][\"proposalOnly\"] is True, artifact\n    assert artifact[\"proposal\"][\"mayExecute\"] is False, artifact\n    assert artifact[\"proposal\"][\"autoExecute\"] is False, artifact\n    assert artifact[\"proposal\"][\"externalEffects\"] == [], artifact\n    assert guarded_tool_calls == [], guarded_tool_calls\n\n    canary_phase = \"teaching_simulation\"\n    workspace_parent = Path(os.environ[\"SOVEREIGN_MCP_WORKSPACE_ROOT\"])\n    workspace_context = None\n    for _workspace_attempt in range(32):\n        candidate_context = tempfile.TemporaryDirectory(\n            prefix=\"neurocanary-\",\n            dir=workspace_parent,\n        )\n        try:\n            validate_workspace_id(Path(candidate_context.name).name)\n        except ValueError:\n            candidate_context.cleanup()\n            continue\n        workspace_context = candidate_context\n        break\n    assert workspace_context is not None, \"could not allocate a valid bounded workspace id\"\n    with workspace_context as workspace_temporary_directory:\n        workspace_temporary_root = Path(workspace_temporary_directory)\n        workspace_id = workspace_temporary_root.name\n        repository = workspace_temporary_root / \"repo\"\n        (repository / \".git\").mkdir(parents=True)\n        excerpt = \"Runtime inspection is read-only evidence collection.\"\n        source_path = repository / \"docs\" / \"runtime.md\"\n        source_path.parent.mkdir(parents=True)\n        source_bytes = (\n            \"# Runtime evidence\\n\\n\"\n            f\"{excerpt}\\n\"\n            \"This bounded source is used only by the deployment teaching canary.\\n\"\n        ).encode(\"utf-8\")\n        source_path.write_bytes(source_bytes)\n        source_sha256 = hashlib.sha256(source_bytes).hexdigest()\n        source_mtime_ns = source_path.stat().st_mtime_ns\n        teaching_package = {\n            \"schema_version\": \"1.0\",\n            \"package\": {\n                \"id\": \"runtime-evidence-canary\",\n                \"title\": \"Runtime evidence canary lesson\",\n                \"version\": \"1.0.0\",\n                \"created_at\": \"2026-08-14T00:00:00Z\",\n                \"language\": \"en\",\n                \"scope\": \"read-only runtime evidence\",\n                \"source_profile_ref\": \"source-local\",\n                \"limitations\": [\"no tool execution\", \"no package mutation\"],\n            },\n            \"provenance\": [\n                {\n                    \"id\": \"prov-runtime\",\n                    \"source_type\": \"files\",\n                    \"locator\": \"docs/runtime.md\",\n                    \"retrieved_at\": \"2026-08-14T00:00:00Z\",\n                    \"content_hash\": source_sha256,\n                    \"trust_level\": \"repository\",\n                    \"license_or_policy\": \"repository-owner-policy\",\n                }\n            ],\n            \"evidence\": [\n                {\n                    \"id\": \"ev-runtime\",\n                    \"provenance_ref\": \"prov-runtime\",\n                    \"locator\": \"docs/runtime.md#L3\",\n                    \"excerpt\": excerpt,\n                    \"content_hash\": hashlib.sha256(excerpt.encode(\"utf-8\")).hexdigest(),\n                    \"classification\": \"internal\",\n                }\n            ],\n            \"knowledge_units\": [\n                {\n                    \"id\": \"ku-runtime\",\n                    \"claim\": \"Inspect runtime evidence before drawing a conclusion.\",\n                    \"explanation\": \"The registered read-only contract returns bounded evidence.\",\n                    \"scope\": \"runtime inspection\",\n                    \"assumptions\": [\"live registry available\"],\n                    \"evidence_refs\": [\"ev-runtime\"],\n                    \"confidence\": \"high\",\n                }\n            ],\n            \"skills\": [\n                {\n                    \"id\": \"skill-runtime\",\n                    \"title\": \"Runtime evidence canary lesson\",\n                    \"outcome\": \"A bounded runtime evidence report.\",\n                    \"knowledge_refs\": [\"ku-runtime\"],\n                    \"preconditions\": [\"live registry is available\"],\n                    \"inputs_schema\": {\n                        \"type\": \"object\",\n                        \"properties\": {\"scope\": {\"type\": \"string\"}},\n                        \"required\": [\"scope\"],\n                        \"additionalProperties\": False,\n                    },\n                    \"steps\": [\n                        {\n                            \"id\": \"inspect\",\n                            \"action\": \"Inspect runtime health evidence\",\n                            \"why\": \"Runtime truth requires readback.\",\n                            \"tool_ref\": selected_contracts[0],\n                        }\n                    ],\n                    \"verification\": {\n                        \"success_conditions\": [\"evidence is bounded\"],\n                        \"failure_signals\": [\"registry drift\"],\n                        \"fallback\": \"stop and reassess\",\n                    },\n                    \"safety_boundaries\": [\"read-only\", \"no automatic execution\"],\n                }\n            ],\n            \"assessments\": [\n                {\n                    \"id\": \"assess-runtime\",\n                    \"skill_or_knowledge_ref\": \"skill-runtime\",\n                    \"type\": \"dry_run\",\n                    \"prompt\": \"Explain the evidence boundary.\",\n                    \"rubric\": [\"names the live contract\"],\n                }\n            ],\n            \"target_adapters\": [\n                {\n                    \"id\": \"adapter-mcp\",\n                    \"target_kind\": \"mcp\",\n                    \"format\": \"lesson\",\n                    \"mapping\": {\"skill\": \"tool\"},\n                    \"write_mode\": \"read_only\",\n                    \"approval_required\": False,\n                }\n            ],\n        }\n        package_path = repository / \"teaching\" / \"knowledge-package.json\"\n        package_path.parent.mkdir(parents=True)\n        package_bytes = json.dumps(\n            teaching_package,\n            ensure_ascii=True,\n            sort_keys=True,\n            separators=(\",\", \":\"),\n        ).encode(\"utf-8\")\n        package_path.write_bytes(package_bytes)\n        package_sha256 = hashlib.sha256(package_bytes).hexdigest()\n        package_mtime_ns = package_path.stat().st_mtime_ns\n\n        def repository_file_tree() -> dict[str, dict[str, object]]:\n            return {\n                str(path.relative_to(repository)): {\n                    \"sha256\": hashlib.sha256(path.read_bytes()).hexdigest(),\n                    \"size\": path.stat().st_size,\n                    \"mtimeNs\": path.stat().st_mtime_ns,\n                }\n                for path in sorted(repository.rglob(\"*\"))\n                if path.is_file()\n            }\n\n        repository_tree_before = repository_file_tree()\n        assert repository_tree_before[\"docs/runtime.md\"][\"sha256\"] == source_sha256\n        assert repository_tree_before[\"teaching/knowledge-package.json\"][\"sha256\"] == package_sha256\n\n        assessment = call_registered(\n            \"teaching_package_assess\",\n            {\n                \"workspace_id\": workspace_id,\n                \"relative_path\": \"teaching/knowledge-package.json\",\n                \"expected_sha256\": package_sha256,\n            },\n        )\n        assert assessment.ok is True, assessment\n        assert assessment.status == \"TEACHING_PACKAGE_ASSESSED\", assessment\n        assert assessment.mutationPerformed is False, assessment\n        assert assessment.evidence[\"packageWritten\"] is False, assessment\n        assert assessment.evidence[\"externalEffectPerformed\"] is False, assessment\