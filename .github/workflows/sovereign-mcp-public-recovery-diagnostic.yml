name: Sovereign MCP public recovery diagnostic

on:
  push:
    branches: [fix/persistent-mcp-auth-proxy-network-2026-10-01]
    paths: [.github/workflows/sovereign-mcp-public-recovery-diagnostic.yml]

permissions:
  contents: read

jobs:
  public-readback:
    name: Read public MCP and OAuth discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe fixed public endpoints without credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, re, urllib.error, urllib.parse, urllib.request
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
          def safe_url(value):
              if not isinstance(value, str): return None
              try:
                  parts = urllib.parse.urlsplit(value)
                  if parts.scheme != 'https' or parts.username or parts.password: return None
                  return urllib.parse.urlunsplit((parts.scheme, parts.netloc, parts.path, '', ''))
              except ValueError: return None
          def probe(path, payload=None):
              url = 'https://arelogic.space' + path
              request = urllib.request.Request(url, method='POST' if payload else 'GET',
                  data=json.dumps(payload).encode() if payload else None,
                  headers={'Accept': 'application/json, text/event-stream',
                           'Content-Type': 'application/json', 'MCP-Protocol-Version': '2025-06-18'})
              row = {'path': path, 'method': request.method}
              try:
                  try: response = opener.open(request, timeout=15)
                  except urllib.error.HTTPError as error: response = error
                  with response:
                      row['httpStatus'] = response.code
                      row['contentType'] = response.headers.get('Content-Type', '')
                      row['bearerChallengePresent'] = 'bearer' in response.headers.get('WWW-Authenticate', '').lower()
                      match = re.search(r'resource_metadata="([^"]+)"', response.headers.get('WWW-Authenticate', ''))
                      if match: row['resourceMetadataUrl'] = safe_url(match.group(1))
                      row['redirect'] = safe_url(response.headers.get('Location'))
                      data = response.read(1000001)
                      if len(data) > 1000000: return {**row, 'bodyTooLarge': True}
                      text = data.decode('utf-8', errors='replace')
                      if 'text/event-stream' in row['contentType']:
                          events = [line[5:].strip() for line in text.splitlines() if line.startswith('data:')]
                          text = events[-1] if events else ''
                      try: body = json.loads(text)
                      except ValueError: body = {}
                      if isinstance(body, dict):
                          for field in ('resource', 'issuer', 'authorization_endpoint', 'token_endpoint', 'registration_endpoint', 'jwks_uri'):
                              if field in body: row[field] = safe_url(body[field])
                          if isinstance(body.get('authorization_servers'), list):
                              row['authorizationServers'] = [safe_url(value) for value in body['authorization_servers'][:5]]
                          row['jsonRpcResponse'] = body.get('jsonrpc') == '2.0'
                          result = body.get('result')
                          if isinstance(result, dict):
                              server = result.get('serverInfo') or {}
                              row['operatorServerIdentified'] = server.get('name') == 'Sovereign ChatGPT Operator'
                              row['toolsCapabilityPresent'] = isinstance(result.get('capabilities'), dict) and 'tools' in result['capabilities']
                      row['aurionPageMarker'] = 'aurion' in text.lower()[:20000]
              except Exception as error:
                  row['transportErrorClass'] = type(error).__name__
              return row
          paths = ['/mcp','/.well-known/oauth-protected-resource','/.well-known/oauth-protected-resource/mcp',
                   '/.well-known/oauth-authorization-server','/.well-known/openid-configuration']
          results = [probe(path) for path in paths]
          results.append(probe('/mcp', {'jsonrpc':'2.0','id':1,'method':'initialize','params':{
              'protocolVersion':'2025-06-18','capabilities':{},
              'clientInfo':{'name':'sovereign-recovery-readback','version':'1.0'}}}))
          evidence = {'schemaVersion':'sovereign.public-mcp-recovery-diagnostic.v1',
                      'authenticated':False,'mutationPerformed':False,'secretValuesReturned':False,'responses':results}
          Path('public-mcp-readback.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n')
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Save observed public response evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-public-mcp-recovery-readback
          path: public-mcp-readback.json
          retention-days: 3

  vps-proxy-readback:
    name: Read bounded VPS proxy routing
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.SSH_USER }}
      VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.SSH_PORT || '22' }}
      SSHPASS: ${{ secrets.VPS_PASSWORD || secrets.VPS_PW || secrets.SSH_PW || secrets.SSH_PASSWORD }}
    steps:
      - name: Validate authorized target and existing SSH secret
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$VPS_HOST" = "46.202.154.25"
          test "$VPS_USER" = "root"
          test -n "$SSHPASS" || { echo "EXISTING_VPS_PASSWORD_SECRET_UNAVAILABLE"; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
      - name: Install distribution SSH password client
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq --no-install-recommends sshpass
      - name: Read routing with pinned host key and no remote writes
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          printf '%s\n' '46.202.154.25 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVZLyqUD5nlHXfk1sRA0v829TiZyxa5Bs4AS/G8eWLv' > "$RUNNER_TEMP/sovereign-recovery-known-hosts"
          sshpass -e ssh -T -p "$VPS_PORT" -o ConnectTimeout=25 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$RUNNER_TEMP/sovereign-recovery-known-hosts" -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ClearAllForwardings=yes "$VPS_USER@$VPS_HOST" '/usr/bin/python3 -' > vps-proxy-readback.json <<'PY'
          import json, os, pathlib, re, subprocess, urllib.parse
          def cmd(args):
              r = subprocess.run(args, capture_output=True, text=True, timeout=30, check=False)
              if r.returncode: return None
              return r.stdout
          def safe_url(v):
              try:
                  u=urllib.parse.urlsplit(v)
                  if u.scheme not in ("http","https") or not u.hostname or "sk-" in u.hostname: return None
                  return {"scheme":u.scheme,"host":u.hostname,"port":u.port,"path":u.path}
              except Exception: return None
          ids=(cmd(["/usr/bin/docker","ps","-q"]) or "").split()
          containers=[]
          for ident in ids[:50]:
              try: d=json.loads(cmd(["/usr/bin/docker","inspect",ident]) or "[]")[0]
              except Exception: continue
              name=d.get("Name","").lstrip("/")
              if not any(x in name.lower() for x in ("sovereign","traefik","aurion","areloria")): continue
              cfg=d.get("Config") or {}; labels=cfg.get("Labels") or {}
              row={"name":name,"status":(d.get("State") or {}).get("Status"),
                   "health":((d.get("State") or {}).get("Health") or {}).get("Status"),
                   "networks":sorted((d.get("NetworkSettings") or {}).get("Networks") or {}),
                   "revision":labels.get("org.opencontainers.image.revision"),"image":cfg.get("Image")}
              keep={}
              for k,v in labels.items():
                  if k in ("traefik.enable","traefik.docker.network") or re.fullmatch(r"traefik\.http\.routers\.[A-Za-z0-9_-]+\.(rule|priority|entrypoints|service|middlewares|tls|tls.certresolver)",k) or re.fullmatch(r"traefik\.http\.services\.[A-Za-z0-9_-]+\.loadbalancer\.server\.port",k):
                      keep[k]=v
              row["routingLabels"]=keep
              if "auth-proxy" in name:
                  urls={}
                  for item in cfg.get("Env") or []:
                      k,sep,v=item.partition("=")
                      if sep and any(x in k for x in ("MCP","OIDC","FUSIONAUTH")) and not any(x in k.upper() for x in ("SECRET","TOKEN","PASSWORD","PRIVATE","API_KEY","CLIENT_ID")):
                          u=safe_url(v)
                          if u: urls[k]=u
                  row["publicConfigurationUrls"]=urls
                  root=pathlib.Path(labels.get("com.docker.compose.project.working_dir") or "/opt/sovereign-chatgpt-tools/mcp-auth-proxy")
                  row["composeFiles"]=labels.get("com.docker.compose.project.config_files")
                  if str(root)=="/opt/sovereign-chatgpt-tools/mcp-auth-proxy" and root.is_dir():
                      row["sourceFiles"]=[p.name for p in root.iterdir() if p.is_file() and p.suffix in (".py",".yml",".yaml",".js",".json") and "env" not in p.name.lower()]
                      row["sourceGitRevision"]=cmd(["/usr/bin/git","-C",str(root),"rev-parse","HEAD"])
              containers.append(row)
          networkNames=sorted({n for c in containers for n in c["networks"]})
          networks=[]
          for name in networkNames:
              try: d=json.loads(cmd(["/usr/bin/docker","network","inspect",name]) or "[]")[0]
              except Exception: continue
              networks.append({"name":name,"internal":d.get("Internal"),"driver":d.get("Driver")})
          def docker_json(name, interpreter, source):
              try:
                  r=subprocess.run(["/usr/bin/docker","exec","-i",name,interpreter,"-"],input=source,capture_output=True,text=True,timeout=50,check=False)
                  if r.returncode: return {"ok":False,"exitCode":r.returncode,"errorOutputSha256":__import__("hashlib").sha256(r.stderr.encode()).hexdigest()}
                  for line in reversed(r.stdout.splitlines()):
                      try: return json.loads(line)
                      except ValueError: pass
                  return {"ok":False,"jsonMissing":True}
              except Exception as e: return {"ok":False,"errorClass":type(e).__name__}
          proxyName="sovereign-mcp-auth-proxy-sovereign-mcp-auth-proxy-1"
          nodeSource=r"""const paths=['/health','/mcp','/.well-known/oauth-protected-resource','/.well-known/oauth-protected-resource/mcp','/.well-known/oauth-authorization-server','/.well-known/openid-configuration'];
          function clean(v){try{let u=new URL(v);return {scheme:u.protocol,host:u.hostname,port:u.port,path:u.pathname}}catch{return null}}
          (async()=>{let rows=[];for(const path of paths){try{const r=await fetch('http://127.0.0.1:8080'+path,{redirect:'manual',signal:AbortSignal.timeout(6000)});const text=await r.text();let b={};try{b=JSON.parse(text)}catch{};let row={path,httpStatus:r.status,contentType:r.headers.get('content-type')};const m=(r.headers.get('www-authenticate')||'').match(/resource_metadata="([^"]+)"/);if(m)row.resourceMetadata=clean(m[1]);for(const k of ['resource','issuer','authorization_endpoint','token_endpoint','registration_endpoint','jwks_uri'])if(b[k])row[k]=clean(b[k]);if(Array.isArray(b.authorization_servers))row.authorizationServers=b.authorization_servers.map(clean);rows.push(row)}catch(e){rows.push({path,errorClass:e.name})}}console.log(JSON.stringify({responses:rows,cwd:process.cwd()}))})()"""
          proxyProbe=docker_json(proxyName,"node",nodeSource)
          sourceRoot=pathlib.Path("/opt/sovereign-chatgpt-tools/mcp-auth-proxy")
          sourceRoutes=[]
          if sourceRoot.is_dir():
              for p in sourceRoot.rglob("*"):
                  if not p.is_file() or p.suffix not in (".ts",".js",".mjs") or any(x in p.parts for x in ("node_modules",".git")): continue
                  if len(p.relative_to(sourceRoot).parts)>4 or p.stat().st_size>300000: continue
                  t=p.read_text(errors="replace")
                  routes=sorted(set(re.findall(r"""['"]((?:/\.well-known|/oauth|/mcp|/health|/authorize|/token|/register|/callback)[A-Za-z0-9_./-]*)['"]""",t)))
                  if routes: sourceRoutes.append({"file":str(p.relative_to(sourceRoot)),"sha256":__import__("hashlib").sha256(t.encode()).hexdigest(),"routeLiterals":routes})
          mcpSource=r"""import asyncio,json
          import launcher,server
          tools=asyncio.run(launcher.mcp.list_tools());names={t.name for t in tools}
          required={"agent_zero_backend_diagnostics","agent_zero_a2a_canary","backend_architecture_assess","deterministic_architecture_inventory","mcp_tool_contract_registry","neuro_event_commit","neuro_event_route_preview","neuro_runtime_contract_status","operational_assurance_skill_inventory","patchmon_tool_inventory","repository_architecture_drift_report","repository_architecture_snapshot","aurion_account_role_readback","aurion_account_role_plan","aurion_account_role_apply","teaching_lesson_simulate","teaching_package_assess","wolfram_source_intelligence"}
          registry=server._live_mcp_registry_evidence()
          resources=asyncio.run(launcher.mcp.list_resources())
          widget=next((r for r in resources if str(r.uri)=="ui://sovereign/dev_dashboard.v2.html"),None)
          meta=widget.model_dump(by_alias=True).get("_meta",{}) if widget else {}
          print(json.dumps({"toolCount":len(names),"missingInstallerRequiredTools":sorted(required-names),"registryVerified":registry.get("registry_runtime_verified"),"registryToolCount":registry.get("registry_tool_count"),"widgetPresent":widget is not None,"widgetDomain":(meta.get("ui") or {}).get("domain"),"openaiWidgetDomain":meta.get("openai/widgetDomain")},sort_keys=True))
          """
          mcpContract=docker_json("sovereign-chatgpt-mcp","python",mcpSource)
          candidateArgs=["/usr/bin/docker","run","--rm","-i","--pull=never","--network=none","--read-only","--cap-drop=ALL","--security-opt=no-new-privileges","--pids-limit=128","--memory=768m","--cpus=0.5","--tmpfs","/tmp:rw,noexec,nosuid,size=32m","--env","SOVEREIGN_MCP_PRIVATE_OWNER_MODE=1","--env","SOVEREIGN_MCP_ENABLE_AURION_OPERATOR=1","--env","SOVEREIGN_MCP_ENABLE_AURION_WRITE=1","--env","SOVEREIGN_MCP_ENABLE_AURION_ADMIN_MCP=1","--env","AURION_ADMIN_MCP_SCOPES=aurion.admin.read","--env","AURION_ADMIN_MCP_WOLFRAM_ENABLED=0","--env","SOVEREIGN_MCP_GITHUB_APP_ID=","--env","SOVEREIGN_MCP_GITHUB_APP_INSTALLATION_ID=","--env","SOVEREIGN_MCP_GITHUB_APP_PRIVATE_KEY_FILE=","--env","SOVEREIGN_MCP_WORKSPACE_ROOT=/tmp/workspaces","--env","SOVEREIGN_TOOL_RANKING_STATE_ROOT=/tmp/tool-ranking","--env","SOVEREIGN_NEURO_RUNTIME_STATE_ROOT=/tmp/neuro-runtime","--env","SOVEREIGN_NEURO_RUNTIME_TRACKING_ENABLED=0","--entrypoint","/opt/venv/bin/python","ghcr.io/ouroboroscollective/sovereign-chatgpt-mcp@sha256:748fc7eeb3db83e5998265a9c0616c0848d5a1c07425e05f47d3eefc356d1a4c","-"]
          wrapped="try:\n"+"\n".join("    "+line for line in mcpSource.splitlines())+"\nexcept BaseException as e:\n    import traceback,json\n    print(json.dumps({'ok':False,'errorClass':type(e).__name__,'locations':[{'file':f.filename.rsplit('/',1)[-1],'line':f.lineno,'function':f.name} for f in traceback.extract_tb(e.__traceback__)[-8:]]}))\n"
          candidateContract={"ok":False}
          try:
              inspected=subprocess.run(candidateArgs,input=wrapped,capture_output=True,text=True,timeout=100,check=False)
              candidateContract={"exitCode":inspected.returncode,"productionEnvFilesUsed":False,"volumesMounted":False,"networkEnabled":False}
              for line in reversed(inspected.stdout.splitlines()):
                  try: candidateContract.update(json.loads(line)); break
                  except ValueError: pass
              if not candidateContract.get("toolCount") and "errorClass" not in candidateContract: candidateContract["outputSha256"]=__import__("hashlib").sha256((inspected.stdout+inspected.stderr).encode()).hexdigest()
          except Exception as e: candidateContract={"ok":False,"errorClass":type(e).__name__}
          print(json.dumps({"schemaVersion":"sovereign.proxy-routing-readback.v2","mutationPerformed":False,"secretValuesReturned":False,
                            "containers":containers,"networks":networks,"composeVersion":cmd(["/usr/bin/docker","compose","version","--short"]),
                            "proxyProbe":proxyProbe,"sourceRoutes":sourceRoutes,"mcpContract":mcpContract,"candidateContract":candidateContract,"inspectionContainerCreated":True},sort_keys=True))
          PY
          python3 -m json.tool vps-proxy-readback.json
      - name: Save bounded routing evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sovereign-vps-proxy-routing-readback
          path: vps-proxy-readback.json
          retention-days: 3
