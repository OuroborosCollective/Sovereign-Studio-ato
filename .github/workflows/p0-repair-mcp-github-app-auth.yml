name: P0 Repair MCP GitHub App Auth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p0-repair-mcp-github-app-auth.yml

permissions:
  contents: write

concurrency:
  group: p0-mcp-github-app-auth-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || secrets.SSH_USER }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD || secrets.VPS_PW || secrets.SSH_PW || secrets.SSH_PASSWORD }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || secrets.SSH_PORT || '22' }}
    steps:
      - name: Validate rescue inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VPS_HOST:-}"
          test -n "${VPS_USER:-}"
          test -n "${VPS_PASSWORD:-}"
          [[ "${VPS_SSH_PORT}" =~ ^[0-9]+$ ]]

      - name: Repair MCP GitHub App binding and prove authenticated clone
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          SUDO_PASSWORD: ${{ env.VPS_PASSWORD }}
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          password: ${{ env.VPS_PASSWORD }}
          port: ${{ env.VPS_SSH_PORT }}
          command_timeout: 25m
          envs: SUDO_PASSWORD
          script: |
            set -Euo pipefail

            stage() {
              printf 'SOVEREIGN_AUTH_RESCUE_STAGE:%s\n' "$1"
            }
            die() {
              printf 'SOVEREIGN_AUTH_RESCUE_FAILED:%s\n' "$1" >&2
              exit 1
            }
            run_root() {
              if [ "$(id -u)" -eq 0 ]; then
                "$@"
                return
              fi
              if sudo -n true >/dev/null 2>&1; then
                sudo -n "$@"
                return
              fi
              test -n "${SUDO_PASSWORD:-}" || die sudo_password_unavailable
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
            }
            read_env_value() {
              local file="$1"
              local key="$2"
              run_root sed -n "s/^${key}=//p" "$file" 2>/dev/null | tail -n 1
            }

            stage ssh_connected
            run_root docker inspect sovereign-chatgpt-mcp >/dev/null 2>&1 || die mcp_container_missing
            stage mcp_container_present

            MCP_IMAGE_ID="$(run_root docker inspect sovereign-chatgpt-mcp --format '{{.Image}}')" || die mcp_image_id_read_failed
            test -n "$MCP_IMAGE_ID" || die mcp_image_id_empty
            MCP_IMAGE_REF="$(run_root docker inspect sovereign-chatgpt-mcp --format '{{.Config.Image}}')" || die mcp_image_ref_read_failed
            test -n "$MCP_IMAGE_REF" || die mcp_image_ref_empty
            MCP_REVISION="$(run_root docker image inspect "$MCP_IMAGE_ID" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" || die mcp_revision_read_failed
            [[ "$MCP_REVISION" =~ ^[0-9a-f]{40}$ ]] || die mcp_revision_invalid
            printf 'SOVEREIGN_AUTH_RESCUE_REVISION:%s\n' "$MCP_REVISION"

            if [[ "$MCP_IMAGE_REF" =~ @sha256:([0-9a-f]{64})$ ]]; then
              MCP_DIGEST="sha256:${BASH_REMATCH[1]}"
            else
              MCP_REPODIGEST="$(run_root docker image inspect "$MCP_IMAGE_ID" --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep '^ghcr.io/ouroboroscollective/sovereign-chatgpt-mcp@sha256:' | head -n 1)" || die mcp_repodigest_read_failed
              [[ "$MCP_REPODIGEST" =~ @sha256:([0-9a-f]{64})$ ]] || die mcp_repodigest_invalid
              MCP_DIGEST="sha256:${BASH_REMATCH[1]}"
            fi
            printf 'SOVEREIGN_AUTH_RESCUE_DIGEST:%s\n' "$MCP_DIGEST"

            BACKEND_ENV=/opt/sovereign-chatgpt-tools/backend-runtime.env
            test -f "$BACKEND_ENV" || die backend_runtime_env_missing
            test ! -L "$BACKEND_ENV" || die backend_runtime_env_symlink
            stage backend_runtime_env_present

            APP_ID="$(read_env_value "$BACKEND_ENV" GITHUB_APP_ID)"
            if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]]; then
              stage resolving_backend_github_app_id
              APP_ID="$(run_root docker inspect sovereign-backend --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^GITHUB_APP_ID=//p' | tail -n 1 || true)"
            fi
            if [[ ! "$APP_ID" =~ ^[1-9][0-9]*$ ]]; then
              for candidate in /opt/sovereign-chatgpt-tools/.env /opt/sovereign-chatgpt-tools/runtime.env; do
                if run_root test -f "$candidate"; then
                  APP_ID="$(read_env_value "$candidate" GITHUB_APP_ID)"
                  [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]] && break
                fi
              done
            fi
            [[ "$APP_ID" =~ ^[1-9][0-9]*$ ]] || die backend_github_app_id_unrecoverable
            printf 'SOVEREIGN_AUTH_RESCUE_APP_ID:%s\n' "$APP_ID"

            if ! run_root grep -q '^GITHUB_APP_ID=[1-9][0-9]*$' "$BACKEND_ENV"; then
              stage restoring_backend_github_app_id
              BACKEND_ATTRS="$(run_root lsattr -d -- "$BACKEND_ENV" 2>/dev/null | awk '{print $1}' || true)"
              BACKEND_CLEAR_I=0
              BACKEND_CLEAR_A=0
              if [[ "$BACKEND_ATTRS" == *i* ]]; then
                run_root chattr -i -- "$BACKEND_ENV" || die backend_env_immutable_clear_failed
                BACKEND_CLEAR_I=1
              fi
              if [[ "$BACKEND_ATTRS" == *a* ]]; then
                run_root chattr -a -- "$BACKEND_ENV" || die backend_env_append_only_clear_failed
                BACKEND_CLEAR_A=1
              fi
              if run_root grep -q '^GITHUB_APP_ID=' "$BACKEND_ENV"; then
                run_root sed -i "s/^GITHUB_APP_ID=.*/GITHUB_APP_ID=${APP_ID}/" "$BACKEND_ENV" || die backend_github_app_id_write_failed
              else
                run_root sh -c 'printf "%s\n" "$1" >> "$2"' _ "GITHUB_APP_ID=${APP_ID}" "$BACKEND_ENV" || die backend_github_app_id_write_failed
              fi
              [[ "$BACKEND_CLEAR_A" != 1 ]] || run_root chattr +a -- "$BACKEND_ENV" || die backend_env_append_only_restore_failed
              [[ "$BACKEND_CLEAR_I" != 1 ]] || run_root chattr +i -- "$BACKEND_ENV" || die backend_env_immutable_restore_failed
            fi
            run_root grep -q '^GITHUB_APP_ID=[1-9][0-9]*$' "$BACKEND_ENV" || die backend_github_app_id_missing_after_restore
            stage backend_github_app_id_present

            run_root grep -q '^GITHUB_APP_PRIVATE_KEY=.' "$BACKEND_ENV" || die backend_github_app_private_key_missing
            stage backend_github_app_private_key_present

            TMP_ROOT="$(mktemp -d /tmp/sovereign-mcp-auth-repair.XXXXXX)" || die temp_root_create_failed
            trap 'rm -rf "$TMP_ROOT"' EXIT
            git clone --quiet --filter=blob:none --no-checkout https://github.com/OuroborosCollective/Sovereign-Studio-ato.git "$TMP_ROOT/repo" || die public_clone_failed
            stage public_clone_ok
            git -C "$TMP_ROOT/repo" fetch --quiet --depth 1 origin "$MCP_REVISION" || die exact_revision_fetch_failed
            git -C "$TMP_ROOT/repo" checkout --quiet --detach "$MCP_REVISION" || die exact_revision_checkout_failed
            test "$(git -C "$TMP_ROOT/repo" rev-parse HEAD)" = "$MCP_REVISION" || die exact_revision_mismatch
            stage exact_running_revision_source_ready

            run_root env \
              SOVEREIGN_MCP_EXPECTED_REVISION="$MCP_REVISION" \
              SOVEREIGN_MCP_EXPECTED_DIGEST="$MCP_DIGEST" \
              bash "$TMP_ROOT/repo/tools/sovereign-chatgpt-mcp/deploy/install-on-vps.sh" \
              || die canonical_installer_failed
            stage canonical_installer_completed

            MOUNT_RW="$(run_root docker inspect sovereign-chatgpt-mcp --format '{{range .Mounts}}{{if eq .Destination "/run/secrets/sovereign-github-app-private-key.pem"}}{{.RW}}{{end}}{{end}}')" || die app_key_mount_read_failed
            test "$MOUNT_RW" = 'false' || die app_key_mount_not_read_only
            stage app_key_mount_read_only

            if ! run_root docker exec -i sovereign-chatgpt-mcp python - <<'PY'
            import json
            import os
            import re
            import shutil
            import subprocess

            from runtime import OperatorRuntime, RuntimeConfig

            if os.getenv('GITHUB_TOKEN', '').strip():
                raise SystemExit('persistent_github_token_present')

            config = RuntimeConfig.from_env()
            if config.github_app is None:
                raise SystemExit('github_app_config_missing_after_repair')
            if config.github_app.installation_id != 153170343:
                raise SystemExit('unexpected_github_app_installation_id')
            if str(config.github_app.private_key_file) != '/run/secrets/sovereign-github-app-private-key.pem':
                raise SystemExit('unexpected_github_app_key_mount_path')

            runtime = OperatorRuntime(config)
            metadata = runtime.prepare_workspace(base_branch='main', task_slug='github-app-auth-canary')
            workspace_id = metadata['workspace_id']
            try:
                repo = runtime._repo(workspace_id)
                head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=repo, text=True).strip()
                if not re.fullmatch(r'[0-9a-f]{40}', head):
                    raise SystemExit('authenticated_clone_invalid_head')
                print(json.dumps({
                    'status': 'MCP_GITHUB_APP_AUTH_VERIFIED',
                    'workspacePrepared': True,
                    'cloneHead': head,
                    'installationId': config.github_app.installation_id,
                    'persistentGithubTokenPresent': False,
                    'secretValuesReturned': False,
                }, sort_keys=True, separators=(',', ':')))
            finally:
                shutil.rmtree(runtime._workspace(workspace_id), ignore_errors=True)
            PY
            then
              die authenticated_workspace_canary_failed
            fi
            stage authenticated_workspace_canary_ok

            HEALTH="$(run_root docker inspect sovereign-chatgpt-mcp --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}')" || die health_read_failed
            test "$HEALTH" = 'healthy' || die mcp_not_healthy_after_repair
            stage mcp_healthy_after_repair

      - name: Remove completed rescue workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Commit rescue completion
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          rm .github/workflows/p0-repair-mcp-github-app-auth.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/workflows/p0-repair-mcp-github-app-auth.yml
          git commit -m 'chore: remove completed MCP GitHub App auth rescue workflow'
          git push origin HEAD:main
