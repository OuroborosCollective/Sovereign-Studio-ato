name: Legacy Cloudflare Worker AI Proxy Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-cloudflare-worker-ai-proxy-disabled
  cancel-in-progress: true

jobs:
  explain:
    name: Explain canonical LLM routing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report canonical routing contract
        shell: bash
        run: |
          cat <<'EOF'
          This legacy Cloudflare Worker AI proxy is permanently disabled.
          Online model traffic must use:
          App -> Sovereign Backend -> direct OpenRouter Paid or direct FreeLLM Free -> owner-verified provider.
          No Worker deployment, Cloudflare AI secret, or public worker chat route is permitted here.
          EOF
