name: Boundary Ledger Drift

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/runtime/**'
      - 'src/features/product/runtime/**'
      - 'backend/agent_runtime/**'
      - 'scripts/sovereign-backend/agent_runtime/**'
      - 'tools/sovereign-chatgpt-mcp/**'
      - 'config/architecture/llm-tool-boundary-review-ledger.json'
      - 'scripts/reconcile_llm_boundary_ledger.py'
      - '.github/workflows/boundary-ledger-drift.yml'
  push:
    branches: [main]
    paths:
      - 'src/runtime/**'
      - 'src/features/product/runtime/**'
      - 'backend/agent_runtime/**'
      - 'scripts/sovereign-backend/agent_runtime/**'
      - 'tools/sovereign-chatgpt-mcp/**'
      - 'config/architecture/llm-tool-boundary-review-ledger.json'
      - 'scripts/reconcile_llm_boundary_ledger.py'
      - '.github/workflows/boundary-ledger-drift.yml'
  workflow_call:
    inputs:
      apply_safe_patch:
        description: Apply only a fully deterministic reconciliation on the current non-protected branch
        required: false
        default: false
        type: boolean
      expected_head_sha:
        description: Exact branch head required when applying a patch
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      apply_safe_patch:
        description: Commit a safe reconciliation to the selected PR branch without force-push
        required: false
        default: false
        type: boolean
      expected_head_sha:
        description: Exact current PR-branch head; required when apply_safe_patch is true
        required: false
        default: ''
        type: string

concurrency:
  group: boundary-ledger-drift-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Candidate discovery and ledger comparison
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    outputs:
      exit_code: ${{ steps.reconcile.outputs.exit_code }}
      source_revision: ${{ steps.reconcile.outputs.source_revision }}
      only_new_structured: ${{ steps.reconcile.outputs.only_new_structured }}
      safe_to_apply: ${{ steps.reconcile.outputs.safe_to_apply }}
      owner_decision_count: ${{ steps.reconcile.outputs.owner_decision_count }}
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Discover candidates and compare the review ledger
        id: reconcile
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          mkdir -p .sovereign-evidence
          python scripts/reconcile_llm_boundary_ledger.py \
            --expected-head "${SOURCE_REVISION}" \
            --report .sovereign-evidence/boundary-ledger-drift.json
          status=$?
          read -r only_new_structured safe_to_apply owner_decision_count <<EOF
          $(python - <<'PY'
          import json
          report = json.load(open('.sovereign-evidence/boundary-ledger-drift.json', encoding='utf-8'))
          print(
              str(bool(report.get('onlyNewStructuredCandidates'))).lower(),
              str(bool(report.get('safeToApply'))).lower(),
              len(report.get('ownerDecisionCandidateIds') or []),
          )
          PY
          )
          EOF
          printf 'exit_code=%s\n' "${status}" >> "${GITHUB_OUTPUT}"
          printf 'source_revision=%s\n' "${SOURCE_REVISION}" >> "${GITHUB_OUTPUT}"
          printf 'only_new_structured=%s\n' "${only_new_structured}" >> "${GITHUB_OUTPUT}"
          printf 'safe_to_apply=%s\n' "${safe_to_apply}" >> "${GITHUB_OUTPUT}"
          printf 'owner_decision_count=%s\n' "${owner_decision_count}" >> "${GITHUB_OUTPUT}"
          {
            echo '## Boundary ledger drift'
            echo
            echo "Exact source revision: \`${SOURCE_REVISION}\`"
            echo "Reconciliation exit code: \`${status}\`"
            echo "Safe deterministic reconciliation: \`${safe_to_apply}\`"
            echo "Owner decisions required: \`${owner_decision_count}\`"
            echo
            echo 'The attached artifact contains bounded candidate IDs, hashes, classifications, and owner-decision flags.'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit 0

      - name: Upload bounded drift evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-ledger-drift-${{ github.run_id }}
          path: .sovereign-evidence/boundary-ledger-drift.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail closed when reconciliation is not safely automatable
        if: >-
          steps.reconcile.outputs.exit_code != '0' &&
          !(
            steps.reconcile.outputs.safe_to_apply == 'true' &&
            steps.reconcile.outputs.owner_decision_count == '0' &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          ) &&
          inputs.apply_safe_patch != true
        env:
          RECONCILE_EXIT: ${{ steps.reconcile.outputs.exit_code }}
        run: |
          echo "Boundary ledger reconciliation requires review (exit ${RECONCILE_EXIT})." >&2
          exit 1

      - name: Reject an ineligible requested patch
        if: >-
          inputs.apply_safe_patch == true &&
          steps.reconcile.outputs.exit_code != '0' &&
          (
            steps.reconcile.outputs.safe_to_apply != 'true' ||
            steps.reconcile.outputs.owner_decision_count != '0'
          )
        run: |
          echo 'Requested automatic reconciliation is not proven safe or still requires an owner decision.' >&2
          exit 1

  apply-safe-patch:
    name: Apply deterministic same-branch patch
    needs: analyze
    if: >-
      needs.analyze.outputs.exit_code != '0' &&
      needs.analyze.outputs.safe_to_apply == 'true' &&
      needs.analyze.outputs.owner_decision_count == '0' &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        inputs.apply_safe_patch == true
      )
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout exact selected branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.analyze.outputs.source_revision }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup verified backend Python runtime
        uses: ./.github/actions/setup-backend-python
        with:
          python-version: '3.11'

      - name: Verify non-protected exact branch identity
        shell: bash
        env:
          REQUESTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          SOURCE_REVISION: ${{ needs.analyze.outputs.source_revision }}
        run: |
          set -euo pipefail
          expected_head="${REQUESTED_HEAD_SHA:-${SOURCE_REVISION}}"
          [[ "${expected_head}" =~ ^[0-9a-f]{40}$ ]]
          test "${expected_head}" = "${SOURCE_REVISION}"
          test "$(git rev-parse HEAD)" = "${expected_head}"
          [[ "${TARGET_REF}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]
          [[ "${TARGET_REF}" != *".."* ]]
          test "${TARGET_REF}" != main
          test "${TARGET_REF}" != master

      - name: Reconcile and validate exact bindings
        shell: bash
        env:
          SOURCE_REVISION: ${{ needs.analyze.outputs.source_revision }}
        run: |
          set -euo pipefail
          mkdir -p .sovereign-evidence
          python scripts/reconcile_llm_boundary_ledger.py \
            --expected-head "${SOURCE_REVISION}" \
            --write \
            --report .sovereign-evidence/boundary-ledger-reconciled.json
          python scripts/verify_llm_boundary_ledger.py
          python -m pytest tools/sovereign-chatgpt-mcp/tests/test_llm_boundary_ledger.py -q
          git diff --check
          test "$(git diff --name-only)" = 'config/architecture/llm-tool-boundary-review-ledger.json'

      - name: Commit and push without force
        shell: bash
        env:
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add config/architecture/llm-tool-boundary-review-ledger.json
          git commit -m 'chore(ci): reconcile revision-bound boundary ledger'
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:${TARGET_REF}"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
          test "${remote_head}" = "${new_head}"
          printf 'Updated exact PR branch head: %s\n' "${new_head}"

      - name: Upload reconciliation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boundary-ledger-reconciled-${{ github.run_id }}
          path: .sovereign-evidence/boundary-ledger-reconciled.json
          if-no-files-found: error
          retention-days: 7
