name: Sovereign E2E Smoke

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'android/**'
      - 'tests/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'capacitor.config.*'
      - '.github/workflows/e2e-testing.yml'
  workflow_dispatch:
    inputs:
      live_five_path:
        description: 'Run five real first-user paths through verified Draft PR creation'
        required: true
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  PNPM_VERSION: 9.12.2
  CI: 'true'
  VITE_ADMIN_API_BASE: https://sovereign-backend.arelorian.de

concurrency:
  group: sovereign-e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: Current App E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build web and sync Android handoff
        shell: bash
        run: pnpm run build

      - name: Install Playwright browsers
        shell: bash
        run: pnpm exec playwright install chromium

      - name: Run artifact smoke gate
        shell: bash
        run: pnpm run test:artifact-smoke

      - name: Run Playwright smoke gate
        shell: bash
        run: pnpm run test:e2e

      - name: Write E2E smoke summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Sovereign E2E Smoke"
            echo ""
            echo "- Scope: current Android-first web/Capacitor app"
            echo "- Artifact Gate: pnpm run test:artifact-smoke (validates build handoff)"
            echo "- Browser Gate: pnpm run test:e2e (Playwright smoke tests)"
            echo "- Legacy RN path retired: sovereign-studio-rn/** is no longer required"
          } >> "$GITHUB_STEP_SUMMARY"

  live-five-path-draft-pr:
    name: Deployed UI Agent Zero no-publication testfile smoke
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/sovereign-live-five-owner' &&
      github.actor == github.repository_owner &&
      contains(github.event.head_commit.message, '[sovereign-live-five]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SOVEREIGN_E2E_LIVE: '0'
      SOVEREIGN_E2E_REVISION: ${{ github.sha }}
      SOVEREIGN_E2E_RUNTIME_REVISION: ec969a858d6c26046450b25323a1f3d9468a9549
      SOVEREIGN_E2E_BACKEND_DIGEST: sha256:2615c491b2e1e3ba7ba64d14735060bd6589adbb2abc82240d792e2b860919c6
      SOVEREIGN_E2E_REPO_URL: https://github.com/${{ github.repository }}
      SOVEREIGN_E2E_APP_URL: https://chat.arelorian.de
      SOVEREIGN_E2E_BACKEND_PROXY_TARGET: https://sovereign-backend.arelorian.de
      VITE_SOVEREIGN_AGENT_API_URL: https://sovereign-backend.arelorian.de
      VITE_ADMIN_API_BASE: https://sovereign-backend.arelorian.de

    steps:
      - name: Checkout exact verification-harness revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOVEREIGN_E2E_REVISION }}
          fetch-depth: 1

      - name: Bind verification harness to exact deployed runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$SOVEREIGN_E2E_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOVEREIGN_E2E_RUNTIME_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOVEREIGN_E2E_BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOVEREIGN_E2E_REVISION" ]

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build verification branch without deployment
        shell: bash
        run: pnpm run build:web

      - name: Install Chromium
        shell: bash
        run: pnpm exec playwright install chromium --with-deps

      - name: Run deployed UI Agent Zero testfile smoke
        shell: bash
        run: |
          rm -f test-results/agent-zero-no-publication-evidence.json
          pnpm exec playwright test tests/e2e/agent-zero-no-publication-smoke.spec.ts --project=chromium --workers=1 --reporter=line

      - name: Upload Agent Zero no-publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-zero-no-publication-evidence-${{ github.run_id }}
          path: test-results/agent-zero-no-publication-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Write verification summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Deployed UI → Agent Zero no-publication smoke"
            echo ""
            echo "- Product runtime revision: $SOVEREIGN_E2E_RUNTIME_REVISION"
            echo "- Product backend digest: $SOVEREIGN_E2E_BACKEND_DIGEST"
            echo "- Deployed UI: $SOVEREIGN_E2E_APP_URL"
            echo "- Canonical backend: $SOVEREIGN_E2E_BACKEND_PROXY_TARGET"
            echo "- Repository effect: one empty uncommitted root testfile only"
            echo "- GitHub publication: forbidden / not invoked"
            echo "- Verification branch only; no product deployment from this workflow"
            echo "- Evidence: agent-zero-no-publication-evidence-${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
