name: Open PR Conflict Modernize One-Shot

on:
  push:
    branches:
      - sovereign/chatgpt/open-pr-consolidation-runner-20260911
    paths:
      - .github/workflows/open-pr-conflict-modernize-one-shot.yml

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: sovereign/chatgpt/open-pr-consolidation-20260911
      HELPER_BRANCH: sovereign/chatgpt/open-pr-consolidation-runner-20260911
    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 1

      - name: Checkout helper script separately
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HELPER_BRANCH }}
          path: .helper
          fetch-depth: 1

      - name: Apply exact modernizations
        shell: bash
        run: |
          set -euo pipefail
          python3 .helper/.github/scripts/open_pr_conflict_modernize.py
          rm -rf .helper
          git diff --check
          git status --short

      - name: Commit and push only modernized source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ouroboros PR Consolidator'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            src/features/product/runtime/patternMemoryRuntime.ts \
            src/mobile-workflow-pattern-rules.ts \
            src/features/product/runtime/patternMemoryContainerRuntime.ts \
            src/features/product/runtime/patternMemoryContainerRuntime.test.ts \
            src/features/product/runtime/brownfieldExplorer.ts \
            src/features/product/runtime/sovereignTelemetry.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'chore(consolidation): modernize five stale PR changes'
          git push origin "HEAD:$TARGET_BRANCH"
