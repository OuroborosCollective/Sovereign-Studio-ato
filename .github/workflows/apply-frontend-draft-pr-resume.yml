name: Apply frontend Draft PR resume patch

on:
  push:
    branches:
      - sovereign/chatgpt/frontend-draft-pr-end-to-end-fix
    paths:
      - scripts/patches/pending/frontend-draft-pr-runtime-resume.json
      - .github/workflows/apply-frontend-draft-pr-resume.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply exact frontend patch and open/update Draft PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_FULL_NAME: ${{ github.repository }}
          BASE_BRANCH: main
          PATCH_BRANCH: sovereign/chatgpt/frontend-draft-pr-end-to-end-fix
          DRY_RUN: 'false'
        run: python3 scripts/patches/search_replace_runner.py scripts/patches/pending/frontend-draft-pr-runtime-resume.json
