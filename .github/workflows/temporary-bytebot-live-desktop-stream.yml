name: Temporary Bytebot Live Desktop Stream

on:
  push:
    branches:
      - sovereign/chatgpt/bytebot-live-desktop-stream
    paths:
      - scripts/patches/apply_bytebot_live_desktop_stream.py
      - scripts/patches/fix_bytebot_live_desktop_frontend.py
      - .github/workflows/temporary-bytebot-live-desktop-stream.yml

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/bytebot-live-desktop-stream
          fetch-depth: 0
      - name: Apply live desktop stream patch
        run: |
          python3 scripts/patches/apply_bytebot_live_desktop_stream.py
          python3 scripts/patches/fix_bytebot_live_desktop_frontend.py
      - name: Install test and frontend dependencies
        run: |
          python3 -m pip install --user pytest
          corepack enable
          pnpm install --no-frozen-lockfile
      - name: Verify desktop Python contracts
        env:
          PYTHONPATH: backend
        run: python3 -m pytest backend/tests/test_desktop_stream.py backend/tests/test_desktop_worker.py backend/tests/test_desktop_activation.py -q
      - name: Verify MCP desktop worker contracts
        run: python3 -m pytest tools/sovereign-chatgpt-mcp/tests/test_desktop_worker.py -q
      - name: Verify frontend type check
        id: frontend_typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm run type-check 2>&1 | tee frontend-typecheck.log
      - name: Preserve frontend type-check failure
        if: failure() && steps.frontend_typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bytebot-frontend-typecheck-${{ github.sha }}
          path: frontend-typecheck.log
          if-no-files-found: error
          retention-days: 1
      - name: Verify frontend monitor contracts
        id: frontend_vitest
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run src/features/product/containers/BuilderContainer.test.tsx src/appShellContract.test.ts 2>&1 | tee frontend-vitest.log
      - name: Preserve frontend monitor-test failure
        if: failure() && steps.frontend_vitest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bytebot-frontend-vitest-${{ github.sha }}
          path: frontend-vitest.log
          if-no-files-found: error
          retention-days: 1
      - name: Verify no PNG polling remains primary
        run: |
          ! grep -q "getDesktopFrame(jobId)" src/App.tsx
          grep -q "getDesktopStreamTicket(jobId)" src/App.tsx
          grep -q "LIVE RFB STREAM" src/features/product/components/LiveWorkspaceMonitor.tsx
          grep -q "viewOnly" src/features/product/components/LiveWorkspaceMonitor.tsx
      - name: Publish tested branch state
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          git config user.name "Sovereign Owner Recovery"
          git config user.email "actions@users.noreply.github.com"
          git add backend/agent_runtime/desktop_stream.py scripts/sovereign-backend/agent_runtime/desktop_stream.py scripts/sovereign-backend/agent_runtime/routes.py backend/agent_runtime/routes.py src/App.tsx src/features/product/runtime/sovereignAgentClient.ts src/features/product/components/LiveWorkspaceMonitor.tsx src/features/product/components/AgentEventStream.tsx src/features/product/containers/BuilderContainer.tsx package.json pnpm-lock.yaml
          git diff --cached --check
          git commit -m "feat(desktop): replace PNG polling with live RFB stream"
          git push origin HEAD:sovereign/chatgpt/bytebot-live-desktop-stream
