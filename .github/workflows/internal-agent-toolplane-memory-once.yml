name: Internal Agent Toolplane Memory One-Shot

on:
  push:
    branches:
      - sovereign/chatgpt/internal-agent-toolplane-20260911

permissions:
  contents: write

jobs:
  append:
    if: contains(github.event.head_commit.message, '[append-toolplane-memory]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/internal-agent-toolplane-20260911
          fetch-depth: 0
      - name: Append exactly one integration-memory entry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Memory.md')
          text = path.read_text('utf-8')
          title = '### 2026-09-11 — Internal Agent Job toolplane decoupled from external MCP broker'
          if title in text:
              raise SystemExit('Memory entry already exists; refusing duplicate append')
          entry = '''\n\n### 2026-09-11 — Internal Agent Job toolplane decoupled from external MCP broker\nStatus: VERIFIED source/regression; production live proof pending\nTask: Remove the external ChatGPT MCP/broker as a prerequisite for normal backend Agent Job repository reads, writes, diffs and tests.\nDecisions: Internal repository tools bind evidence to the executing backend revision/image plus the target workspace Git base as separate identities; ChatGPT MCP identity remains only for true external MCP/operator effects; historical v1 MCP receipts remain append-only while new internal calls use `sovereign.agent-execution-receipt.v1`.\nTouched surfaces: Agent run receipts, repository tool execution, run-store receipt persistence, live-workspace receipt projection, migration 062 and the Required Agent Backend test lane; canonical/deployment mirrors remain paired.\nEvidence: Deployed baseline `64bbf428c5646b922cad0e9499c5de3b5457fd0a`; Five Real UI Paths run `34542861497` reached FreeLLM single-agent repository execution but failed three pre-tool attempts with zero persisted tool rows; PR #1912 head before this append `c1da1ae313a23e7bc921e2887f8b9524aa82d23c`; Agent Backend run `34548069921` passed with 1269 tests + 1 skipped including five new internal-toolplane identity regressions; Release Verification `34548069971` passed Runtime Units, Typecheck, Web/Android, Artifact Smoke, Playwright and Integration Gate.\nLearned: A backend Agent Job already owns an isolated workspace and must not call the hardened external ChatGPT MCP merely to prove its own file/Git/test execution; repository provenance, backend runtime provenance and external MCP provenance are distinct trust boundaries.\nOpen: Merge/deploy the exact reviewed revision, apply/read back migration 062, prove backend runtime/image equality, then rerun Five Real UI Paths and require 5/5 independently verified Draft PRs.\nNext safe step: Re-run exact-head gates after this append; merge only with explicit Owner authorization, then immutable deploy + PatchMon/runtime readback + protected Five-Path proof.\n'''
          path.write_text(text.rstrip('\n') + entry, 'utf-8')
          PY
          git diff --check
          test "$(grep -Fxc '### 2026-09-11 — Internal Agent Job toolplane decoupled from external MCP broker' Memory.md)" -eq 1
          git rm .github/workflows/internal-agent-toolplane-memory-once.yml
          git config user.name "Ouroboros Memory Recorder"
          git config user.email "actions@users.noreply.github.com"
          git add Memory.md
          git commit -m "docs(memory): record internal agent toolplane integration"
          git push origin HEAD:sovereign/chatgpt/internal-agent-toolplane-20260911
