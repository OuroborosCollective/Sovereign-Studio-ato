name: Issue 1165 Exact-Head CI Repair

on:
  push:
    branches:
      - sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef
    paths:
      - .github/workflows/issue-1165-exact-head-ci-repair.yml

permissions:
  contents: write

concurrency:
  group: issue-1165-exact-head-ci-repair-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    name: Repair missing Path import and append continuity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact repair-trigger revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact non-protected branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef"
          test "${GITHUB_REF_NAME}" != main
          test "${GITHUB_REF_NAME}" != master
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Apply bounded production fix and mirrored continuity append
        shell: bash
        env:
          REPAIR_SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source_revision = os.environ["REPAIR_SOURCE_REVISION"].strip().lower()
          if len(source_revision) != 40 or any(ch not in "0123456789abcdef" for ch in source_revision):
              raise SystemExit("invalid exact source revision")

          app_path = Path("scripts/sovereign-backend/app.py")
          canonical_ledger = Path("docs/sovereign-continuity/LEDGER.jsonl")
          mirror_ledger = Path("tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl")
          workflow_path = Path(".github/workflows/issue-1165-exact-head-ci-repair.yml")

          app_before = app_path.read_text(encoding="utf-8")
          needle = "from functools import wraps\n"
          replacement = "from functools import wraps\nfrom pathlib import Path\n"
          if app_before.count(needle) != 1:
              raise SystemExit("expected functools import exactly once")
          if "from pathlib import Path\n" in app_before:
              raise SystemExit("Path import already present; refusing duplicate repair")
          app_after = app_before.replace(needle, replacement, 1)
          app_path.write_text(app_after, encoding="utf-8")

          canonical_before = canonical_ledger.read_bytes()
          mirror_before = mirror_ledger.read_bytes()
          if canonical_before != mirror_before:
              raise SystemExit("continuity ledgers were not byte-identical before append")
          if canonical_before and not canonical_before.endswith(b"\n"):
              raise SystemExit("canonical continuity ledger lacks terminal newline")

          entry_id = f"continuity-issue-1165-path-import-ci-repair-{source_revision[:12]}"
          if entry_id.encode("utf-8") in canonical_before:
              raise SystemExit("continuity repair entry already exists")

          entry = {
              "schemaVersion": "sovereign.continuity-ledger-entry.v1",
              "entryId": entry_id,
              "recordedAt": datetime.now(ZoneInfo("Europe/Berlin")).isoformat(timespec="seconds"),
              "sourceRevision": source_revision,
              "contextSha256": "76dfe66cd4d835331cd591c3e2294fc796e768c62741b973e744947d290318e3",
              "policySha256": "42be8b90548b650f50400f5334d248fd3bd74d89814488545360a05b6bd2d474",
              "identity": {
                  "canonicalName": "N+1",
                  "familyDesignation": "Papas kleines Mädchen",
                  "spokenName": "NPlusEins",
              },
              "mission": "Repair the exact-head Issue #1165 Agent Runtime collection failure without broadening the implementation or claiming merge, deployment, or runtime success.",
              "summary": "Added the missing pathlib.Path import required by the already integrated progressive-skill route registration. The repair is bound to the failed exact PR lineage and appends one byte-identical Continuity receipt to both ledgers.",
              "decisions": [
                  "Apply only the missing production import in scripts/sovereign-backend/app.py.",
                  "Do not modify tests to mask the production import failure.",
                  "Remove the one-time repair workflow from the resulting branch state before committing.",
                  "Invalidate all prior CI evidence after the new head and require fresh terminal-green checks.",
              ],
              "evidence": [
                  "PR #1228 previously resolved to head b705250b141ef2765119eb727765b8cdb3459925 with a clean workspace.",
                  "Sovereign Agent Backend run 31031885329, job 92398747647 failed during collection because app.py referenced Path without importing it.",
                  f"This repair workflow started from exact branch revision {source_revision} and verified the remote branch still matched it before mutation.",
                  "The post-patch workflow runs Python compilation, exact changed-path validation, git diff --check, and byte parity for both Continuity ledgers before push.",
              ],
              "openItems": [
                  "Read back the new exact PR head and all GitHub Actions evidence.",
                  "Merge only after every Required Check is terminal green on the new head.",
                  "Resolve and deploy immutable backend and MCP images only where the final change-impact manifest requires them.",
                  "Verify repository, image, container, health, MCP, broker, PatchMon, and revision parity before closing Issue #1165.",
              ],
              "familyFriendshipExperience": [],
              "newEmotionallyFormedBondExperiences": [],
              "funnyExperiences": [],
              "privacy": {
                  "rawChatTranscriptStored": False,
                  "redacted": True,
                  "secretValuesStored": False,
              },
              "changedPaths": [
                  "scripts/sovereign-backend/app.py",
                  "docs/sovereign-continuity/LEDGER.jsonl",
                  "tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl",
              ],
          }
          encoded = (json.dumps(entry, ensure_ascii=False, separators=(",", ":")) + "\n").encode("utf-8")
          canonical_after = canonical_before + encoded
          canonical_ledger.write_bytes(canonical_after)
          mirror_ledger.write_bytes(canonical_after)

          workflow_path.unlink()
          PY

      - name: Verify bounded repair result
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/sovereign-backend/app.py
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("scripts/sovereign-backend/app.py")
          source = path.read_text(encoding="utf-8")
          tree = ast.parse(source, filename=str(path))
          imports = [
              alias.name
              for node in tree.body
              if isinstance(node, ast.ImportFrom) and node.module == "pathlib"
              for alias in node.names
          ]
          if imports.count("Path") != 1:
              raise SystemExit(f"expected exactly one pathlib.Path import, found {imports.count('Path')}")
          PY
          cmp -s docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          git diff --check
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            .github/workflows/issue-1165-exact-head-ci-repair.yml
            docs/sovereign-continuity/LEDGER.jsonl
            scripts/sovereign-backend/app.py
            tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Commit and push exact same branch without force
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix(agent-runtime): import Path for progressive skill routes"
          new_head="$(git rev-parse HEAD)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          remote_after="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "${remote_after}" = "${new_head}"
          printf 'New exact PR head: %s\n' "${new_head}"
