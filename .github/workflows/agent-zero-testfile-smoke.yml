name: Agent Zero Testfile Smoke

on:
  push:
    branches:
      - sovereign/chatgpt/agent-zero-testfile-smoke
    paths:
      - 'tests/e2e/agent-zero-testfile-smoke.spec.ts'
      - '.github/workflows/agent-zero-testfile-smoke.yml'

permissions:
  contents: read

concurrency:
  group: agent-zero-testfile-smoke
  cancel-in-progress: true

jobs:
  single-frontend-assignment:
    name: One Sovereign UI assignment to Agent Zero
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_VERSION: 22
      PNPM_VERSION: 9.12.2
      CI: true
      SOVEREIGN_E2E_LIVE: '1'
      SOVEREIGN_E2E_REVISION: 9e9782f858c53c4bcd2fdd109789a39be1379f72
      SOVEREIGN_E2E_ACCOUNT_KEY: ${{ secrets.SOVEREIGN_E2E_ACCOUNT_KEY }}
      SOVEREIGN_E2E_REPO_URL: https://github.com/${{ github.repository }}
      SOVEREIGN_E2E_APP_URL: https://127.0.0.1:3000
      SOVEREIGN_E2E_BACKEND_PROXY_TARGET: https://sovereign-backend.arelorian.de
      VITE_SOVEREIGN_AGENT_API_URL: https://127.0.0.1:3000
      VITE_ADMIN_API_BASE: https://127.0.0.1:3000

    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Confirm deployed backend source revision
        run: |
          set -Eeuo pipefail
          [[ "$SOVEREIGN_E2E_REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Prepare isolated HTTPS preview trust
        run: bash scripts/prepare-live-e2e-tls.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend test dependencies
        run: pnpm install --frozen-lockfile

      - name: Build current Sovereign frontend
        run: pnpm run build:web

      - name: Install Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run exactly one frontend assignment
        run: |
          set -Eeuo pipefail
          rm -f test-results/agent-zero-testfile-smoke.json test-results/live-safe-reporter.json
          pnpm exec playwright test tests/e2e/agent-zero-testfile-smoke.spec.ts \
            --project=chromium \
            --workers=1 \
            --reporter=./tests/e2e/helpers/live-safe-reporter.ts

      - name: Verify bounded UI-to-Agent-Zero evidence
        if: always()
        run: |
          set -Eeuo pipefail
          if [ ! -f test-results/agent-zero-testfile-smoke.json ]; then
            echo 'agent-zero-testfile-smoke evidence missing' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json

          evidence = json.loads(Path('test-results/agent-zero-testfile-smoke.json').read_text('utf-8'))
          assert evidence['schemaVersion'] == 'sovereign.agent-zero-testfile-smoke.v1'
          assert evidence['sourceRevision'] == '9e9782f858c53c4bcd2fdd109789a39be1379f72'
          assert evidence['frontendSubmissionVerified'] is True
          assert evidence['singleAgentModeVerified'] is True
          assert evidence['draftPrCreated'] is False
          assert evidence['fileReadback']['path'] == 'testfile'
          assert evidence['fileReadback']['bytes'] == 0
          assert evidence['fileReadback']['contentEmpty'] is True
          assert evidence['gitStatus']['changedFiles'] == ['testfile']
          assert evidence['sovereignWorkspaceReadbackVerified'] is True
          assert evidence['secretValuesReturned'] is False
          PY

      - name: Upload bounded smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-zero-testfile-ui-smoke-${{ github.run_id }}
          path: |
            test-results/agent-zero-testfile-smoke.json
            test-results/live-safe-reporter.json
          if-no-files-found: warn
          retention-days: 7
