name: Sovereign Continuity Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact open same-repository pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact current PR head revision
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: sovereign-continuity-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  continuity:
    name: continuity-ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact PR revisions
        id: revisions
        uses: actions/github-script@v7
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          INPUT_EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha || '' }}
        with:
          script: |
            let pull = context.payload.pull_request;
            if (context.eventName === 'workflow_dispatch') {
              const numberText = String(process.env.INPUT_PR_NUMBER || '').trim();
              const expectedHead = String(process.env.INPUT_EXPECTED_HEAD_SHA || '').trim().toLowerCase();
              if (!/^[1-9][0-9]*$/.test(numberText)) {
                core.setFailed('PR_NUMBER_INVALID');
                return;
              }
              if (!/^[0-9a-f]{40}$/.test(expectedHead)) {
                core.setFailed('EXPECTED_HEAD_SHA_INVALID');
                return;
              }
              pull = (await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: Number(numberText),
              })).data;
              if (String(pull.head?.sha || '').toLowerCase() !== expectedHead) {
                core.setFailed('PR_HEAD_IDENTITY_MISMATCH');
                return;
              }
            }
            const repositoryFullName = `${context.repo.owner}/${context.repo.repo}`;
            const headSha = String(pull?.head?.sha || '').toLowerCase();
            const baseSha = String(pull?.base?.sha || '').toLowerCase();
            if (pull?.state !== 'open' || pull?.base?.ref !== 'main') {
              core.setFailed('OPEN_MAIN_PR_REQUIRED');
              return;
            }
            if (pull?.head?.repo?.full_name !== repositoryFullName) {
              core.setFailed('SAME_REPOSITORY_PR_REQUIRED');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(headSha) || !/^[0-9a-f]{40}$/.test(baseSha)) {
              core.setFailed('PR_REVISION_INVALID');
              return;
            }
            const headRef = String(pull?.head?.ref || '');
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/.test(headRef) || headRef.includes('..')) {
              core.setFailed('PR_HEAD_REF_INVALID');
              return;
            }
            core.setOutput('head_sha', headSha);
            core.setOutput('base_sha', baseSha);
            core.setOutput('head_ref', headRef);
            core.setOutput('pr_number', String(pull.number));

      - name: Checkout exact PR revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.revisions.outputs.head_sha }}

      - name: Fetch and verify exact PR base revision
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags origin "$BASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          [[ "$MERGE_BASE" =~ ^[0-9a-f]{40}$ ]]

      - name: Validate read and append-only completion contract
        shell: bash
        env:
          BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
          SOVEREIGN_CONTINUITY_STDLIB_ONLY: '1'
        run: |
          set -euo pipefail
          python3 tools/sovereign-chatgpt-mcp/validate_continuity.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Reconcile exact-head workflow evidence
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.revisions.outputs.head_sha }}
          HEAD_REF: ${{ steps.revisions.outputs.head_ref }}
          PR_NUMBER: ${{ steps.revisions.outputs.pr_number }}
        with:
          script: |
            const headSha = String(process.env.HEAD_SHA || '').trim().toLowerCase();
            const headRef = String(process.env.HEAD_REF || '').trim();
            const prNumberText = String(process.env.PR_NUMBER || '').trim();
            if (!/^[0-9a-f]{40}$/.test(headSha)) {
              core.setFailed('HEAD_SHA_INVALID');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/.test(headRef) || headRef.includes('..')) {
              core.setFailed('HEAD_REF_INVALID');
              return;
            }
            if (!/^[1-9][0-9]*$/.test(prNumberText)) {
              core.setFailed('PR_NUMBER_INVALID');
              return;
            }
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            const successful = new Set(['success', 'neutral', 'skipped']);
            const supersedable = new Set(['failure', 'cancelled', 'timed_out', 'action_required', 'stale']);
            const requiredBeforeGuardian = new Set(['Release Gate', 'Agent Runtime Tests']);

            const listGroups = async () => {
              const runs = await github.paginate(
                github.rest.checks.listForRef,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: headSha,
                  per_page: 100,
                  filter: 'all',
                },
                (page) => page.data.check_runs,
              );
              const groups = new Map();
              for (const check of runs) {
                const name = String(check.name || '').trim();
                if (!name || name === 'continuity-ledger' || name === 'Reconcile superseded checks') continue;
                if (!groups.has(name)) groups.set(name, []);
                groups.get(name).push(check);
              }
              for (const checks of groups.values()) {
                checks.sort((left, right) => Number(right.id || 0) - Number(left.id || 0));
              }
              return groups;
            };

            let prerequisiteGroups = new Map();
            for (let attempt = 0; attempt < 60; attempt += 1) {
              prerequisiteGroups = await listGroups();
              const unresolved = [...requiredBeforeGuardian].filter((name) => {
                const latest = prerequisiteGroups.get(name)?.[0];
                return !latest || latest.status !== 'completed' || !successful.has(String(latest.conclusion || ''));
              });
              if (!unresolved.length) break;
              if (attempt === 59) {
                core.setFailed(`REQUIRED_CHECKS_NOT_SUCCESSFUL: ${unresolved.join(', ')}`);
                return;
              }
              await sleep(10000);
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'revision-guardian.yml',
              ref: headRef,
              inputs: {
                expected_revision: headSha,
                target_ref: headRef,
                pr_number: prNumberText,
                repair: 'false',
              },
            });

            let finalGroups = new Map();
            for (let attempt = 0; attempt < 60; attempt += 1) {
              finalGroups = await listGroups();
              const guardian = finalGroups.get('Revision Guardian')?.[0];
              const orchestrator = finalGroups.get('Revision Guardian Orchestrator')?.[0];
              const guardianReady = guardian && guardian.status === 'completed' && successful.has(String(guardian.conclusion || ''));
              const orchestratorReady = orchestrator && orchestrator.status === 'completed' && successful.has(String(orchestrator.conclusion || ''));
              if (guardianReady && orchestratorReady) break;
              if (attempt === 59) {
                core.setFailed('REVISION_GUARDIAN_DID_NOT_REACH_SUCCESS');
                return;
              }
              await sleep(10000);
            }

            const neutralized = [];
            const unresolvedCurrent = [];
            for (const [name, checks] of finalGroups.entries()) {
              const latest = checks[0];
              const latestConclusion = String(latest?.conclusion || '');
              if (!latest || latest.status !== 'completed' || !successful.has(latestConclusion)) {
                unresolvedCurrent.push(`${name}:${latest?.status || 'missing'}:${latestConclusion || 'none'}`);
                continue;
              }
              for (const older of checks.slice(1)) {
                const olderConclusion = String(older.conclusion || '');
                if (older.status !== 'completed' || !supersedable.has(olderConclusion)) continue;
                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: Number(older.id),
                  status: 'completed',
                  conclusion: 'neutral',
                  output: {
                    title: 'Superseded by newer successful exact-head evidence',
                    summary: [
                      `Head: ${headSha}`,
                      `Check: ${name}`,
                      `Superseded check run: ${older.id}`,
                      `Newer successful check run: ${latest.id}`,
                      'Only an older attempt on the identical head was neutralized; the latest result remained unchanged.',
                    ].join('\n'),
                  },
                });
                neutralized.push(`${name}:${older.id}->${latest.id}`);
              }
            }
            if (unresolvedCurrent.length) {
              core.setFailed(`CURRENT_CHECK_FAILURES_REMAIN: ${unresolvedCurrent.join(', ')}`);
              return;
            }
            core.info(`Neutralized ${neutralized.length} superseded exact-head check attempts.`);
