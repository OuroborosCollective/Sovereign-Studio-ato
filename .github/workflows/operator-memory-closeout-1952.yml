name: Operator Memory closeout 1952

on:
  push:
    branches:
      - sovereign/chatgpt/five-timeout-alignment-20260914

permissions:
  contents: write

jobs:
  append-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Guard reviewed head ancestry
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 133aa5047c12fbcf02f97812288bea8acd927cb8 HEAD
      - name: Append exactly one integration memory entry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Memory.md')
          text = p.read_text('utf-8')
          marker = '### 2026-09-14 — Five-Path timeout hierarchy aligned (#1952)'
          if marker in text:
              raise SystemExit('memory entry already exists')
          entry = '''\n\n### 2026-09-14 — Five-Path timeout hierarchy aligned (#1952)\nStatus: CI_VERIFIED; live 5/5 proof still pending.\nTask: Correct the protected Five-Path harness after the post-deploy run on `656e029...` was killed by Playwright at ~300 s even though repository readiness was allowed 600 s.\nDecisions: Keep product/A2A runtime unchanged; set each live path budget to repository-ready timeout plus 300 s and extend the serial workflow budget to 90 minutes.\nTouched surfaces: `tests/e2e/five-draft-pr-paths.spec.ts`, `.github/workflows/e2e-testing.yml`.\nEvidence: Base `656e02911322004736ad0f16b2c49272fe2b7e76`; code head `133aa5047c12fbcf02f97812288bea8acd927cb8`; failed live run `34869905753` timed out at 300324 ms; Agent Backend `34871533422`, Release Verification `34871533338`, Integration Plan `34871533345`, Continuity `34871533398` all succeeded; Wolfram budget check confirmed 600 s inner wait < 900 s per-test bound and 90 min workflow leaves 15 min slack across five maximum paths.\nLearned: A bounded inner wait is ineffective when the enclosing test has a shorter timeout; timeout hierarchy must be monotonic from operation to test to workflow.\nOpen: This does not prove the Agent Zero corridor green; the protected 5/5 live run must be repeated after merge on exact deployed revision.\nNext safe step: Re-run exact-head gates on this Memory-appended head, merge only if green, then perform exact-revision rollout/readback and the protected 5/5 Draft-PR proof.\n'''
          p.write_text(text.rstrip() + entry, 'utf-8')
          PY
          test "$(grep -c '### 2026-09-14 — Five-Path timeout hierarchy aligned (#1952)' Memory.md)" -eq 1
          git diff --check
      - name: Commit memory closeout
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Memory.md
          git diff --cached --check
          git commit -m 'docs(memory): record five-path timeout alignment'
          git push origin HEAD:"$GITHUB_REF_NAME"
