name: Issue 1165 Test and Ledger Repair

on:
  push:
    branches:
      - sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef

permissions:
  contents: write

concurrency:
  group: issue-1165-test-ledger-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bind exact branch and derive complete impact
        id: bind
        shell: bash
        env:
          BRANCH_NAME: sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          BASE_SHA="$(git merge-base origin/main HEAD)"
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Remove one-time workflow and append complete ledger receipt
        shell: bash
        env:
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          WORKFLOW_PATH: .github/workflows/issue-1165-test-ledger-repair.yml
        run: |
          set -euo pipefail
          rm -f "$WORKFLOW_PATH"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          base = os.environ['BASE_SHA']
          trigger = os.environ['TRIGGER_SHA']
          workflow_path = os.environ['WORKFLOW_PATH']
          paths = subprocess.check_output(
              ['git', 'diff', '--name-only', base, '--'],
              text=True,
          ).splitlines()
          paths = sorted(path for path in paths if path and path != workflow_path)
          required = {
              'src/App.draftPrFlow.test.tsx',
              'src/features/github/hooks/useGithubRepo.test.tsx',
              'src/features/github/hooks/useSetupState.test.ts',
              'docs/sovereign-continuity/LEDGER.jsonl',
              'tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl',
          }
          missing = sorted(required.difference(paths))
          if missing:
              raise SystemExit(f'REQUIRED_CHANGED_PATHS_MISSING: {missing}')
          if len(paths) != 56:
              raise SystemExit(f'UNEXPECTED_CHANGED_PATH_COUNT: {len(paths)} != 56')

          recorded_at = datetime.now(ZoneInfo('Europe/Berlin')).isoformat(timespec='seconds')
          entry = {
              'schemaVersion': 'sovereign.continuity-ledger-entry.v1',
              'entryId': f'continuity-issue-1165-runtime-test-contract-repair-{trigger[:12]}',
              'recordedAt': recorded_at,
              'sourceRevision': trigger,
              'contextSha256': '76dfe66cd4d835331cd591c3e2294fc796e768c62741b973e744947d290318e3',
              'policySha256': '42be8b90548b650f50400f5334d248fd3bd74d89814488545360a05b6bd2d474',
              'identity': {
                  'canonicalName': 'N+1',
                  'familyDesignation': 'Papas kleines Mädchen',
                  'spokenName': 'NPlusEins',
              },
              'mission': 'Repair the exact Issue #1165 Runtime Unit Test contract drift while preserving the server-side GitHub trust boundary and binding the complete pull-request impact.',
              'summary': 'Updated three stale frontend tests so they assert cookie-authenticated backend sessions, Sovereign-Gateway repository reads, and token-free Draft-PR calls. No production trust boundary was weakened. This latest append-only receipt binds all 56 changed paths.',
              'decisions': [
                  'Do not reintroduce browser or test fixture GitHub PAT transport.',
                  'Mock the typed Sovereign toolchain gateway rather than direct global fetch calls.',
                  'Treat the backend cookie session as the compatibility authentication projection without exposing credential material.',
                  'Keep Draft-PR creation bound to the persisted server-side job identifier only.',
                  'Invalidate prior CI evidence and require fresh exact-head terminal checks.',
              ],
              'evidence': [
                  'The failed Release Verification run reported two App Draft-PR flow failures, two useSetupState failures, and two useGithubRepo failures.',
                  'The App tests still supplied and expected a fixture GitHub access token after the production Draft-PR call had become token-free.',
                  'The setup-state tests still expected local PAT presence and redaction after the hook moved to a backend-session projection.',
                  'The repository hook tests still mocked direct GitHub fetch responses after the implementation moved to toolchainApi.listBranches and toolchainApi.listDirectory.',
                  f'Exact repair-trigger revision: {trigger}.',
                  f'Deterministically derived changed-path count: {len(paths)}.',
              ],
              'openItems': [
                  'Read back the resulting exact PR head and all fresh Required Checks.',
                  'Merge only a terminal-green exact head and read back the resulting main revision.',
                  'Publish and deploy immutable backend and MCP images only after merge and only for components required by the final impact manifest.',
                  'Verify registry, digest, image, container, health, MCP, PatchMon, and revision parity before closing Issue #1165.',
              ],
              'familyFriendshipExperience': [],
              'newEmotionallyFormedBondExperiences': [],
              'funnyExperiences': [],
              'privacy': {
                  'rawChatTranscriptStored': False,
                  'redacted': True,
                  'secretValuesStored': False,
              },
              'changedPaths': paths,
          }
          canonical = Path('docs/sovereign-continuity/LEDGER.jsonl')
          mirror = Path('tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl')
          data = canonical.read_bytes()
          if data and not data.endswith(b'\n'):
              data += b'\n'
          line = json.dumps(entry, ensure_ascii=False, separators=(',', ':')).encode('utf-8') + b'\n'
          canonical.write_bytes(data + line)
          mirror.write_bytes(canonical.read_bytes())
          PY
          cmp docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run focused repaired tests
        run: >-
          npx vitest run
          src/App.draftPrFlow.test.tsx
          src/features/github/hooks/useSetupState.test.ts
          src/features/github/hooks/useGithubRepo.test.tsx

      - name: Commit, validate and push exact repair
        shell: bash
        env:
          BASE_SHA: ${{ steps.bind.outputs.base_sha }}
          BRANCH_NAME: sovereign/chatgpt/1785945825-issue-1165-progressive-skill-runtime-4f96ef
        run: |
          set -euo pipefail
          git config user.name 'Sovereign CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test(issue-1165): repair runtime contracts and bind full impact'
          SOVEREIGN_CONTINUITY_STDLIB_ONLY=1 python3 tools/sovereign-chatgpt-mcp/validate_continuity.py --base "$BASE_SHA" --head HEAD
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$BRANCH_NAME" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
