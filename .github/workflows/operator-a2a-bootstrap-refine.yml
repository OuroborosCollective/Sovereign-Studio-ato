name: Operator A2A Bootstrap Refine

on:
  push:
    branches:
      - sovereign/chatgpt/a2a-server-reconcile-20260914

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact branch head
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "a9ee6660bdc44a8113eb9cbc8fb8655d212f19d8"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/operator-a2a-bootstrap-refine.yml"

      - name: Move reconciler startup into production bootstrap
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text('utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}')
              p.write_text(text.replace(old, new), 'utf-8')

          app = 'scripts/sovereign-backend/app.py'
          replace_exact(
              app,
              'from agent_runtime.repository_execution import start_repository_reconciler\n',
              '',
          )
          replace_exact(
              app,
              '''    desktop_frame_allowed=lambda context: DesktopControlGatewayV1.from_env().frame_allowed(context=context),\n    get_session_github_token=_session_github_token_for_user,\n)\nstart_repository_reconciler(\n    get_connection=get_agent_runtime_connection,\n    workspace_root=(\n        Path(os.environ["SOVEREIGN_AGENT_WORKSPACE_ROOT"])\n        if os.getenv("SOVEREIGN_AGENT_WORKSPACE_ROOT", "").strip()\n        else None\n    ),\n)\n''',
              '''    desktop_frame_allowed=lambda context: DesktopControlGatewayV1.from_env().frame_allowed(context=context),\n    get_session_github_token=_session_github_token_for_user,\n)\n''',
          )

          production = Path('scripts/sovereign-backend/production_app.py')
          text = production.read_text('utf-8')
          old = '''from app import app\n\n# Production bootstrap intentionally registers no OmniRoute services. The live\n# LLM truth path is OpenRouter + owner-managed FreeLLMAPI through Sovereign's\n# resolver/revolver contracts.\n\n__all__ = ["app"]\n'''
          new = '''import os\nfrom pathlib import Path\n\nfrom app import app, get_agent_runtime_connection\nfrom agent_runtime.repository_execution import start_repository_reconciler\n\n# Production bootstrap intentionally registers no OmniRoute services. The live\n# LLM truth path is OpenRouter + owner-managed FreeLLMAPI through Sovereign's\n# resolver/revolver contracts.\n#\n# Repository A2A reconciliation is production runtime ownership, not request\n# ownership. Gunicorn does not use --preload, so each worker starts one bounded\n# scanner; persisted external_ref CAS remains the exclusive effect boundary.\nstart_repository_reconciler(\n    get_connection=get_agent_runtime_connection,\n    workspace_root=(\n        Path(os.environ["SOVEREIGN_AGENT_WORKSPACE_ROOT"])\n        if os.getenv("SOVEREIGN_AGENT_WORKSPACE_ROOT", "").strip()\n        else None\n    ),\n)\n\n__all__ = ["app"]\n'''
          if text.count(old) != 1:
              raise SystemExit('production_app.py exact bootstrap block did not match once')
          production.write_text(text.replace(old, new), 'utf-8')
          PY

      - name: Static verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile scripts/sovereign-backend/app.py scripts/sovereign-backend/production_app.py
          git diff --check

      - name: Commit refinement and remove operator patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/operator-a2a-bootstrap-refine.yml
          git add scripts/sovereign-backend/app.py scripts/sovereign-backend/production_app.py
          git commit -m "fix(agent-runtime): start reconciler in production bootstrap"
          git push origin HEAD:sovereign/chatgpt/a2a-server-reconcile-20260914
