name: Temporary Current Docs Continuity Append

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/tmp-current-docs-continuity.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  append-mirrored-ledgers:
    if: github.head_ref == 'docs/current-truth-2026-08-03'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/current-truth-2026-08-03
          fetch-depth: 1
      - name: Validate and append canonical ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_FULL_NAME: ${{ github.repository }}
          BASE_BRANCH: main
          DRY_RUN: "false"
        run: python3 scripts/patches/search_replace_runner.py scripts/patches/pending/current-docs-continuity-canonical.json
      - name: Validate and append mirrored ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_FULL_NAME: ${{ github.repository }}
          BASE_BRANCH: main
          DRY_RUN: "false"
        run: python3 scripts/patches/search_replace_runner.py scripts/patches/pending/current-docs-continuity-mirror.json
