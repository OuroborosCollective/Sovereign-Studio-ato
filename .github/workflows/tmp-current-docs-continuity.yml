name: Temporary Current Docs Continuity Append

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/tmp-current-docs-continuity.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  append-mirrored-ledgers:
    if: github.head_ref == 'docs/current-truth-2026-08-03'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/current-truth-2026-08-03
          fetch-depth: 1
      - name: Append one validated entry to both byte-identical ledgers
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(Path('scripts/patches/pending/current-docs-continuity-canonical.json').read_text(encoding='utf-8'))
          replacement = request['blocks'][0]['replace']
          entry_line = replacement.rsplit('\n', 1)[1]
          entry = json.loads(entry_line)
          if entry.get('entryId') != 'continuity-current-documentation-reconciliation-20260803':
              raise SystemExit('unexpected continuity entry identity')

          paths = [
              Path('docs/sovereign-continuity/LEDGER.jsonl'),
              Path('tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl'),
          ]
          before = [path.read_bytes() for path in paths]
          if before[0] != before[1]:
              raise SystemExit('continuity ledgers differ before append')
          if entry['entryId'].encode('utf-8') in before[0]:
              raise SystemExit('continuity entry already exists')

          payload = before[0]
          if not payload.endswith(b'\n'):
              payload += b'\n'
          payload += entry_line.encode('utf-8') + b'\n'
          for path in paths:
              path.write_bytes(payload)
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('continuity ledgers differ after append')
          PY
          git diff --check
          cmp docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
      - name: Commit append-only mirrored ledgers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          git commit -m 'docs(continuity): bind current documentation reconciliation'
          git push origin HEAD:docs/current-truth-2026-08-03
