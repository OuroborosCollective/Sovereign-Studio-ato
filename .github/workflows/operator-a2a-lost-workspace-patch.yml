name: Operator A2A Lost Workspace Patch
on:
  push:
    branches: [sovereign/chatgpt/a2a-lost-task-workspace-recovery-20260915]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/a2a-lost-task-workspace-recovery-20260915
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup verified backend Python runtime
        uses: ./.github/actions/setup-backend-python
        with:
          python-version: '3.11'
      - name: Guard and apply effect-safe lost-task repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD origin/main)" = "5a682f8407536d6f7ccbc0b6908a9d04e8fdd434"
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              p.write_text(text.replace(old, new, 1), 'utf-8')

          runtime_paths = [
              'backend/agent_runtime/repository_execution.py',
              'scripts/sovereign-backend/agent_runtime/repository_execution.py',
          ]
          a2a_paths = [
              'backend/agent_runtime/agent_zero_a2a.py',
              'scripts/sovereign-backend/agent_runtime/agent_zero_a2a.py',
          ]

          for path in runtime_paths:
              replace_once(
                  path,
                  '_MAX_CLOSEOUT_CHANGED_FILES: Final[int] = 50\n',
                  '_MAX_CLOSEOUT_CHANGED_FILES: Final[int] = 50\n'
                  '_A2A_LOST_EVENT_STAGE: Final[str] = "agent_zero_a2a_task_readback_lost"\n'
                  '_A2A_LOST_WORKSPACE_EVENT_STAGE: Final[str] = "agent_zero_a2a_task_lost_workspace_observed"\n'
                  '_A2A_LOST_WORKSPACE_HASH_RE: Final[re.Pattern[str]] = re.compile(r"\\bsha256:([0-9a-f]{64})\\b")\n',
              )
              replace_once(
                  path,
                  'def _repository_stall_seconds() -> float:\n'
                  '    return _bounded_env_seconds("SOVEREIGN_REPOSITORY_STALL_SECONDS", 1800.0, 300.0, 86400.0)\n\n\n',
                  'def _repository_stall_seconds() -> float:\n'
                  '    return _bounded_env_seconds("SOVEREIGN_REPOSITORY_STALL_SECONDS", 1800.0, 300.0, 86400.0)\n\n\n'
                  'def _lost_workspace_stable_seconds() -> float:\n'
                  '    return _bounded_env_seconds("SOVEREIGN_A2A_LOST_WORKSPACE_STABLE_SECONDS", 5.0, 2.0, 60.0)\n\n\n'
                  'def _latest_event(job: StoredSovereignAgentJob, stage: str) -> dict[str, Any] | None:\n'
                  '    for event in reversed(job.events):\n'
                  '        if str(event.get("stage") or "") == stage:\n'
                  '            return event\n'
                  '    return None\n\n\n'
                  'def _event_age_seconds(job: StoredSovereignAgentJob, stage: str) -> float | None:\n'
                  '    event = _latest_event(job, stage)\n'
                  '    if event is None:\n'
                  '        return None\n'
                  '    observed_at = event.get("at")\n'
                  '    if not isinstance(observed_at, (int, float)):\n'
                  '        return None\n'
                  '    return max(0.0, time.time() - (float(observed_at) / 1000.0))\n\n\n'
                  'def _event_workspace_sha256(event: dict[str, Any] | None) -> str | None:\n'
                  '    if event is None:\n'
                  '        return None\n'
                  '    match = _A2A_LOST_WORKSPACE_HASH_RE.search(str(event.get("message") or ""))\n'
                  '    return match.group(1) if match else None\n\n\n',
              )

              p = Path(path)
              text = p.read_text('utf-8')
              start = text.index('def _recover_lost_original_task(\n')
              end = text.index('\ndef reconcile_repository_execution(\n', start)
              replacement = '''def _reconcile_lost_original_task(\n    conn: Any,\n    *,\n    job: StoredSovereignAgentJob,\n    bound_ref: str,\n    task_id: str,\n    workspace_root: Path | None,\n) -> StoredSovereignAgentJob:\n    """Recover truth from a shared workspace without ever resubmitting on task-store loss.\n\n    Agent Zero currently uses FastA2A InMemoryStorage. A missing ``tasks/get`` record\n    therefore proves only that the current A2A task store cannot return the id; it does\n    not prove that the already-accepted implementation effect never ran. Sovereign keeps\n    the original task binding, observes the real shared Git workspace, requires the same\n    diff to remain stable across two bounded readbacks, and only then enters the existing\n    closeout/evidence gate. No second Agent Zero task is submitted from this path.\n    """\n\n    lost_event = _latest_event(job, _A2A_LOST_EVENT_STAGE)\n    if lost_event is None:\n        append_agent_event(conn, job.job_id, SovereignAgentEvent(\n            stage=_A2A_LOST_EVENT_STAGE,\n            level="warning",\n            message=(\n                "Agent Zero tasks/get no longer returns the persisted task id. "\n                "No resubmit is allowed; Sovereign will reconcile only a stable effect "\n                "already present in the shared workspace."\n            ),\n        ))\n        return read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n\n    lost_age = _event_age_seconds(job, _A2A_LOST_EVENT_STAGE)\n    if lost_age is not None and lost_age >= _repository_stall_seconds():\n        return _block_job(\n            conn,\n            job,\n            (\n                "AGENT_ZERO_A2A_TASK_LOST_STALLED: the persisted task remained unavailable "\n                "without a closable stable workspace effect; automatic resubmit is forbidden."\n            ),\n            "agent_zero_a2a_task_lost_stalled",\n        )\n\n    status_result = run_agent_job_tool(job, "git-status", {}, workspace_root)\n    if status_result.status != "done":\n        raise RepositoryExecutionTransientError(\n            "AGENT_ZERO_A2A_TASK_LOST_WORKSPACE_STATUS_UNAVAILABLE: "\n            "workspace readback failed; no resubmit was performed"\n        )\n    if not status_result.changed_files:\n        return read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n\n    patch, diff_result = git_diff_full(\n        str(job.workspace_id or job.job_id),\n        workspace_root,\n        max_bytes=_MAX_CLOSEOUT_DIFF_BYTES,\n        max_files=_MAX_CLOSEOUT_CHANGED_FILES,\n    )\n    if diff_result.status != "done" or not patch.strip():\n        raise RepositoryExecutionTransientError(\n            "AGENT_ZERO_A2A_TASK_LOST_WORKSPACE_DIFF_UNAVAILABLE: "\n            "workspace mutation is not yet independently closable; no resubmit was performed"\n        )\n\n    digest = hashlib.sha256(patch).hexdigest()\n    observed_event = _latest_event(job, _A2A_LOST_WORKSPACE_EVENT_STAGE)\n    if _event_workspace_sha256(observed_event) != digest:\n        append_agent_event(conn, job.job_id, SovereignAgentEvent(\n            stage=_A2A_LOST_WORKSPACE_EVENT_STAGE,\n            level="info",\n            message=(\n                "A real workspace diff exists after A2A task-store loss; awaiting a second "\n                f"stable readback sha256:{digest}. No resubmit was performed."\n            ),\n        ))\n        return read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n\n    stable_age = _event_age_seconds(job, _A2A_LOST_WORKSPACE_EVENT_STAGE)\n    if stable_age is None or stable_age < _lost_workspace_stable_seconds():\n        return read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n\n    claim_ref = _claim("closeout-lost", task_id)\n    if not compare_and_swap_agent_job_external_ref(\n        conn,\n        job_id=job.job_id,\n        expected_ref=bound_ref,\n        new_ref=claim_ref,\n    ):\n        return read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n    claimed = read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n    append_agent_event(conn, job.job_id, SovereignAgentEvent(\n        stage="agent_zero_a2a_task_lost_workspace_closeout",\n        level="success",\n        message=(\n            "The A2A task record stayed unavailable, but the same shared-workspace diff "\n            "remained stable. Sovereign is closing out that existing effect without resubmit."\n        ),\n    ))\n    return _closeout_repository_job(\n        conn,\n        job=claimed,\n        claim_ref=claim_ref,\n        bound_ref=bound_ref,\n        workspace_root=workspace_root,\n    )\n'''
              p.write_text(text[:start] + replacement + text[end:], 'utf-8')

              replace_once(
                  path,
                  '        return _recover_lost_original_task(\n'
                  '            conn,\n'
                  '            job=job,\n'
                  '            bound_ref=external_ref,\n'
                  '            task_id=task_id,\n'
                  '            a2a_client_factory=a2a_client_factory,\n'
                  '        )\n',
                  '        return _reconcile_lost_original_task(\n'
                  '            conn,\n'
                  '            job=job,\n'
                  '            bound_ref=external_ref,\n'
                  '            task_id=task_id,\n'
                  '            workspace_root=workspace_root,\n'
                  '        )\n',
              )

          for path in a2a_paths:
              p = Path(path)
              text = p.read_text('utf-8')
              count = text.count('"USE_SINGLE_ATOMIC_RESTART_RECOVERY"')
              if count != 2:
                  raise SystemExit(f'{path}: expected two legacy recovery hints, got {count}')
              p.write_text(text.replace(
                  '"USE_SINGLE_ATOMIC_RESTART_RECOVERY"',
                  '"RECONCILE_STABLE_WORKSPACE_WITHOUT_RESUBMIT"',
              ), 'utf-8')

          # Test helper must persist event summaries into the mocked StoredSovereignAgentJob,
          # matching the real append_agent_event denormalized jobs.events behavior.
          test_path = Path('backend/tests/test_repository_execution.py')
          test_text = test_path.read_text('utf-8')
          old_append = '''    def append(_conn, job_id, event):\n        assert job_id == state["job"].job_id\n        state["events"].append(event)\n'''
          new_append = '''    def append(_conn, job_id, event):\n        assert job_id == state["job"].job_id\n        state["events"].append(event)\n        job = state["job"]\n        event_row = {\n            "stage": event.stage,\n            "level": event.level,\n            "message": event.message,\n            "at": event.at,\n        }\n        state["job"] = replace(job, events=job.events + (event_row,))\n'''
          if test_text.count(old_append) != 1:
              raise SystemExit('test_repository_execution.py: append helper drift')
          test_text = test_text.replace(old_append, new_append, 1)

          start = test_text.index('def test_original_task_lost_resubmits_exactly_once_then_retry_lost_fails_closed(')
          end = test_text.index('\ndef test_ambiguous_submit_outcome_blocks_without_any_automatic_second_submit(', start)
          replacement = '''def test_original_task_lost_does_not_resubmit_and_transient_404_can_recover(monkeypatch):\n    state = _patch_job_store(monkeypatch, _job())\n    monkeypatch.setattr(\n        repository_execution,\n        "run_agent_job_tool",\n        lambda *_args, **_kwargs: _done_tool(changed_files=()),\n    )\n\n    class Client:\n        submit_count = 0\n        reads = 0\n\n        def get_task(self, task_id):\n            assert task_id == "task-original"\n            self.reads += 1\n            if self.reads == 1:\n                raise AgentZeroA2ATaskLost(\n                    "AGENT_ZERO_A2A_TASK_LOST",\n                    "RECONCILE_STABLE_WORKSPACE_WITHOUT_RESUBMIT",\n                    http_status=404,\n                )\n            return AgentZeroA2ATask(task_id=task_id, state="working")\n\n        def submit_repository_task(self, **_kwargs):\n            self.submit_count += 1\n            raise AssertionError("lost-task readback must never trigger an automatic resubmit")\n\n    client = Client()\n    first = repository_execution.reconcile_repository_execution(\n        object(), user_id="owner-test", job_id="agent-test",\n        a2a_client_factory=lambda: client,\n    )\n    assert first is not None\n    assert first.status == "running"\n    assert first.external_ref == "agent-zero-a2a:task-original"\n    assert client.submit_count == 0\n    assert any(event.stage == "agent_zero_a2a_task_readback_lost" for event in state["events"])\n\n    second = repository_execution.reconcile_repository_execution(\n        object(), user_id="owner-test", job_id="agent-test",\n        a2a_client_factory=lambda: client,\n    )\n    assert second is not None\n    assert second.status == "running"\n    assert second.external_ref == "agent-zero-a2a:task-original"\n    assert client.submit_count == 0\n\n\ndef test_original_task_lost_closes_stable_workspace_effect_without_resubmit(monkeypatch):\n    state = _patch_job_store(monkeypatch, _job())\n\n    class Client:\n        submit_count = 0\n\n        def get_task(self, task_id):\n            assert task_id == "task-original"\n            raise AgentZeroA2ATaskLost(\n                "AGENT_ZERO_A2A_TASK_LOST",\n                "RECONCILE_STABLE_WORKSPACE_WITHOUT_RESUBMIT",\n                http_status=404,\n            )\n\n        def submit_repository_task(self, **_kwargs):\n            self.submit_count += 1\n            raise AssertionError("workspace recovery must not submit a second Agent Zero task")\n\n    client = Client()\n    monkeypatch.setattr(\n        repository_execution,\n        "run_agent_job_tool",\n        lambda *_args, **_kwargs: _done_tool(changed_files=("README.md",)),\n    )\n    monkeypatch.setattr(\n        repository_execution,\n        "git_diff_full",\n        lambda *_args, **_kwargs: (\n            b"diff --git a/README.md b/README.md\\n+stable marker\\n",\n            SimpleNamespace(status="done", blocker=None),\n        ),\n    )\n    monkeypatch.setattr(repository_execution, "_lost_workspace_stable_seconds", lambda: 0.0)\n    closeouts: list[tuple[str, str]] = []\n\n    def closeout(_conn, *, job, claim_ref, bound_ref, workspace_root):\n        closeouts.append((claim_ref, bound_ref))\n        state["job"] = replace(\n            state["job"],\n            status="validating",\n            external_ref=bound_ref,\n            changed_files=("README.md",),\n            pr_state="ready",\n        )\n        return state["job"]\n\n    monkeypatch.setattr(repository_execution, "_closeout_repository_job", closeout)\n\n    # First miss records task-store loss; second observes the diff; third confirms the\n    # same diff is stable and enters closeout. None may call message/send.\n    for _ in range(3):\n        result = repository_execution.reconcile_repository_execution(\n            object(), user_id="owner-test", job_id="agent-test",\n            a2a_client_factory=lambda: client,\n        )\n\n    assert result is not None\n    assert result.pr_state == "ready"\n    assert result.changed_files == ("README.md",)\n    assert result.external_ref == "agent-zero-a2a:task-original"\n    assert client.submit_count == 0\n    assert len(closeouts) == 1\n    assert closeouts[0][0].startswith("agent-zero-a2a:claim:closeout-lost:")\n    assert closeouts[0][1] == "agent-zero-a2a:task-original"\n    assert any(event.stage == "agent_zero_a2a_task_lost_workspace_observed" for event in state["events"])\n    assert any(event.stage == "agent_zero_a2a_task_lost_workspace_closeout" for event in state["events"])\n\n\ndef test_historical_retry_task_lost_blocks_without_another_resubmit(monkeypatch):\n    state = _patch_job_store(monkeypatch, _job(external_ref="agent-zero-a2a:retry:task-retry"))\n\n    class Client:\n        submit_count = 0\n\n        def get_task(self, task_id):\n            assert task_id == "task-retry"\n            raise AgentZeroA2ATaskLost(\n                "AGENT_ZERO_A2A_TASK_LOST",\n                "RECONCILE_STABLE_WORKSPACE_WITHOUT_RESUBMIT",\n                http_status=404,\n            )\n\n        def submit_repository_task(self, **_kwargs):\n            self.submit_count += 1\n            raise AssertionError("historical retry loss must fail closed without another submit")\n\n    client = Client()\n    terminal = repository_execution.reconcile_repository_execution(\n        object(), user_id="owner-test", job_id="agent-test",\n        a2a_client_factory=lambda: client,\n    )\n    assert terminal is not None\n    assert terminal.status == "blocked"\n    assert "no further resubmit" in (terminal.blocker or "")\n    assert client.submit_count == 0\n'''
          test_path.write_text(test_text[:start] + replacement + test_text[end:], 'utf-8')

          a2a_test = Path('backend/tests/test_agent_zero_a2a.py')
          text = a2a_test.read_text('utf-8')
          old = '    assert error.value.family == "AGENT_ZERO_A2A_TASK_LOST"\n\n\ndef test_submit_timeout_is_ambiguous'
          new = '    assert error.value.family == "AGENT_ZERO_A2A_TASK_LOST"\n    assert error.value.next_action == "RECONCILE_STABLE_WORKSPACE_WITHOUT_RESUBMIT"\n\n\ndef test_submit_timeout_is_ambiguous'
          if text.count(old) != 1:
              raise SystemExit('test_agent_zero_a2a.py: lost-task assertion drift')
          a2a_test.write_text(text.replace(old, new, 1), 'utf-8')

          # Canonical/shipping mirrors are a hard deployment contract.
          for name in ['repository_execution.py', 'agent_zero_a2a.py']:
              left = Path('backend/agent_runtime') / name
              right = Path('scripts/sovereign-backend/agent_runtime') / name
              if left.read_bytes() != right.read_bytes():
                  raise SystemExit(f'mirror mismatch: {name}')
          PY
      - name: Targeted regression and static verification
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest backend/tests/test_agent_zero_a2a.py backend/tests/test_repository_execution.py -q
          python -m py_compile backend/agent_runtime/agent_zero_a2a.py backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/agent_zero_a2a.py scripts/sovereign-backend/agent_runtime/repository_execution.py
          cmp backend/agent_runtime/agent_zero_a2a.py scripts/sovereign-backend/agent_runtime/agent_zero_a2a.py
          cmp backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py
          git diff --check
      - name: Commit product patch and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add backend/agent_runtime/agent_zero_a2a.py backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/agent_zero_a2a.py scripts/sovereign-backend/agent_runtime/repository_execution.py backend/tests/test_agent_zero_a2a.py backend/tests/test_repository_execution.py
          git commit -m "fix(agent-runtime): recover lost A2A truth from stable workspace"
          git rm .github/workflows/operator-a2a-lost-workspace-patch.yml
          git commit -m "chore(operator): remove one-shot A2A patch workflow"
          git push origin HEAD:sovereign/chatgpt/a2a-lost-task-workspace-recovery-20260915
