name: Open PR Consolidation One-Shot

on:
  push:
    branches:
      - sovereign/chatgpt/open-pr-consolidation-runner-20260911
    paths:
      - .github/workflows/open-pr-consolidation-one-shot.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: sovereign/chatgpt/open-pr-consolidation-20260911
      PRS: "1767 1770 1774 1780 1785 1811 1819 1830 1845 1847 1848 1909 1910 1915"
    steps:
      - name: Checkout target branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ouroboros PR Consolidator'
          git config user.email 'actions@users.noreply.github.com'

      - name: Fast-forward consolidation base with current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Port source and test changes from stale PRs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .sovereign-artifacts
          : > .sovereign-artifacts/consolidation.log
          conflicts=0
          for pr in $PRS; do
            echo "=== PR #$pr ===" | tee -a .sovereign-artifacts/consolidation.log
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}")"
            sha="$(printf '%s' "$pr_json" | jq -r '.head.sha')"
            base="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
            git fetch origin "$sha" "$base"
            patch="/tmp/pr-${pr}.patch"
            git diff --binary "$base" "$sha" -- . \
              ':(exclude).security-reports/**' \
              ':(exclude)generated/**' \
              ':(exclude).jules/**' \
              ':(exclude)Memory.md' \
              ':(exclude)config/architecture/llm-tool-boundary-review-ledger.json' \
              ':(exclude)docs/sovereign-continuity/LEDGER.jsonl' \
              ':(exclude)tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl' \
              > "$patch"
            if [ ! -s "$patch" ]; then
              echo "PR #$pr: no source/test delta after exclusions" | tee -a .sovereign-artifacts/consolidation.log
              continue
            fi
            if ! git apply --3way --index --check "$patch"; then
              echo "PR #$pr: SOURCE_CONFLICT" | tee -a .sovereign-artifacts/consolidation.log
              conflicts=$((conflicts + 1))
              continue
            fi
            git apply --3way --index "$patch"
            if git diff --cached --quiet; then
              echo "PR #$pr: already represented" | tee -a .sovereign-artifacts/consolidation.log
              continue
            fi
            git diff --cached --check
            git commit -m "chore(consolidation): port useful changes from PR #$pr"
            echo "PR #$pr: PORTED" | tee -a .sovereign-artifacts/consolidation.log
          done
          echo "SOURCE_CONFLICT_COUNT=$conflicts" | tee -a .sovereign-artifacts/consolidation.log
          git status --short
          git push origin "HEAD:$TARGET_BRANCH"
          if [ "$conflicts" -ne 0 ]; then
            exit 20
          fi

      - name: Upload bounded consolidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-pr-consolidation-${{ github.run_id }}
          path: .sovereign-artifacts/consolidation.log
          if-no-files-found: warn
          retention-days: 3
