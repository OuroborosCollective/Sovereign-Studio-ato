name: Open PR Consolidation One-Shot

on:
  push:
    branches:
      - sovereign/chatgpt/open-pr-consolidation-runner-20260911
    paths:
      - .github/workflows/open-pr-consolidation-one-shot.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: sovereign/chatgpt/open-pr-consolidation-20260911
    steps:
      - name: Checkout target branch with history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Configure Git and bind current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ouroboros PR Consolidator'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Port only allowlisted GitHub PR file patches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .sovereign-artifacts
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          mapping = {
              1767: ['src/features/product/runtime/sovereignAgentClient.ts'],
              1770: ['src/features/product/runtime/patternMemoryRuntime.ts'],
              1774: ['src/mobile-workflow-pattern-rules.ts'],
              1780: [
                  'src/features/product/runtime/builderContainerHelpers.ts',
                  'src/features/product/runtime/builderContainerHelpers.test.ts',
              ],
              1785: [
                  'src/features/product/runtime/patternMemoryContainerRuntime.ts',
                  'src/features/product/runtime/patternMemoryContainerRuntime.test.ts',
              ],
              1811: ['src/features/product/runtime/brownfieldExplorer.ts'],
              1819: ['src/predictive/pipeline/tickWindow.ts'],
              1830: ['src/features/product/runtime/sovereignTelemetry.ts'],
              1845: ['src/features/product/runtime/sovereignActionStreamRuntime.ts'],
              1847: [
                  'src/features/product/components/ModelHealthPanel.tsx',
                  'src/features/product/components/ModelHealthPanel.test.tsx',
              ],
              1848: ['src/features/product/runtime/generatedFileReview.ts'],
              1910: [
                  'backend/agent_runtime/cognitive_swarm_routes.py',
                  'scripts/sovereign-backend/agent_runtime/cognitive_swarm_routes.py',
                  'backend/tests/test_cognitive_swarm_routes.py',
              ],
              1915: ['src/features/product/components/ErrorCategoriesPanel.tsx'],
          }

          log = []
          conflicts = []
          for pr, allowed in mapping.items():
              print(f'=== PR #{pr} ===', flush=True)
              raw = subprocess.check_output([
                  'gh', 'api', f'repos/{repo}/pulls/{pr}/files?per_page=100'
              ], text=True)
              files = json.loads(raw)
              by_name = {str(item.get('filename')): item for item in files}
              missing = [path for path in allowed if path not in by_name]
              if missing:
                  raise SystemExit(f'PR #{pr}: allowlisted file missing from GitHub PR file list: {missing}')
              pieces = []
              for path in allowed:
                  item = by_name[path]
                  patch = item.get('patch')
                  if not isinstance(patch, str) or not patch.strip():
                      raise SystemExit(f'PR #{pr}: GitHub patch unavailable for {path}')
                  status = str(item.get('status') or 'modified')
                  previous = str(item.get('previous_filename') or path)
                  old_path = previous
                  new_path = path
                  old_header = '/dev/null' if status == 'added' else f'a/{old_path}'
                  new_header = '/dev/null' if status == 'removed' else f'b/{new_path}'
                  pieces.append(
                      f'diff --git a/{old_path} b/{new_path}\n'
                      f'--- {old_header}\n'
                      f'+++ {new_header}\n'
                      f'{patch.rstrip()}\n'
                  )
              patch_path = Path(f'/tmp/pr-{pr}-allowlisted.patch')
              patch_path.write_text(''.join(pieces), encoding='utf-8')
              check = subprocess.run(['git', 'apply', '--index', '--check', str(patch_path)], text=True, capture_output=True)
              if check.returncode != 0:
                  message = ' '.join((check.stderr or check.stdout or '').split())[:600]
                  line = f'PR #{pr}: SOURCE_CONFLICT: {message}'
                  print(line, flush=True)
                  log.append(line)
                  conflicts.append(pr)
                  continue
              subprocess.run(['git', 'apply', '--index', str(patch_path)], check=True)
              staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
              unexpected = sorted(set(staged) - set(allowed))
              if unexpected:
                  raise SystemExit(f'PR #{pr}: unexpected staged paths: {unexpected}')
              if not staged:
                  line = f'PR #{pr}: ALREADY_REPRESENTED'
                  print(line, flush=True)
                  log.append(line)
                  continue
              subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
              subprocess.run(['git', 'commit', '-m', f'chore(consolidation): port useful changes from PR #{pr}'], check=True)
              line = f'PR #{pr}: PORTED: {",".join(staged)}'
              print(line, flush=True)
              log.append(line)

          log.append(f'SOURCE_CONFLICT_COUNT={len(conflicts)}')
          log.append('SOURCE_CONFLICT_PRS=' + ','.join(map(str, conflicts)))
          Path('.sovereign-artifacts/consolidation.log').write_text('\n'.join(log) + '\n', encoding='utf-8')
          print('\n'.join(log), flush=True)
          PY
          git status --short
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload bounded consolidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-pr-consolidation-${{ github.run_id }}
          path: .sovereign-artifacts/consolidation.log
          if-no-files-found: warn
          retention-days: 3
