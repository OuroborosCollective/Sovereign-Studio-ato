name: Operator Lost Task Workspace First
on:
  push:
    branches: [sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup backend Python
        uses: ./.github/actions/setup-backend-python
        with:
          python-version: '3.11'
      - name: Guard and patch runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git merge-base HEAD 5a682f8407536d6f7ccbc0b6908a9d04e8fdd434)" = "5a682f8407536d6f7ccbc0b6908a9d04e8fdd434"
          python scripts/operator-lost-task-workspace-first.py
      - name: Targeted regression
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest backend/tests/test_repository_execution.py -q
          python -m py_compile backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py
          cmp backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py
          git diff --check
      - name: Commit runtime repair
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py backend/tests/test_repository_execution.py
          git commit -m "fix(agent-runtime): close out lost A2A workspace before retry"
          git push origin HEAD:sovereign/chatgpt/lost-task-workspace-first-cleanup-20260915
