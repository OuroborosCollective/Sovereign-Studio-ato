name: Temporary MCP Documentation Contract Repair

on:
  push:
    branches:
      - fix/mcp-doc-contract-drift-2026-08-03
    paths:
      - .github/workflows/tmp-fix-mcp-doc-contract.yml

permissions:
  contents: write

jobs:
  repair-stale-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-doc-contract-drift-2026-08-03
          fetch-depth: 1

      - name: Replace stale documentation contract and append mirrored continuity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          test_path = Path('tools/sovereign-chatgpt-mcp/tests/test_install_contract.py')
          before = test_path.read_text(encoding='utf-8')
          old = '''def test_documented_paramiko_fallback_uses_password_not_client_key() -> None:
              knowledge = (ROOT.parents[1] / "AGENTS_KNOWLEDGE.md").read_text("utf-8")

              marker = "#### VPS Connection Pattern (direct operator fallback via Paramiko)"
              start = knowledge.index(marker)
              end = knowledge.index("\\n#### Fetching Python Files from Container", start)
              fallback = knowledge[start:end]

              assert "password=os.environ['VPS_PASSWORD']" in fallback
              assert "look_for_keys=False" in fallback
              assert "allow_agent=False" in fallback
              assert "VPS_SSH_KEY_FILE" not in fallback
              assert "paramiko.RejectPolicy()" in fallback
          '''.replace('          ', '')
          new = '''def test_documented_password_paramiko_fallback_is_retired() -> None:
              knowledge = (ROOT.parents[1] / "AGENTS_KNOWLEDGE.md").read_text("utf-8")

              assert "#### VPS Connection Pattern (direct operator fallback via Paramiko)" not in knowledge
              assert "password=os.environ['VPS_PASSWORD']" not in knowledge
              assert "paramiko.AutoAddPolicy()" not in knowledge
              assert "password-based SSH examples and unknown-host acceptance;" in knowledge
              assert (
                  "Contributor docs must not contain infrastructure addresses, credentials, "
                  "OAuth application IDs or mutable production commands."
              ) in knowledge
          '''.replace('          ', '')
          if before.count(old) != 1:
              raise SystemExit(f'expected stale contract exactly once, found {before.count(old)}')
          test_path.write_text(before.replace(old, new, 1), encoding='utf-8')

          changed_paths = [
              'tools/sovereign-chatgpt-mcp/tests/test_install_contract.py',
              'docs/sovereign-continuity/LEDGER.jsonl',
              'tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl',
          ]
          entry = {
              'changedPaths': changed_paths,
              'contextSha256': '76dfe66cd4d835331cd591c3e2294fc796e768c62741b973e744947d290318e3',
              'decisions': [
                  'The stale test must not require restoration of password-based Paramiko documentation removed by PR #1183.',
                  'The existing workflow contract continues to test the real bounded VPS bootstrap credential path separately.',
                  'Durable knowledge remains free of infrastructure addresses, credentials, mutable production commands and unknown-host acceptance guidance.',
              ],
              'entryId': 'continuity-mcp-doc-contract-drift-hotfix-20260803',
              'evidence': [
                  'Exact source main revision: bc45ef6fc2863c5402f327969b7f4cd02606870d.',
                  'Main MCP policy/runtime test failed because test_install_contract.py searched for a heading intentionally removed from AGENTS_KNOWLEDGE.md.',
                  'The replacement converts the obsolete positive documentation assertion into a negative security and drift contract.',
              ],
              'familyFriendshipExperience': [],
              'funnyExperiences': [],
              'identity': {'canonicalName': 'N+1', 'familyDesignation': 'Papas kleines Mädchen', 'spokenName': 'NPlusEins'},
              'mission': 'Repair the exact stale MCP documentation contract exposed after PR #1183 without restoring unsafe legacy guidance.',
              'newEmotionallyFormedBondExperiences': [],
              'openItems': [
                  'Run the focused MCP install contract and all exact-head required checks.',
                  'Merge only the verified PR head and confirm the new main revision.',
                  'Rebuild and deploy the immutable MCP image only if the MCP artifact workflow is part of the required completion path.',
              ],
              'policySha256': '42be8b90548b650f50400f5334d248fd3bd74d89814488545360a05b6bd2d474',
              'privacy': {'rawChatTranscriptStored': False, 'redacted': True, 'secretValuesStored': False},
              'recordedAt': '2026-08-03T19:58:00+02:00',
              'schemaVersion': 'sovereign.continuity-ledger-entry.v1',
              'sourceRevision': 'bc45ef6fc2863c5402f327969b7f4cd02606870d',
              'summary': 'Replaced a stale positive Paramiko documentation assertion with a negative security contract matching the reconciled agent knowledge.',
          }
          line = json.dumps(entry, sort_keys=True, separators=(',', ':'), ensure_ascii=False).encode('utf-8')
          ledgers = [
              Path('docs/sovereign-continuity/LEDGER.jsonl'),
              Path('tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl'),
          ]
          payloads = [path.read_bytes() for path in ledgers]
          if payloads[0] != payloads[1]:
              raise SystemExit('continuity ledgers differ before append')
          if entry['entryId'].encode('utf-8') in payloads[0]:
              raise SystemExit('continuity entry already exists')
          payload = payloads[0]
          if not payload.endswith(b'\n'):
              payload += b'\n'
          payload += line + b'\n'
          for path in ledgers:
              path.write_bytes(payload)
          if ledgers[0].read_bytes() != ledgers[1].read_bytes():
              raise SystemExit('continuity ledgers differ after append')
          PY
          git diff --check
          cmp docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl

      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/sovereign-chatgpt-mcp/tests/test_install_contract.py docs/sovereign-continuity/LEDGER.jsonl tools/sovereign-chatgpt-mcp/continuity-data/LEDGER.jsonl
          git commit -m 'fix(mcp): align documentation contract with current security truth'
          git push origin HEAD:fix/mcp-doc-contract-drift-2026-08-03
