name: Operator A2A Lost Restore Refine
on:
  push:
    branches: [sovereign/chatgpt/a2a-lost-task-workspace-recovery-20260915]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/a2a-lost-task-workspace-recovery-20260915
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup backend Python
        uses: ./.github/actions/setup-backend-python
        with:
          python-version: '3.11'
      - name: Patch restored-readback epoch
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text('utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old,new,1),'utf-8')

          for path in ['backend/agent_runtime/repository_execution.py','scripts/sovereign-backend/agent_runtime/repository_execution.py']:
              replace_once(path,
                  '_A2A_LOST_EVENT_STAGE: Final[str] = "agent_zero_a2a_task_readback_lost"\n_A2A_LOST_WORKSPACE_EVENT_STAGE:',
                  '_A2A_LOST_EVENT_STAGE: Final[str] = "agent_zero_a2a_task_readback_lost"\n_A2A_RESTORED_EVENT_STAGE: Final[str] = "agent_zero_a2a_task_readback_restored"\n_A2A_LOST_WORKSPACE_EVENT_STAGE:')
              replace_once(path,
                  'def _event_age_seconds(job: StoredSovereignAgentJob, stage: str) -> float | None:\n    event = _latest_event(job, stage)\n    if event is None:\n        return None\n    observed_at = event.get("at")\n    if not isinstance(observed_at, (int, float)):\n        return None\n    return max(0.0, time.time() - (float(observed_at) / 1000.0))\n\n\n',
                  'def _event_time_ms(event: dict[str, Any] | None) -> float | None:\n    if event is None:\n        return None\n    observed_at = event.get("at")\n    return float(observed_at) if isinstance(observed_at, (int, float)) else None\n\n\ndef _event_age_seconds(job: StoredSovereignAgentJob, stage: str) -> float | None:\n    observed_at = _event_time_ms(_latest_event(job, stage))\n    if observed_at is None:\n        return None\n    return max(0.0, time.time() - (observed_at / 1000.0))\n\n\ndef _lost_epoch_is_active(job: StoredSovereignAgentJob) -> bool:\n    lost_at = _event_time_ms(_latest_event(job, _A2A_LOST_EVENT_STAGE))\n    restored_at = _event_time_ms(_latest_event(job, _A2A_RESTORED_EVENT_STAGE))\n    return lost_at is not None and (restored_at is None or lost_at > restored_at)\n\n\n')
              replace_once(path,
                  '    lost_event = _latest_event(job, _A2A_LOST_EVENT_STAGE)\n    if lost_event is None:\n',
                  '    lost_event = _latest_event(job, _A2A_LOST_EVENT_STAGE)\n    if not _lost_epoch_is_active(job):\n')
              replace_once(path,
                  '    if task.active:\n        return job\n',
                  '    if task.active:\n        if _lost_epoch_is_active(job):\n            append_agent_event(conn, job.job_id, SovereignAgentEvent(\n                stage=_A2A_RESTORED_EVENT_STAGE,\n                level="info",\n                message=(\n                    "Agent Zero tasks/get returned the original task id again; the prior "\n                    "lost-readback epoch is closed and any future loss starts a fresh bounded window."\n                ),\n            ))\n            return read_agent_job(conn, user_id=job.user_id, job_id=job.job_id) or job\n        return job\n')

          test='backend/tests/test_repository_execution.py'
          p=Path(test); text=p.read_text('utf-8')
          old='''    second = repository_execution.reconcile_repository_execution(\n        object(), user_id="owner-test", job_id="agent-test",\n        a2a_client_factory=lambda: client,\n    )\n    assert second is not None\n    assert second.status == "running"\n    assert second.external_ref == "agent-zero-a2a:task-original"\n    assert client.submit_count == 0\n'''
          new='''    second = repository_execution.reconcile_repository_execution(\n        object(), user_id="owner-test", job_id="agent-test",\n        a2a_client_factory=lambda: client,\n    )\n    assert second is not None\n    assert second.status == "running"\n    assert second.external_ref == "agent-zero-a2a:task-original"\n    assert client.submit_count == 0\n    assert any(event.stage == "agent_zero_a2a_task_readback_restored" for event in state["events"])\n    assert repository_execution._lost_epoch_is_active(second) is False\n'''
          if text.count(old)!=1: raise SystemExit('transient restore test drift')
          text=text.replace(old,new,1)
          marker='''def test_original_task_lost_closes_stable_workspace_effect_without_resubmit(monkeypatch):\n'''
          regression='''def test_restored_task_makes_a_later_loss_start_a_fresh_epoch(monkeypatch):\n    state = _patch_job_store(monkeypatch, _job())\n    old_at = int((repository_execution.time.time() - 4000.0) * 1000)\n    state["job"] = replace(state["job"], events=(\n        {"stage": "agent_zero_a2a_task_readback_lost", "level": "warning", "message": "old", "at": old_at},\n        {"stage": "agent_zero_a2a_task_readback_restored", "level": "info", "message": "restored", "at": old_at + 1000},\n    ))\n    monkeypatch.setattr(repository_execution, "run_agent_job_tool", lambda *_a, **_k: _done_tool(changed_files=()))\n\n    class Client:\n        def get_task(self, task_id):\n            raise AgentZeroA2ATaskLost("AGENT_ZERO_A2A_TASK_LOST", "RECONCILE_STABLE_WORKSPACE_WITHOUT_RESUBMIT", http_status=404)\n        def submit_repository_task(self, **_kwargs):\n            raise AssertionError("fresh lost epoch must never resubmit")\n\n    result = repository_execution.reconcile_repository_execution(\n        object(), user_id="owner-test", job_id="agent-test", a2a_client_factory=Client,\n    )\n    assert result is not None\n    assert result.status == "running"\n    assert repository_execution._lost_epoch_is_active(result) is True\n    lost_events = [event for event in state["events"] if event.stage == "agent_zero_a2a_task_readback_lost"]\n    assert len(lost_events) == 1\n    assert lost_events[0].at > old_at + 1000\n\n\n'''
          if text.count(marker)!=1: raise SystemExit('insert marker drift')
          p.write_text(text.replace(marker,regression+marker,1),'utf-8')

          for name in ['repository_execution.py']:
              a=Path('backend/agent_runtime')/name; b=Path('scripts/sovereign-backend/agent_runtime')/name
              if a.read_bytes()!=b.read_bytes(): raise SystemExit(f'mirror mismatch: {name}')
          PY
      - name: Verify refinement
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest backend/tests/test_repository_execution.py backend/tests/test_agent_zero_a2a.py -q
          python -m py_compile backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py
          cmp backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py
          git diff --check
      - name: Commit refinement and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Ouroboros Collective"
          git config user.email "projectouroboroscollective@gmail.com"
          git add backend/agent_runtime/repository_execution.py scripts/sovereign-backend/agent_runtime/repository_execution.py backend/tests/test_repository_execution.py
          git commit -m "fix(agent-runtime): reset lost-task epoch after readback recovery"
          git rm .github/workflows/operator-a2a-lost-restore-refine.yml
          git commit -m "chore(operator): remove lost-task refinement workflow"
          git push origin HEAD:sovereign/chatgpt/a2a-lost-task-workspace-recovery-20260915
