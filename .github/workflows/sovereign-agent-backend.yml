name: Sovereign Agent Backend

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/requirements-test.txt'
      - 'backend/litellm_runtime.py'
      - 'scripts/check-backend-python-runtime.py'
      - 'scripts/sovereign-backend/**'
      - 'scripts/sovereign-agent-internal-live-path.contract.mjs'
      - '.github/actions/setup-backend-python/**'
      - '.github/workflows/sovereign-agent-backend.yml'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    name: Agent Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup verified backend Python runtime
        uses: ./.github/actions/setup-backend-python
        with:
          python-version: '3.11'

      - name: Run Agent Runtime Tests
        shell: bash
        run: |
          set +e
          pytest scripts/sovereign-backend/tests \
            backend/tests/test_agent_runtime_routes.py \
            -q 2>&1 | tee agent-runtime-pytest.log
          test_status=${PIPESTATUS[0]}
          exit "${test_status}"

      - name: Upload bounded agent-runtime test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-pytest-${{ github.run_id }}
          path: agent-runtime-pytest.log
          if-no-files-found: error
          retention-days: 3
