name: Sovereign Agent Backend

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/requirements-test.txt'
      - 'backend/litellm_runtime.py'
      - 'scripts/check-backend-python-runtime.py'
      - 'scripts/sovereign-backend/**'
      - 'scripts/sovereign-agent-internal-live-path.contract.mjs'
      - '.github/actions/setup-backend-python/**'
      - '.github/workflows/sovereign-agent-backend.yml'
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tests:
    name: Agent Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup verified backend Python runtime
        uses: ./.github/actions/setup-backend-python
        with:
          python-version: '3.11'

      - name: Run Agent Runtime Tests
        shell: bash
        run: |
          set +e
          pytest scripts/sovereign-backend/tests \
            backend/tests/test_agent_runtime_routes.py \
            backend/tests/test_configuration_provenance.py \
            backend/tests/test_configuration_provenance_mirror.py \
            backend/tests/test_configuration_inventory.py \
            -q 2>&1 | tee agent-runtime-pytest.log
          test_status=${PIPESTATUS[0]}
          exit "${test_status}"

      - name: Configuration provenance inventory must report zero drift
        shell: bash
        run: |
          python backend/agent_runtime/configuration_inventory.py --strict > config-inventory.json
          python -c "import json, sys
          inv = json.load(open('config-inventory.json'))
          if len(inv['surfaces']) < 5:
              sys.exit('too few config surfaces catalogued')
          if len(inv['drift']) != 0:
              sys.exit('drift in config inventory: ' + str(inv['drift']))
          print('Config inventory OK:', inv['snapshotSha256'])"

      - name: Config inventory checked-in artifact must match the runner
        shell: bash
        run: |
          python -c "import json, sys
          from pathlib import Path
          sys.path.insert(0, 'backend')
          from agent_runtime.configuration_inventory import build_inventory
          artifact = json.loads(Path('docs/architecture/CONFIGURATION_PROVENANCE_INVENTORY.json').read_text())
          live = build_inventory(Path('.').resolve())
          if artifact['snapshotSha256'] != live['snapshotSha256']:
              sys.exit('stale inventory artifact: regenerate with: python backend/agent_runtime/configuration_inventory.py --write')
          print('Config inventory artifact matches runner:', artifact['snapshotSha256'])"

      - name: Mirror parity for configuration inventory runner + tests
        shell: bash
        run: |
          set -e
          for f in backend/agent_runtime/configuration_inventory.py \
                   backend/tests/test_configuration_inventory.py; do
            canonical="$f"
            mirror="scripts/sovereign-backend/${f#backend/}"
            if ! diff -q "$canonical" "$mirror" > /dev/null; then
              echo "MIRROR DRIFT: $canonical vs $mirror"
              diff "$canonical" "$mirror" || true
              exit 1
            fi
          done

      - name: Validate Sovereign Brain Projection (advisory)
        id: brain_projection
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sovereign_brain_projection.py check
          python3 -m unittest scripts.test_sovereign_brain_projection -v

      - name: Record Brain Projection advisory result
        if: always()
        shell: bash
        env:
          BRAIN_OUTCOME: ${{ steps.brain_projection.outcome }}
        run: |
          set -euo pipefail
          {
            echo '## Sovereign Brain Projection (advisory)'
            echo
            echo "- Outcome: ${BRAIN_OUTCOME}"
            echo '- This projection is context/evidence navigation only and is not a product, merge, release, deployment, or runtime gate.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BRAIN_OUTCOME" != success ]]; then
            echo '::warning title=Brain projection advisory::The project-brain projection is stale or invalid. Product/runtime evidence remains independently authoritative.'
          fi

      - name: Upload bounded agent-runtime test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-pytest-${{ github.run_id }}
          path: agent-runtime-pytest.log
          if-no-files-found: error
          retention-days: 3
