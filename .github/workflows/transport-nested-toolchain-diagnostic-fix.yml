name: Transport Nested Toolchain Diagnostic Fix

on:
  push:
    branches:
      - sovereign/chatgpt/fix-neuro-init-and-toolchain-evidence
    paths:
      - .github/workflows/transport-nested-toolchain-diagnostic-fix.yml
      - scripts/patches/pending/fix-nested-toolchain-diagnostic-projection.json

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded nested diagnostic patch onto existing clean fix branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO_FULL_NAME: ${{ github.repository }}
          BASE_BRANCH: main
          DRY_RUN: "false"
        run: |
          python3 scripts/patches/search_replace_runner.py scripts/patches/pending/fix-nested-toolchain-diagnostic-projection.json
