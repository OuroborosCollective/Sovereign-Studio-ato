name: Synchronous Revision Control

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/synchronous-revision-gate.mjs'
      - 'scripts/synchronous-revision-gate.contract.mjs'
      - '.github/workflows/synchronous-revision-control.yml'
      - '.github/workflows/sovereign-backend-image.yml'
      - '.github/workflows/sovereign-chatgpt-mcp.yml'
      - '.github/workflows/release-verification.yml'
  workflow_run:
    workflows:
      - Sovereign Backend Immutable Image
      - Sovereign ChatGPT MCP
    types: [completed]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact main source revision to bind
        required: true
        type: string
      release_mode:
        description: Require coordinated VPS runtime readback evidence
        required: false
        default: false
        type: boolean
      runtime_readback_evidence_path:
        description: Repository-relative runtime readback JSON used only in release mode
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: synchronous-revision-control-${{ github.event.workflow_run.head_sha || inputs.source_revision || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    name: Synchronous Revision Contract
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/synchronous-revision-gate.contract.mjs

  image-synchronization:
    name: Synchronous Backend and MCP Images
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve authoritative source revision
        id: revision
        uses: actions/github-script@v7
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          INPUT_HEAD: ${{ inputs.source_revision || '' }}
        with:
          script: |
            const event = process.env.EVENT_NAME;
            const workflowHead = String(process.env.WORKFLOW_HEAD || '').toLowerCase();
            const inputHead = String(process.env.INPUT_HEAD || '').toLowerCase();
            const head = event === 'workflow_dispatch' ? inputHead : workflowHead;
            if (!/^[0-9a-f]{40}$/.test(head)) {
              core.setFailed('AUTHORITATIVE_REVISION_INVALID');
              return;
            }
            if (event === 'workflow_run') {
              if (process.env.WORKFLOW_BRANCH !== 'main') {
                core.setFailed('WORKFLOW_RUN_NOT_MAIN');
                return;
              }
              if (process.env.WORKFLOW_CONCLUSION !== 'success') {
                core.setFailed('TRIGGERING_IMAGE_WORKFLOW_NOT_SUCCESSFUL');
                return;
              }
            }
            const { data: currentMain } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (String(currentMain.object?.sha || '').toLowerCase() !== head) {
              core.setFailed('SOURCE_REVISION_IS_NOT_CURRENT_MAIN');
              return;
            }
            core.setOutput('head', head);

      - name: Wait for both exact-head immutable image workflows
        id: image_runs
        uses: actions/github-script@v7
        env:
          HEAD: ${{ steps.revision.outputs.head }}
        with:
          script: |
            const head = String(process.env.HEAD || '').toLowerCase();
            const workflows = [
              { key: 'backend', file: 'sovereign-backend-image.yml' },
              { key: 'mcp', file: 'sovereign-chatgpt-mcp.yml' },
            ];
            const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
            let selected = null;
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const state = {};
              for (const workflow of workflows) {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: workflow.file,
                  event: 'push',
                  branch: 'main',
                  per_page: 100,
                });
                const candidates = data.workflow_runs
                  .filter((run) => String(run.head_sha || '').toLowerCase() === head)
                  .sort((left, right) => String(right.created_at).localeCompare(String(left.created_at)));
                state[workflow.key] = candidates[0] || null;
              }
              const allPresent = workflows.every((workflow) => state[workflow.key]);
              const allSuccess = allPresent && workflows.every((workflow) => state[workflow.key].status === 'completed' && state[workflow.key].conclusion === 'success');
              const terminalFailure = workflows.some((workflow) => state[workflow.key] && state[workflow.key].status === 'completed' && state[workflow.key].conclusion !== 'success');
              if (allSuccess) {
                selected = state;
                break;
              }
              if (terminalFailure) {
                core.setFailed(`EXACT_HEAD_IMAGE_WORKFLOW_FAILED:${JSON.stringify(state)}`);
                return;
              }
              await sleep(15000);
            }
            if (!selected) {
              core.setFailed('EXACT_HEAD_IMAGE_WORKFLOWS_DID_NOT_BECOME_SUCCESSFUL');
              return;
            }
            for (const [key, run] of Object.entries(selected)) {
              core.setOutput(`${key}_run_id`, String(run.id));
            }
            core.summary.addHeading('Exact-head image workflow binding').addTable([
              [{ data: 'Component', header: true }, { data: 'Run ID', header: true }, { data: 'Head', header: true }],
              ...Object.entries(selected).map(([key, run]) => [key, String(run.id), String(run.head_sha)]),
            ]).write();

      - name: Download exact backend image evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.image_runs.outputs.backend_run_id }}
          name: sovereign-backend-immutable-image-evidence-${{ steps.revision.outputs.head }}
          path: evidence/backend

      - name: Download exact MCP image evidence
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.image_runs.outputs.mcp_run_id }}
          name: sovereign-mcp-immutable-image-evidence-${{ steps.revision.outputs.head }}
          path: evidence/mcp

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.head }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce image revision synchronization
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'false' }}
          RUNTIME_EVIDENCE: ${{ inputs.runtime_readback_evidence_path || '' }}
          HEAD: ${{ steps.revision.outputs.head }}
        run: |
          set -Eeuo pipefail
          args=(--mode ci --head "$HEAD" --backend evidence/backend/sovereign-backend-immutable-image-evidence.json --mcp evidence/mcp/sovereign-mcp-immutable-image-evidence.json --report synchronous-revision-gate.json)
          if [[ "$RELEASE_MODE" == 'true' ]]; then
            [[ -n "$RUNTIME_EVIDENCE" && -f "$RUNTIME_EVIDENCE" ]] || { echo 'Runtime evidence path is required for release mode.' >&2; exit 1; }
            args=(--mode release --head "$HEAD" --backend evidence/backend/sovereign-backend-immutable-image-evidence.json --mcp evidence/mcp/sovereign-mcp-immutable-image-evidence.json --runtime "$RUNTIME_EVIDENCE" --report synchronous-revision-gate.json)
          fi
          node scripts/synchronous-revision-gate.mjs "${args[@]}"

      - name: Upload synchronous revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synchronous-revision-gate-${{ steps.revision.outputs.head }}
          path: synchronous-revision-gate.json
          if-no-files-found: error
          retention-days: 30
