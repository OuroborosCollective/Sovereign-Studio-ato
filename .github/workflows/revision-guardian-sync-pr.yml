name: Sovereign Revision Guardian PR Sync

on:
  workflow_dispatch:
    inputs:
      target_pr_number:
        description: Exact open same-repository pull request number
        required: true
        type: string
      expected_head_sha:
        description: Exact current PR head before synchronization
        required: true
        type: string
      expected_base_sha:
        description: Exact current main revision to merge into the PR branch
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: revision-guardian-pr-sync-${{ inputs.target_pr_number }}
  cancel-in-progress: false

jobs:
  sync-pr-branch:
    name: Synchronize exact main into PR branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Resolve exact same-repository PR identity
        id: resolve
        uses: actions/github-script@v7
        env:
          TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
        with:
          script: |
            const numberText = String(process.env.TARGET_PR_NUMBER || '').trim();
            const expectedHead = String(process.env.EXPECTED_HEAD_SHA || '').trim().toLowerCase();
            const expectedBase = String(process.env.EXPECTED_BASE_SHA || '').trim().toLowerCase();
            if (!/^[1-9][0-9]*$/.test(numberText)) {
              core.setFailed('TARGET_PR_NUMBER_INVALID');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHead) || !/^[0-9a-f]{40}$/.test(expectedBase)) {
              core.setFailed('EXPECTED_REVISION_INVALID');
              return;
            }
            const number = Number(numberText);
            const pull = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            })).data;
            const mainRef = (await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            })).data;
            const repositoryFullName = `${context.repo.owner}/${context.repo.repo}`;
            const headRepository = String(pull.head?.repo?.full_name || '');
            const headRef = String(pull.head?.ref || '');
            const headSha = String(pull.head?.sha || '').toLowerCase();
            const baseSha = String(mainRef.object?.sha || '').toLowerCase();
            if (pull.state !== 'open' || pull.base?.ref !== 'main') {
              core.setFailed('OPEN_MAIN_PR_REQUIRED');
              return;
            }
            if (headRepository !== repositoryFullName) {
              core.setFailed('FORK_PR_SYNC_FORBIDDEN');
              return;
            }
            if (!/^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$/.test(headRef) || headRef.includes('..')) {
              core.setFailed('PR_HEAD_REF_INVALID');
              return;
            }
            if (['main', 'master'].includes(headRef.toLowerCase())) {
              core.setFailed('PROTECTED_PR_HEAD_REF');
              return;
            }
            if (headSha !== expectedHead) {
              core.setFailed('PR_HEAD_IDENTITY_MISMATCH');
              return;
            }
            if (baseSha !== expectedBase) {
              core.setFailed('MAIN_REVISION_CHANGED');
              return;
            }
            const comparison = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: baseSha,
              head: headSha,
              per_page: 1,
            });
            const relation = String(comparison.data.status || 'unknown');
            core.setOutput('target_ref', headRef);
            core.setOutput('relation', relation);
            core.setOutput('already_current', String(['ahead', 'identical'].includes(relation)));

      - name: Checkout exact PR branch
        if: steps.resolve.outputs.already_current != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.target_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize exact main or prepare bounded recovery branch
        id: synchronize
        if: steps.resolve.outputs.already_current != 'true'
        env:
          TARGET_REF: ${{ steps.resolve.outputs.target_ref }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]]
          [[ "$TARGET_REF" != *".."* ]]
          test "$TARGET_REF" != main
          test "$TARGET_REF" != master
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE_SHA"
          git config user.name github-actions
          git config user.email github-actions@github.com

          if git merge --no-ff --no-edit "$EXPECTED_BASE_SHA" \
            -m "Synchronize confirmed main ${EXPECTED_BASE_SHA} into ${TARGET_REF}"; then
            git diff --check "$EXPECTED_HEAD_SHA..HEAD"
            UPDATED_HEAD_SHA="$(git rev-parse HEAD)"
            test "$UPDATED_HEAD_SHA" != "$EXPECTED_HEAD_SHA"
            git push origin "HEAD:${TARGET_REF}"
            REMOTE_HEAD_SHA="$(git ls-remote origin "refs/heads/${TARGET_REF}" | awk '{print $1}')"
            test "$REMOTE_HEAD_SHA" = "$UPDATED_HEAD_SHA"
            git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$REMOTE_HEAD_SHA"
            echo "mode=synchronized" >> "$GITHUB_OUTPUT"
            echo "updated_head_sha=$REMOTE_HEAD_SHA" >> "$GITHUB_OUTPUT"
            printf 'PR branch synchronized: %s -> %s; base %s\n' "$EXPECTED_HEAD_SHA" "$REMOTE_HEAD_SHA" "$EXPECTED_BASE_SHA"
            exit 0
          fi

          git merge --abort
          MERGE_BASE_SHA="$(git merge-base "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA")"
          [[ "$MERGE_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mapfile -t COMMITS < <(git rev-list --reverse --no-merges "${MERGE_BASE_SHA}..${EXPECTED_HEAD_SHA}")
          test "${#COMMITS[@]}" -gt 0
          test "${#COMMITS[@]}" -le 200

          RECOVERY_REF="sovereign/revision-recovery/pr-${TARGET_PR_NUMBER}-${EXPECTED_BASE_SHA:0:12}"
          git checkout --detach "$EXPECTED_BASE_SHA"
          git switch -c "$RECOVERY_REF"
          for commit in "${COMMITS[@]}"; do
            if ! git cherry-pick "$commit"; then
              git cherry-pick --abort || true
              echo "::error::Recovery cherry-pick conflicted at ${commit}; human code resolution is required."
              exit 1
            fi
          done
          git diff --check "$EXPECTED_BASE_SHA..HEAD"
          RECOVERY_HEAD_SHA="$(git rev-parse HEAD)"
          test "$RECOVERY_HEAD_SHA" != "$EXPECTED_BASE_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$RECOVERY_HEAD_SHA"
          git push origin "HEAD:refs/heads/${RECOVERY_REF}"
          REMOTE_RECOVERY_SHA="$(git ls-remote origin "refs/heads/${RECOVERY_REF}" | awk '{print $1}')"
          test "$REMOTE_RECOVERY_SHA" = "$RECOVERY_HEAD_SHA"
          echo "mode=recovery" >> "$GITHUB_OUTPUT"
          echo "recovery_ref=$RECOVERY_REF" >> "$GITHUB_OUTPUT"
          echo "updated_head_sha=$REMOTE_RECOVERY_SHA" >> "$GITHUB_OUTPUT"

      - name: Create replacement Draft PR after verified recovery
        id: recovery_pr
        if: steps.synchronize.outputs.mode == 'recovery'
        uses: actions/github-script@v7
        env:
          TARGET_PR_NUMBER: ${{ inputs.target_pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          RECOVERY_REF: ${{ steps.synchronize.outputs.recovery_ref }}
          RECOVERY_HEAD_SHA: ${{ steps.synchronize.outputs.updated_head_sha }}
        with:
          script: |
            const oldNumber = Number(process.env.TARGET_PR_NUMBER || 0);
            const expectedHead = String(process.env.EXPECTED_HEAD_SHA || '').toLowerCase();
            const expectedBase = String(process.env.EXPECTED_BASE_SHA || '').toLowerCase();
            const recoveryRef = String(process.env.RECOVERY_REF || '');
            const recoveryHead = String(process.env.RECOVERY_HEAD_SHA || '').toLowerCase();
            if (oldNumber < 1 || !/^[0-9a-f]{40}$/.test(expectedHead) || !/^[0-9a-f]{40}$/.test(expectedBase) || !/^[0-9a-f]{40}$/.test(recoveryHead)) {
              core.setFailed('RECOVERY_IDENTITY_INVALID');
              return;
            }
            if (!/^sovereign\/revision-recovery\/pr-[1-9][0-9]*-[0-9a-f]{12}$/.test(recoveryRef)) {
              core.setFailed('RECOVERY_REF_INVALID');
              return;
            }
            const oldPull = (await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: oldNumber })).data;
            if (oldPull.state !== 'open' || String(oldPull.head?.sha || '').toLowerCase() !== expectedHead || oldPull.base?.ref !== 'main') {
              core.setFailed('SOURCE_PR_CHANGED_DURING_RECOVERY');
              return;
            }
            const existing = await github.rest.pulls.list({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', head: `${context.repo.owner}:${recoveryRef}`, base: 'main', per_page: 10 });
            let replacement = existing.data[0];
            if (!replacement) {
              replacement = (await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Revision Recovery] ${oldPull.title}`,
                head: recoveryRef,
                base: 'main',
                draft: true,
                body: [
                  `Replaces #${oldNumber} after the trusted Revision Guardian could not merge current main cleanly.`,
                  '',
                  `Source head: \`${expectedHead}\``,
                  `Required base: \`${expectedBase}\``,
                  `Recovery head: \`${recoveryHead}\``,
                  '',
                  'The recovery controller only replayed the original non-merge commits onto the exact current main revision. This Draft PR must pass all normal revision-bound checks before merge.',
                ].join('\n'),
              })).data;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: oldNumber,
              body: `Revision Guardian prepared replacement Draft PR #${replacement.number} on exact main ${expectedBase}. The original PR remains open until the replacement evidence is reviewed.`,
            });
            core.setOutput('replacement_pr_number', String(replacement.number));

      - name: Report already-current branch
        if: steps.resolve.outputs.already_current == 'true'
        run: |
          echo 'The PR head already contains the confirmed main revision; no mutation was necessary.'
