name: ChatGPT Memory 1908 Append

on:
  push:
    branches:
      - sovereign/chatgpt/single-agent-default-swarm-feature
    paths:
      - .github/workflows/chatgpt-memory-1908-append.yml

permissions:
  contents: write

jobs:
  append-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sovereign/chatgpt/single-agent-default-swarm-feature
          fetch-depth: 1
      - name: Append exactly one evidence-bound entry
        shell: bash
        env:
          ENTRY_B64: 
        run: |
          set -Eeuo pipefail
          marker='### 2026-09-10 — FreeLLM single-agent default with opt-in swarm'
          if grep -Fqx "$marker" Memory.md; then
            echo 'Memory entry already exists; refusing duplicate append.' >&2
            exit 1
          fi
          printf '%s' "$ENTRY_B64" | base64 --decode >> Memory.md
          git diff --check
      - name: Remove one-shot workflow and commit memory entry
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/chatgpt-memory-1908-append.yml
          git diff --check
          git config user.name 'Ouroboros Collective'
          git config user.email 'projectouroboroscollective@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs(memory): record single-agent default integration evidence'
          git push origin HEAD:sovereign/chatgpt/single-agent-default-swarm-feature
