name: Sovereign Release Readback Contract

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/sovereign-chatgpt-mcp/deploy/run-coordinated-release-readback.py'
      - 'tools/sovereign-chatgpt-mcp/tests/test_runtime_readback_bootstrap_protocol.py'
      - '.github/workflows/sovereign-release-readback-bootstrap.yml'
      - '.github/workflows/sovereign-release-readback-contract.yml'
  push:
    branches: [main]
    paths:
      - 'tools/sovereign-chatgpt-mcp/deploy/run-coordinated-release-readback.py'
      - 'tools/sovereign-chatgpt-mcp/tests/test_runtime_readback_bootstrap_protocol.py'
      - '.github/workflows/sovereign-release-readback-bootstrap.yml'
      - '.github/workflows/sovereign-release-readback-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOVEREIGN_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  readback-contract:
    name: Forced readback bootstrap contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authoritative revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOVEREIGN_REVISION }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout
        run: |
          set -Eeuo pipefail
          [[ "$SOVEREIGN_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOVEREIGN_REVISION"

      - name: Compile forced readback entrypoint
        run: python3 -m py_compile tools/sovereign-chatgpt-mcp/deploy/run-coordinated-release-readback.py

      - name: Run dual-protocol and bootstrap boundary tests
        run: python3 tools/sovereign-chatgpt-mcp/tests/test_runtime_readback_bootstrap_protocol.py
