name: Temporary Focused MCP Documentation Contract Verification

on:
  push:
    branches:
      - fix/mcp-doc-contract-drift-2026-08-03
    paths:
      - .github/workflows/tmp-verify-mcp-doc-contract.yml

permissions:
  contents: write

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-doc-contract-drift-2026-08-03
          fetch-depth: 1
      - name: Execute exact repaired contract
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          path = Path('tools/sovereign-chatgpt-mcp/tests/test_install_contract.py').resolve()
          spec = importlib.util.spec_from_file_location('test_install_contract', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.test_documented_password_paramiko_fallback_is_retired()
          marker = {
              'status': 'FOCUSED_MCP_DOCUMENTATION_CONTRACT_VERIFIED',
              'testedFunction': 'test_documented_password_paramiko_fallback_is_retired',
              'testedHead': '${{ github.sha }}',
          }
          Path('.tmp-mcp-doc-contract-verification.json').write_text(
              json.dumps(marker, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Commit success marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-mcp-doc-contract-verification.json
          git commit -m 'chore: record focused MCP contract verification'
          git push origin HEAD:fix/mcp-doc-contract-drift-2026-08-03
