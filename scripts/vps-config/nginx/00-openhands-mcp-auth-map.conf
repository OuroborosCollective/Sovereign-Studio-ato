# Canonical nginx http-context map that gates the OpenHands MCP route.
#
# This file is sourced from the repository and installed by
# scripts/vps-config/setup-nginx.sh into /etc/nginx/conf.d/. It must NOT
# be edited by hand on a live VPS: the installer regenerates it from the
# operator-managed secret file
#   /opt/sovereign-owner-managed/openhands_mcp_api_key.txt
# which must exist with mode 0600 and owner root:root before this map can
# be activated.
#
# Contract:
#   - $http_x_api_key is the inbound X-API-Key header value (empty if absent).
#   - $mcp_authorized is 1 only if the header exactly matches the key from
#     the operator-managed secret file.
#   - Any other header value, no header, an empty string, a repeated header
#     with mismatched values, or a missing secret file yields 0.
#
# The map file is loaded at nginx startup and on HUP. Rotating the key
# therefore requires regenerating the .map file and sending HUP to nginx.
#
# The variable names and include path are stable contract identifiers and
# must not be renamed without coordinating with the MCP reverse-proxy tests
# in scripts/vps-config/tests/test-nginx-mcp-contract.test.cjs.

map $http_x_api_key $mcp_authorized {
    default 0;
    include /etc/nginx/conf.d/openhands-mcp-api-key.map;
}
