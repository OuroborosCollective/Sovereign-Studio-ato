# Canonical nginx server template for openhands.arelorian.de.
#
# This file is sourced from the repository and installed by
# scripts/vps-config/setup-nginx.sh. It is symlinked into
# /etc/nginx/conf.d/ on the VPS so it is loaded in http context, alongside
# 00-openhands-mcp-auth-map.conf which defines the $mcp_authorized map.
#
# Routes:
#   /         -> OpenHands admin console on 127.0.0.1:3000 (operator UI only)
#   /sockets  -> WebSocket endpoint on 127.0.0.1:3000
#   = /mcp    -> Authenticated MCP reverse-proxy to 127.0.0.1:8090/mcp
#                Requires header `X-API-Key: <expected-key>`; anything else
#                returns 401 and never reaches the backend.
#
# Intentionally NOT exposed:
#   /sse      -> legacy SSE transport; superseded by Streamable-HTTP /mcp
#   /messages  -> legacy POST endpoint; superseded by Streamable-HTTP /mcp
#
# Bearer auth is intentionally not supported. A separate bearer capability
# must be designed, approved and reviewed before adding `Authorization:
# Bearer ...` support. Adding it on top of X-API-Key would silently widen
# the trust surface.

server {
    listen 80;
    server_name openhands.arelorian.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name openhands.arelorian.de;

    ssl_certificate /etc/letsencrypt/live/openhands.arelorian.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openhands.arelorian.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /sockets {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # MCP reverse-proxy: exact-match /mcp, authenticated by X-API-Key only.
    #
    # The map $mcp_authorized is defined in
    # /etc/nginx/conf.d/00-openhands-mcp-auth-map.conf and reads from
    # /etc/nginx/conf.d/openhands-mcp-api-key.map which is generated from
    # /opt/sovereign-owner-managed/openhands_mcp_api_key.txt by the
    # installer.
    #
    # No other path proxies to the MCP backend. A request for /mcp/foo,
    # /mcp? or /MCP will return 404 here and will not reach the backend.
    location = /mcp {
        if ($mcp_authorized != 1) {
            return 401;
        }

        proxy_pass http://127.0.0.1:8090/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        access_log /var/log/nginx/openhands.arelorian.de.mcp.access.log;
        error_log  /var/log/nginx/openhands.arelorian.de.mcp.error.log;
    }

    access_log /var/log/nginx/openhands.arelorian.de.access.log;
    error_log /var/log/nginx/openhands.arelorian.de.error.log;
}
