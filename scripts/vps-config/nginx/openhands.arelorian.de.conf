# OpenHands runtime integration retired by issue #1196.
#
# This vhost is intentionally fail-closed. It keeps the historical hostname from
# falling through to an unrelated default TLS server while exposing no Browserless,
# MCP, agent, credential, websocket, or other upstream route.
#
# Browserless and Sovereign MCP remain independent private runtime services.
# Neither service is reachable through this retired hostname.

server {
    listen 80;
    server_name openhands.arelorian.de;
    return 410;
}

server {
    listen 443 ssl http2;
    server_name openhands.arelorian.de;

    ssl_certificate /etc/letsencrypt/live/openhands.arelorian.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openhands.arelorian.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 410;

    access_log /var/log/nginx/openhands.arelorian.de.access.log;
    error_log /var/log/nginx/openhands.arelorian.de.error.log;
}
