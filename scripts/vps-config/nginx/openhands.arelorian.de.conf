# Fail-closed configuration for openhands.arelorian.de
# Issue: #1196 - OpenHands proxy drift: Browserless runs at port 3000, not OpenHands.
# The MCP runs separately at port 8090 with its own authenticated route contract.
# This domain is intentionally disabled until a new authenticated upstream is configured.
#
# Previous config proxied to port 3000 (Browserless) - this is a proxy drift.
# All requests return 403 until proper upstream is verified.

server {
    listen 80;
    server_name openhands.arelorian.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name openhands.arelorian.de;

    ssl_certificate /etc/letsencrypt/live/openhands.arelorian.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openhands.arelorian.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Fail-closed: return 403 for all requests
    # MCP route at /mcp requires separate authenticated TLS reverse-proxy contract
    location / {
        return 403;
    }

    location /sockets {
        return 403;
    }

    access_log /var/log/nginx/openhands.arelorian.de.access.log;
    error_log /var/log/nginx/openhands.arelorian.de.error.log;
}
