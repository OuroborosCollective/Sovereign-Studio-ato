# =============================================================================
# Sovereign Backend Docker Compose Configuration
# =============================================================================
# This configuration deploys the Sovereign Backend with automatic database
# migrations on startup.
#
# Networks:
# - supabase_default: Network for PostgreSQL database access
# - areloria_arelorian-network: Network for Areloria services
# - sovereign-private: direct OpenRouter and FreeLLM routing network; FreeLLMAPI
#   stays intact and OmniRoute replaces only the retired FreeLLMPool route source.
# - sovereign-desktop: internal-only bridge to the per-attempt desktop worker.
# =============================================================================

services:
  sovereign-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOVEREIGN_SOURCE_REVISION: ${SOVEREIGN_SOURCE_REVISION:-unverified}
    container_name: sovereign-backend
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "127.0.0.1:8788:8787"
    env_file:
      - .env
      - /opt/sovereign-chatgpt-tools/backend-runtime.env
    environment:
      # Existing FreeLLMAPI contract intentionally remains unchanged.
      SOVEREIGN_FREELLMAPI_UNIFIED_KEY_FILE: /opt/sovereign-owner-managed/freellmapi_unified_key.txt
      # Protected owner inputs are persisted outside the repository/container.
      # Raw values are never carried in Compose, logs, receipts or MCP arguments.
      # Wolfram CAG and Wolfram Cloud use intentionally separate credentials.
      SOVEREIGN_OWNER_INPUT_TARGETS_JSON: '{"github_token":{"label":"GitHub Owner recovery credential","fieldLabel":"GitHub Zugriffsschlüssel / PAT","path":"/opt/sovereign-owner-managed/github_owner_token.txt","maxBytes":8192,"kind":"credential"},"wolfram_cag_api_key":{"label":"Wolfram CAG credential","fieldLabel":"Wolfram CAG API-Key","path":"/opt/sovereign-owner-managed/wolfram_cag_api_key.txt","maxBytes":8192,"kind":"credential"},"wolfram_cloud_consumer_key":{"label":"Wolfram Cloud secured authentication consumer key","fieldLabel":"Wolfram Cloud Consumer Key","path":"/opt/sovereign-owner-managed/wolfram_cloud_consumer_key.txt","maxBytes":8192,"kind":"credential"},"wolfram_cloud_consumer_secret":{"label":"Wolfram Cloud secured authentication consumer secret","fieldLabel":"Wolfram Cloud Consumer Secret","path":"/opt/sovereign-owner-managed/wolfram_cloud_consumer_secret.txt","maxBytes":8192,"kind":"credential"}}'
      WOLFRAM_CAG_API_KEY_FILE: /opt/sovereign-owner-managed/wolfram_cag_api_key.txt
      WOLFRAM_CLOUD_CONSUMER_KEY_FILE: /opt/sovereign-owner-managed/wolfram_cloud_consumer_key.txt
      WOLFRAM_CLOUD_CONSUMER_SECRET_FILE: /opt/sovereign-owner-managed/wolfram_cloud_consumer_secret.txt
      WOLFRAM_PARTNER_NOTEBOOK_PATH: Sovereign/Wolfram-CAG/Partner-Analysis.nb
      SOVEREIGN_RUNTIME_ENVIRONMENT: production
      # Source revision is baked into the image; do not override it at runtime.
      SOVEREIGN_IMAGE_DIGEST: ${SOVEREIGN_IMAGE_DIGEST:-unverified}
      SOVEREIGN_MAX_REQUEST_BYTES: "67108864"
      SOVEREIGN_LLM_ROUTE_SCANNER_ENABLED: "1"
      SOVEREIGN_LLM_ROUTE_SCANNER_INTERVAL_SECONDS: "3600"
      SOVEREIGN_LLM_ROUTE_SCANNER_INITIAL_DELAY_SECONDS: "30"
      SOVEREIGN_LLM_ROUTE_SCANNER_MAX_CANDIDATES: "24"
      SOVEREIGN_LLM_ROUTE_SCANNER_MAX_WORKERS: "4"
      SOVEREIGN_OMNIROUTE_EXECUTION_ENABLED: "1"
      SOVEREIGN_OMNIROUTE_EXECUTION_INITIAL_DELAY_SECONDS: "15"
      SOVEREIGN_OMNIROUTE_EXECUTION_INTERVAL_SECONDS: "21600"
      SOVEREIGN_AGENT_WORKSPACE_ROOT: /var/lib/sovereign-agent/workspaces
      SOVEREIGN_AGENT_WORKSPACE_UID: "10001"
      SOVEREIGN_AGENT_WORKSPACE_GID: "10001"
      # Activation data is opaque, scoped and host-private; the backend never
      # returns its filesystem paths or scope values to the user-facing API.
      SOVEREIGN_DESKTOP_ACTIVATION_ROOT: /var/lib/sovereign-desktop-activations
      SOVEREIGN_DESKTOP_ACTIVATION_KEY_FILE: /opt/sovereign-owner-managed/desktop_activation_key.txt
      SOVEREIGN_DESKTOP_WORKER_IMAGE: ${SOVEREIGN_DESKTOP_WORKER_IMAGE:-}
    volumes:
      - /opt/secure:/opt/secure:ro
      - /opt/sovereign-owner-managed:/opt/sovereign-owner-managed:rw
      - /opt/sovereign-agent-workspaces:/var/lib/sovereign-agent/workspaces:rw
      - /opt/sovereign-desktop-activations:/var/lib/sovereign-desktop-activations:rw
    restart: unless-stopped
    networks:
      - supabase_default
      - areloria_arelorian-network
      - sovereign-private
      - sovereign-desktop
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/health/ready', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Replaces only the retired FreeLLMPool/FreeLLM-Routes source. The separate
  # sovereign-freellmapi service and its owner-managed provider keys stay intact.
  omniroute:
    image: docker.io/diegosouzapw/omniroute:3.8.48@sha256:badb560971fdc23c2fb84b3e8695116239ff215b4cca4b07076201a8efae7f0d
    container_name: sovereign-omniroute
    init: true
    user: "1000:1000"
    read_only: true
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 40s
    environment:
      NODE_ENV: production
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      DATA_DIR: /app/data
      OMNIROUTE_MEMORY_MB: "1024"
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - sovereign-omniroute-data:/app/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    restart: unless-stopped
    networks:
      sovereign-private:
        aliases:
          - omniroute
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      sovereign.component: omniroute
      sovereign.replaces: freellmpool-routes
      sovereign.version: "3.8.48"
      sovereign.image-digest: sha256:badb560971fdc23c2fb84b3e8695116239ff215b4cca4b07076201a8efae7f0d

networks:
  supabase_default:
    external: true
  areloria_arelorian-network:
    external: true
  sovereign-private:
    external: true
  sovereign-desktop:
    name: sovereign-desktop
    internal: true

volumes:
  sovereign-omniroute-data:
    name: sovereign-omniroute-data
