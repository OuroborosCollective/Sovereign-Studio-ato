[project]
name = "sovereign-universal-toolchain"
version = "1.0.0"
description = "Reusable MCP + REST/OpenAPI toolchain for Sovereign Studio, Sandbox, GitHub Draft PR patching, and no-code LLM agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0,<1"
]

[project.scripts]
sovereign-toolchain = "sovereign_toolchain.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_toolchain"]
